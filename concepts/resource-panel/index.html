<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресурсная панель</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../release/panel.css">
<link rel="stylesheet" href="concepts.css">
<link rel="stylesheet" href="directions.css">
<link rel="stylesheet" href="variations.css">
<link rel="stylesheet" href="relief.css">
</head>
<body class="prototype" data-concept="relief" data-variation data-marks="glaze">
<a class="skip-link" href="#catalog">К каталогу ссылок</a>
<div class="workspace">
  <header class="gallery">
    <h1 class="relief-brand">Маршруты · Рельеф</h1>
    <span id="subt" hidden></span>
    <button id="relief-switch" class="control" type="button" data-menu="relief" aria-haspopup="dialog" aria-label="Вариации Рельефа">
      <span data-icon="layers"></span><span id="relief-name" class="wide-label">Стиль</span><span class="relief-chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="omni" id="omni">
      <span id="sIc"></span>
      <label for="q" class="sr">Поиск по ссылкам</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Найти ссылку" aria-controls="catalog">
      <span class="cnt" id="cnt"></span>
      <kbd id="kbdK">Ctrl K</kbd>
      <button class="clr" id="clr" type="button" aria-label="Очистить поиск"></button>
    </div>
    <div class="gallery-tools">
      <span id="check-slot"><button id="refresh" class="control" type="button" aria-label="Проверить доступность ссылок"><span id="refIc"></span><span class="wide-label">Проверить</span><span class="prog"></span></button></span>
      <button id="filter-button" class="control" type="button" data-menu="filters" aria-haspopup="dialog"
        aria-label="Фильтры"><span data-icon="params"></span><span class="wide-label">Фильтры</span><span id="filter-count"></span></button>
      <button class="control icon-button" type="button" data-menu="legend" aria-haspopup="dialog"
        aria-label="Условные обозначения" title="Условные обозначения"><span data-icon="info"></span></button>
      <button class="control icon-button" type="button" data-menu="settings" aria-haspopup="dialog"
        aria-label="Настройки" title="Настройки"><span data-icon="gear"></span></button>
    </div>
  </header>
  <div class="catalog-bar">
    <nav id="views" aria-label="Подборки"></nav>
    <button id="sections-button" class="control" type="button" data-menu="sections" aria-haspopup="dialog" aria-label="Разделы">
      <span data-icon="layers"></span><span id="section-label" class="wide-label">Разделы</span>
    </button>
    <button id="scope" class="control" type="button" data-menu="scope" aria-haspopup="dialog" hidden>
      <span data-icon="panel"></span><span id="scope-label"></span><span aria-hidden="true">⌄</span>
    </button>
    <button id="health-view" class="control" type="button" data-action="view" data-id="health"
      aria-label="Доступность ссылок"><span id="health-readout"><span id="sum" class="sum" aria-live="polite"></span></span><span id="check-mode"></span></button>
    <label id="availability-toggle" title="Показывать недоступные ссылки">
      <input id="show-down" type="checkbox" checked aria-label="Показывать недоступные ссылки">
      <span class="down-label">Недоступные</span><span class="down-icon" aria-hidden="true">×</span>
    </label>
    <nav class="catalog-pages" aria-label="Страницы каталога">
      <button id="previous-page" class="control icon-button" type="button" data-action="page" data-id="-1" aria-label="Предыдущая страница">‹</button>
      <output id="range" aria-live="polite"></output>
      <button id="next-page" class="control icon-button" type="button" data-action="page" data-id="1" aria-label="Следующая страница">›</button>
    </nav>
  </div>
  <div id="quick-shelf" class="quick-shelf" hidden aria-label="Быстрый доступ">
    <nav id="quick-favorite" class="quick-group" aria-label="Избранное"></nav>
    <nav id="quick-meetings" class="quick-group" aria-label="Встречи"></nav>
  </div>
  <main id="catalog" tabindex="-1" aria-label="Каталог ссылок">
    <nav id="section-rail" aria-label="Разделы" hidden></nav>
    <section id="board" aria-label="Ссылки и разделы">
      <div id="board-mast" hidden></div>
      <div id="board-body"><div id="board-grid"></div></div>
    </section>
  </main>
</div>
<div id="menu" class="menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <header class="menu-header"><h2 id="menu-title"></h2>
    <button id="menu-close" class="control icon-button" type="button" data-action="close-menu" aria-label="Закрыть меню">×</button>
  </header>
  <p id="legend-hint" hidden></p>
  <div id="menu-main">
    <div id="menu-grid"></div>
    <section id="filter-panel" hidden aria-label="Фильтры">
      <div class="filters">
        <div class="fg" role="group" aria-label="Стенд" id="fEnv"><span>Стенд</span></div>
        <div class="fg" role="group" aria-label="Сегмент" id="fSeg"><span>Сегмент</span></div>
      </div>
      <button type="button" class="control" data-action="reset">Сбросить поиск и фильтры</button>
    </section>
    <section id="settings-panel" hidden aria-label="Настройки">
      <div class="settings-buttons">
        <button id="theme" class="control icon-button" type="button"></button>
        <button id="lock" class="control icon-button" type="button" aria-label="Администрирование" aria-haspopup="dialog"></button>
        <button id="resetUses" class="control icon-button" type="button" aria-label="Сбросить счётчики открытий"></button>
      </div>
      <label class="sort-control" for="sort">Порядок
        <select id="sort">
          <option value="source">Как в каталоге</option><option value="alpha">По названию</option><option value="usage">По частоте</option>
        </select>
      </label>
      <div class="settings-buttons">
        <button class="control" type="button" data-menu="groups">Видимые разделы</button>
        <a class="control" href="../../release/index.html">Текущий релиз ↗</a>
      </div>
      <label><input id="live" type="checkbox"> Проверять реальные адреса</label>
      <span id="data-mode"></span>
    </section>
  </div>
  <nav class="menu-pages" aria-label="Страницы меню" hidden>
    <button id="menu-previous" class="control icon-button" type="button" data-action="menu-page" data-id="-1" aria-label="Предыдущая страница меню">‹</button>
    <output id="menu-range" aria-live="polite"></output>
    <button id="menu-next" class="control icon-button" type="button" data-action="menu-page" data-id="1" aria-label="Следующая страница меню">›</button>
  </nav>
</div>
<div class="release-engine" aria-hidden="true" inert>
  <button id="gpBtn" type="button" aria-controls="gp"></button>
  <aside class="gp" id="gp" aria-label="Группы ссылок">
  <div class="gp-in">
    <div class="gp-ttl"><h2 id="gpTtl">Группы</h2><button class="btn ic" type="button" id="gpX" aria-label="Закрыть список групп"></button></div>
    <div class="gp-top">
      <label class="gs"><span id="gsIc"></span><span class="sr">Найти группу</span><input id="gq" type="search" autocomplete="off" spellcheck="false" placeholder="Найти группу"></label>
      <button class="gp-all" id="gpAll" type="button" hidden><span id="gaIc"></span><span>Показать все</span><em id="gaN"></em></button>
    </div>
    <ul class="gp-list" id="gpList"></ul>
    <p class="gp-hint">Клик — перейти к группе<br><kbd>Alt</kbd>+клик — только эта группа</p>
  </div>
</aside>
<section class="favs" aria-labelledby="favCap">
  <h2 class="cap" id="favCap">Избранное</h2>
  <nav class="dock" id="dock" aria-label="Часто открываемые"></nav>
</section>

<section class="meets" aria-labelledby="meetCap">
  <h2 class="mcap" id="meetCap">Встречи</h2>
  <nav class="mlist" id="meets" aria-label="Встречи Jazz"></nav>
</section>

<div class="idx" id="idx"></div>

</div>
<div class="gtip glass" id="gtip" aria-hidden="true"></div>

<div class="tip glass" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>
<div class="modal glass" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>
<aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="ver" hidden></div>

<!-- Экран ошибки загрузки данных (links.js не найден или содержит ошибку) -->
<div class="rp-err" id="rp-error" role="alert" hidden></div>


<script src="../../release/links.js"></script>
<script src="../../release/version.js"></script>
<script src="../../release/panel.js"></script>
<script src="concepts.js"></script>
<script src="editor-pages.js"></script>
</body>
</html>
