<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Концепты ресурсной панели</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../release/panel.css">
<link rel="stylesheet" href="concepts.css">
</head>
<body class="prototype">
<a class="skip-link" href="#catalog">К каталогу ссылок</a>
<header class="gallery">
  <label for="concept">Концепт</label>
  <select id="concept" aria-label="Выбрать концепт"></select>
  <div class="gallery-arrows">
    <button id="prev" type="button" aria-label="Предыдущий концепт">←</button>
    <button id="next" type="button" aria-label="Следующий концепт">→</button>
  </div>
  <a class="release-link" href="../../release/index.html">Текущая панель ↗</a>
</header>
<div class="workspace">
  <header class="masthead">
    <div class="page-intro">
      <p id="subt">Рабочие ссылки команды</p>
      <h1 id="concept-title">Ресурсная панель</h1>
      <p id="concept-hint"></p>
    </div>
    <div class="utility">
      <div id="sum" class="sum" aria-live="polite"></div>
      <span id="data-mode" class="data-mode"></span>
      <div class="utility-actions">
        <button id="refresh" class="btn" type="button" aria-label="Проверить доступность ссылок"><span id="refIc"></span><span class="bl">Проверить</span><span class="prog"></span></button>
        <button id="theme" class="btn ic" type="button"></button>
        <button id="lock" class="btn ic" type="button" aria-label="Администрирование" aria-haspopup="dialog"></button>
      </div>
    </div>
  </header>
  <section class="hero" aria-label="Поиск">
  <div class="omni" id="omni">
    <span id="sIc"></span>
    <label for="q" class="sr">Поиск по ссылкам</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Найти ссылку, раздел или стенд" role="combobox" aria-expanded="false" aria-controls="catalog" aria-autocomplete="list">
    <span class="cnt" id="cnt"></span>
    <kbd id="kbdK">Ctrl K</kbd>
    <button class="clr" id="clr" type="button" aria-label="Очистить поиск"></button>
  </div>
  <div class="filters">
    <div class="fg" role="group" aria-label="Стенд" id="fEnv"><span>Стенд</span></div>
    <div class="fg" role="group" aria-label="Сегмент" id="fSeg"><span>Сегмент</span></div>
  </div>
</section>
  <div class="controlbar">
    <nav id="views" class="views" aria-label="Подборки"></nav>
    <div class="options">
      <label class="sort-control">Порядок
        <select id="sort">
          <option value="source">Как в каталоге</option>
          <option value="alpha">По названию</option>
          <option value="usage">По частоте</option>
        </select>
      </label>
      <details id="preferences">
        <summary>Настройки</summary>
        <div class="preferences-body">
          <label><input id="show-down" type="checkbox" checked> Показывать недоступные</label>
          <label><input id="live" type="checkbox"> Проверять реальные адреса</label>
          <details id="group-pref">
            <summary>Видимые разделы</summary>
            <div id="group-toggles"></div>
            <button type="button" class="btn" data-action="show-groups">Показать все разделы</button>
          </details>
          <button id="resetUses" class="btn" type="button" aria-label="Сбросить счётчики открытий"></button>
        </div>
      </details>
    </div>
  </div>
  <main id="catalog" tabindex="-1" aria-label="Каталог ссылок"></main>
  <p id="results-status" class="sr" aria-live="polite"></p>
</div>
<div class="release-engine" aria-hidden="true" inert>
  <button id="gpBtn" type="button" aria-controls="gp"></button>
  <aside class="gp" id="gp" aria-label="Группы ссылок">
  <div class="gp-in">
    <div class="gp-ttl"><h2 id="gpTtl">Группы</h2><button class="btn ic" type="button" id="gpX" aria-label="Закрыть список групп"></button></div>
    <div class="gp-top">
      <label class="gs"><span id="gsIc"></span><span class="sr">Найти группу</span><input id="gq" type="search" autocomplete="off" spellcheck="false" placeholder="Найти группу"></label>
      <button class="gp-all" id="gpAll" type="button" hidden><span id="gaIc"></span><span>Показать все</span><em id="gaN"></em></button>
    </div>
    <ul class="gp-list" id="gpList"></ul>
    <p class="gp-hint">Клик — перейти к группе<br><kbd>Alt</kbd>+клик — только эта группа</p>
  </div>
</aside>
<section class="favs" aria-labelledby="favCap">
  <h2 class="cap" id="favCap">Избранное</h2>
  <nav class="dock" id="dock" aria-label="Часто открываемые"></nav>
</section>

<section class="meets" aria-labelledby="meetCap">
  <h2 class="mcap" id="meetCap">Встречи</h2>
  <nav class="mlist" id="meets" aria-label="Встречи Jazz"></nav>
</section>

<div class="idx" id="idx"></div>

</div>
<div class="gtip glass" id="gtip" aria-hidden="true"></div>

<div class="tip glass" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>
<div class="modal glass" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>
<aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="ver" id="ver" aria-hidden="true"></div>

<!-- Экран ошибки загрузки данных (links.js не найден или содержит ошибку) -->
<div class="rp-err" id="rp-error" role="alert" hidden></div>


<script src="../../release/links.js"></script>
<script src="../../release/version.js"></script>
<script src="../../release/panel.js"></script>
<script src="concepts.js"></script>
</body>
</html>
