      for (let i = 0; i < ids.length; i++) {
        const tid = ids[i];
        log("[" + (i + 1) + "/" + ids.length + "] " + tid);
        try {
          const fr = await fetchLeadersForAdmin(baseUrl, tid);
          if (!fr.ok) {
            log("[HTTP " + fr.status + "] «" + tid + "» — в файл пойдёт запись об ошибке.");
          }
          const pack = buildLeadersExportRecordArray(tid, fr);
          if (pack == null) {
            skipped++;
            skippedNotSaved.push({ tid: tid, reason: "пустой ответ" });
            log("Пропуск «" + tid + "»: нет JSON-тела при успешном HTTP — в файл не попадает.");
            continue;
          }
          results[tid] = pack;
          savedCount++;
          const root = pack[0];
          const empInTree = countEmployeeNumberFieldsInTree(root);
          const errPay = getExportErrorPayload(root);
          if (errPay) {
            log(
              "  → в файл «" +
                tid +
                "»: ERROR (tournament.error" +
                (errPay.code ? ", код " + errPay.code : "") +
                "), employeeNumber в дереве: " +
                empInTree +
                "."
            );
          } else if (root && root.success === false && root.body && root.body.tournament) {
            const lc = Array.isArray(root.body.tournament.leaders)
              ? root.body.tournament.leaders.length
              : 0;
            log(
              "  → в файл «" +
                tid +
                "»: «0 участников», leaders=" +
                lc +
                ", employeeNumber в дереве: " +
                empInTree +
                "."
            );
          } else {
            const cnt = countLeadersInResponseData(root);
            log(
              "  → в файл «" +
                tid +
                "»: записей в leaders — " +
                (cnt == null ? "?" : cnt) +
                ", непустых employeeNumber в дереве: " +
                empInTree +
                "."
            );
          }
        } catch (e) {
          log("[исключение] " + tid + (e && e.message ? ": " + e.message : ""));
          errors++;
        }
        if (i < ids.length - 1) await delay(gapMs);
      }

      if (skippedNotSaved.length > 0) {
        log(
          "Пропуски без записи в JSON (нет тела), шт.: " +
            skippedNotSaved.length +
            ": " +
            skippedNotSaved
              .map(function (x) {
                return x.tid;
              })
              .join(", ")
        );
      }

      if (savedCount === 0 || Object.keys(results).length === 0) {
        log(
          "Файл не создан: нечего записать (все ответы без тела при OK или сбой до записи). Пропусков: " +
            skipped +
            ", исключений: " +
            errors +
            "."
        );
        console.log(
          "[Турниры leadersForAdmin] Файл не создан. Пропусков: " + skipped + " | исключений: " + errors
        );
        return;
      }

      const jsonOut = JSON.stringify(results);
      if (jsonOut === "{}" || jsonOut.trim() === "{}") {
        log("Файл не создан: итоговый объект пустой {}.");
        console.log("[Турниры leadersForAdmin] Файл не создан: пустой объект {}.");
        return;
      }

      const fname = prefixForFile + getTimestamp() + ".json";
      let totalEmp = 0;
      const perTournament = [];
      Object.keys(results).forEach(function (k) {
        const pack = results[k];
        const rootData = pack && pack[0];
        const em = countEmployeeNumberFieldsInTree(rootData);
        totalEmp += em;
        var line = "«" + k + "»:";
        const errP = getExportErrorPayload(rootData);
        if (errP) {
          line +=
            " ERROR, код " +
            (errP.code != null ? String(errP.code) : "?") +
            ", employeeNumber=" +
            em;
        } else if (rootData && rootData.success === false && rootData.body && rootData.body.tournament) {
          var t = rootData.body.tournament;
          line +=
            " " +
            (t.contestants != null ? String(t.contestants) : "0 участников") +
            ", leaders=" +
            (Array.isArray(t.leaders) ? t.leaders.length : 0) +
            ", employeeNumber=" +
            em;
        } else {
          const lc = countLeadersInResponseData(rootData);
          line += " leaders=" + (lc == null ? "?" : lc) + ", employeeNumber=" + em;
        }
        perTournament.push(line);
      });
      downloadJson(fname, results);
      log(
        "Готово («" +
          (sourceTag || "") +
          "»). Записей в файле: " +
          savedCount +
          " | Σ employeeNumber по дереву: " +
          totalEmp +
          " | пропусков (без тела): " +
          skipped +
          ", исключений: " +
          errors +
          "."
      );
      log("  Детально по турнирам в файле: " + perTournament.join(" | "));
      log("  Файл: " + fname);
      console.log(
        "[Турниры leadersForAdmin] Готово. Файл: " +
          fname +
          " | записей в файле: " +
          savedCount +
          " | пропусков (без тела): " +
          skipped +
          " | исключений: " +
          errors +
          " | Σ employeeNumber по дереву: " +
          totalEmp
      );
    } finally {
      exportBusy = false;
    }
  }

  const labActions = document.createElement("div");
  labActions.style.cssText = "font-weight:700;margin:12px 0 8px;color:#0f172a;font-size:12px;";
  labActions.textContent = "Запуск: одна кнопка — сразу выгрузка (для .txt и CSV сначала откроется выбор файла)";
  panelScroll.appendChild(labActions);

  const actionGrid = document.createElement("div");
  actionGrid.style.cssText =
    "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px;";
  if (typeof window.matchMedia === "function" && window.matchMedia("(max-width:560px)").matches) {
    actionGrid.style.gridTemplateColumns = "1fr";
  }

  const btnBase =
    "padding:10px 12px;font-size:11px;cursor:pointer;border:none;border-radius:8px;font-weight:600;" +
    "color:#fff;text-align:center;line-height:1.35;box-sizing:border-box;width:100%;";

  function addGridButton(label, bg, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.style.cssText = btnBase + "background:" + bg + ";";
    b.addEventListener("click", onClick);
    actionGrid.appendChild(b);
    return b;
  }

  // Скрытый input: выбор .txt → чтение → разбор кодов → runExport
  const fileInputTxtRun = document.createElement("input");
  fileInputTxtRun.type = "file";
  fileInputTxtRun.accept = ".txt,.csv,text/plain,text/csv";
  fileInputTxtRun.setAttribute("aria-label", "Файл со списком кодов турнира");
  fileInputTxtRun.style.cssText =
    "position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;";
  panelScroll.appendChild(fileInputTxtRun);
  fileInputTxtRun.addEventListener("change", function () {
    const f = fileInputTxtRun.files && fileInputTxtRun.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function () {
      const text = String(reader.result || "");
      try {
        fileInputTxtRun.value = "";
      } catch (eClr) {}
      const ids = parseTournamentCodesFromText(text);
      if (ids.length === 0) {
        log("В файле не найдено кодов турнира (ожидаются латиница, цифры, _ и -).");
        return;
      }
      void runExport(ids, "файл .txt");
    };
    reader.readAsText(f, "UTF-8");
  });

  addGridButton("По тексту в поле выше", "#7c3aed", function () {
    const ids = parseTournamentCodesFromText(ta.value);
    if (ids.length === 0) {
      log("В общем поле нет кодов турнира.");
      return;
    }
    void runExport(ids, "текст в поле");
  });

  const btnTxtFile = document.createElement("button");
  btnTxtFile.type = "button";
  btnTxtFile.textContent = "Файл .txt — выбрать и сразу выгрузить";
  btnTxtFile.style.cssText = btnBase + "background:#2563eb;";
  btnTxtFile.addEventListener("click", function () {
    fileInputTxtRun.click();
  });
  actionGrid.appendChild(btnTxtFile);

  panelScroll.appendChild(actionGrid);

  /**
   * Чекбоксы фильтра статусов CSV.
   * @param {string[]} labels — подписи статусов (как в CSV)
   * @param {HTMLElement} container
   * @param {string[]} defaultChecked — какие из labels отмечены при открытии панели
   */
  function makeStatusChecks(labels, container, defaultChecked) {
    const map = {};
    const onByDefault = {};
    (defaultChecked || []).forEach(function (s) {
      onByDefault[s] = true;
    });
    const grid = document.createElement("div");
    grid.style.cssText =
      "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;align-items:center;";
    labels.forEach(function (lbl) {
      const row = document.createElement("div");
      row.style.cssText =
        "margin:0;color:#111827;line-height:1.35;display:flex;align-items:center;gap:6px;min-width:0;";
      const c = document.createElement("input");
      c.type = "checkbox";
      c.checked = !!onByDefault[lbl];
      map[lbl] = c;
      row.appendChild(c);
      const sp = document.createElement("span");
      sp.style.cssText = "color:#334155;font-size:11px;word-break:break-word;";
      sp.textContent = lbl;
      row.appendChild(sp);
      grid.appendChild(row);
    });
    container.appendChild(grid);
    return map;
  }

  /** Значение option «свой заголовок» в select колонок CSV. */
  const CSV_COLUMN_SELECT_CUSTOM = "__custom__";

  /**
   * Выпадающий список имён колонки (пресеты как раньше в отдельных полях) + при выборе «Другой…» — поле ввода.
   * @param {HTMLElement} container
   * @param {string} labelText
   * @param {string} selectId
   * @param {string[]} presets
   * @param {string} initialValue
   * @returns {{ getHeader: function(): string }}
   */
  function appendLabeledColumnSelect(container, labelText, selectId, presets, initialValue) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "min-width:0;display:flex;flex-direction:column;gap:6px;";
    const lab = document.createElement("label");
    lab.setAttribute("for", selectId);
    lab.style.cssText =
      "display:flex;flex-direction:column;gap:4px;font-size:10px;color:#334155;font-weight:600;margin:0;";
    const span = document.createElement("span");
    span.textContent = labelText;
    const sel = document.createElement("select");
    sel.id = selectId;
    sel.style.cssText =
      "padding:6px 8px;font-size:11px;border:1px solid #94a3b8;border-radius:6px;color:#111827;" +
      "background:#fff;box-sizing:border-box;width:100%;color-scheme:light;cursor:pointer;";
    const init = initialValue || presets[0] || "";
    presets.forEach(function (p) {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      if (p === init) opt.selected = true;
      sel.appendChild(opt);
    });
    const optCustom = document.createElement("option");
    optCustom.value = CSV_COLUMN_SELECT_CUSTOM;
    optCustom.textContent = "Другой заголовок…";
    sel.appendChild(optCustom);

    const customInp = document.createElement("input");
    customInp.type = "text";
    customInp.setAttribute("aria-label", labelText + " — свой текст");
    customInp.autocomplete = "off";
    customInp.placeholder = "Имя колонки как в 1-й строке CSV";
    customInp.style.cssText =
      "display:none;padding:6px 8px;font-size:11px;border:1px solid #64748b;border-radius:6px;color:#111827;" +
      "background:#fff;box-sizing:border-box;width:100%;color-scheme:light;";

    function syncCustomVisibility() {
      const show = sel.value === CSV_COLUMN_SELECT_CUSTOM;
      customInp.style.display = show ? "block" : "none";
      if (!show) customInp.value = "";
    }
    sel.addEventListener("change", syncCustomVisibility);
    syncCustomVisibility();

    lab.appendChild(span);
    lab.appendChild(sel);
    wrap.appendChild(lab);
    wrap.appendChild(customInp);
    container.appendChild(wrap);

    return {
      getHeader: function () {
        if (sel.value === CSV_COLUMN_SELECT_CUSTOM) {
          var t = (customInp.value || "").trim();
          return t || presets[0] || "";
        }
        return (sel.value || "").trim() || presets[0] || "";
      }
    };
  }

  /**
   * Нижняя половина CSV: фильтр статусов только этого блока + кнопка выбора файла.
   * Имена колонок кода и статуса всегда берутся из общего верха (csvCodeCtl / csvStatusCtl);
   * набор чекбоксов allow — только из makeStatusChecks(cfg.labels) этого экземпляра.
   * @param {{ border: string, bg: string, labels: string[], defaultCheckedStatusLabels: string[], fileAria: string, runTag: string, filterBlockTitle: string, filterBlockSubtitle: string, buttonLabel: string }} cfg
   * @param {{ getHeader: function(): string }} csvCodeCtl
   * @param {{ getHeader: function(): string }} csvStatusCtl
   * @param {function(string[], string): void} runExportFn
   */
  function createCsvSideBlock(cfg, csvCodeCtl, csvStatusCtl, runExportFn) {
    const col = document.createElement("div");
    col.style.cssText =
      "min-width:0;padding:12px;border-radius:10px;border:1px solid " +
      cfg.border +
      ";background:" +
      cfg.bg +
      ";box-sizing:border-box;display:flex;flex-direction:column;gap:8px;";

    const h = document.createElement("div");
    h.style.cssText = "font-weight:700;font-size:12px;color:#0f172a;";
    h.textContent = cfg.filterBlockTitle;
    col.appendChild(h);

    const sub = document.createElement("div");
    sub.style.cssText = "font-size:10px;color:#64748b;line-height:1.35;";
    sub.textContent = cfg.filterBlockSubtitle;
    col.appendChild(sub);

    const fileInLocal = document.createElement("input");
    fileInLocal.type = "file";
    fileInLocal.accept = ".txt,.csv,text/plain,text/csv";
    fileInLocal.setAttribute("aria-label", cfg.fileAria);
    fileInLocal.style.cssText =
      "position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;";

    const fileStat = document.createElement("div");
    fileStat.style.cssText = "font-size:10px;color:#64748b;line-height:1.35;word-break:break-all;";
    fileStat.textContent = "Последний CSV-файл: не выбирали.";

    const filtWrap = document.createElement("div");
    filtWrap.style.cssText = "margin-top:4px;padding-top:10px;border-top:1px solid rgba(15,23,42,.08);";
    const filtLab = document.createElement("div");
    filtLab.style.cssText = "font-weight:600;font-size:11px;color:#334155;margin-bottom:6px;";
    filtLab.textContent =
      "Фильтр статусов только для этой кнопки («" + cfg.runTag + "»). Имена колонок — из блока выше.";
    filtWrap.appendChild(filtLab);
    const checks = makeStatusChecks(cfg.labels, filtWrap, cfg.defaultCheckedStatusLabels);

    function buildAllowMapFromThisBlockOnly() {
      const allow = {};
      Object.keys(checks).forEach(function (k) {
        allow[k] = checks[k].checked;
      });
      return allow;
    }

    /** Колонки из общей панели; фильтр статусов — только чекбоксы этого нижнего блока. */
    function codesFromCsvText(csvText) {
      const allow = buildAllowMapFromThisBlockOnly();
      var codeH = csvCodeCtl.getHeader() || CSV_CODE_COLUMN_PRESETS[0];
      var statH = csvStatusCtl.getHeader() || CSV_STATUS_COLUMN_PRESETS[0];
      return codesFromCsvByColumns(csvText, allow, codeH, statH, function (w) {
        log(w);
      });
    }

    fileInLocal.addEventListener("change", function () {
      const f = fileInLocal.files && fileInLocal.files[0];
      if (!f) return;
      const lastCsvName = f.name || "";
      const reader = new FileReader();
      reader.onload = function () {
        const lastCsv = String(reader.result || "");
        fileStat.textContent = "Последний файл: " + lastCsvName + " (" + lastCsv.length + " симв.)";
        log("CSV «" + cfg.runTag + "»: " + lastCsvName + ", символов: " + lastCsv.length);
        try {
          fileInLocal.value = "";
        } catch (eClr) {}
        const ids = codesFromCsvText(lastCsv);
        if (ids.length === 0) {
          log("Нет кодов (" + cfg.runTag + " файл). Проверьте имена колонок вверху и фильтр статусов в этом блоке.");
          return;
        }
        void runExportFn(ids, cfg.runTag + " файл");
      };
      reader.readAsText(f, "UTF-8");
    });

    const btnCsvFile = document.createElement("button");
    btnCsvFile.type = "button";
    btnCsvFile.textContent = cfg.buttonLabel;
    btnCsvFile.style.cssText =
      "padding:8px 10px;font-size:11px;cursor:pointer;background:#0f172a;color:#fff;border:none;border-radius:8px;font-weight:600;width:100%;box-sizing:border-box;line-height:1.35;";
    btnCsvFile.addEventListener("click", function () {
      fileInLocal.click();
    });

    col.appendChild(fileInLocal);
    col.appendChild(filtWrap);
    col.appendChild(btnCsvFile);
    col.appendChild(fileStat);

    return col;
  }

  const csvOuter = document.createElement("div");
  csvOuter.style.cssText =
    "margin-top:14px;padding:12px;border-radius:10px;border:1px solid #cbd5e1;" +
    "background:linear-gradient(180deg,#f8fafc 0%,#eef2ff 55%,#eff6ff 100%);box-sizing:border-box;";

  const csvMainTitle = document.createElement("div");
  csvMainTitle.style.cssText = "font-weight:700;font-size:14px;color:#0f172a;margin-bottom:4px;";
  csvMainTitle.textContent = "Загрузка из TOURNAMENT_SHEDULE / LIST";
  csvOuter.appendChild(csvMainTitle);

  const csvMainSub = document.createElement("div");
  csvMainSub.style.cssText = "font-size:10px;color:#64748b;line-height:1.4;margin-bottom:10px;";
  csvMainSub.textContent =
    "Имена колонок кода и статуса — один раз сверху для обеих кнопок. Ниже у каждой кнопки свой фильтр статусов (SHEDULE и LIST); при выгрузке берутся чекбоксы только из того блока, чью кнопку нажали. Выгрузка — после выбора файла.";
  csvOuter.appendChild(csvMainSub);

  const csvColsRow = document.createElement("div");
  csvColsRow.style.cssText =
    "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-bottom:12px;align-items:end;";
  if (typeof window.matchMedia === "function" && window.matchMedia("(max-width:560px)").matches) {
    csvColsRow.style.gridTemplateColumns = "1fr";
  }

  const csvCodeCtl = appendLabeledColumnSelect(
    csvColsRow,
    "Колонка с кодом турнира (1-я строка CSV)",
    "tournamentCsvColCode",
    CSV_CODE_COLUMN_PRESETS,
    CSV_CODE_COLUMN_PRESETS[0]
  );
  const csvStatusCtl = appendLabeledColumnSelect(
    csvColsRow,
    "Колонка со статусом для фильтра",
    "tournamentCsvColStatus",
    CSV_STATUS_COLUMN_PRESETS,
    CSV_STATUS_COLUMN_PRESETS[0]
  );
  csvOuter.appendChild(csvColsRow);

  const twoCol = document.createElement("div");
  twoCol.style.cssText =
    "display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch;";
  if (typeof window.matchMedia === "function" && window.matchMedia("(max-width:700px)").matches) {
    twoCol.style.gridTemplateColumns = "1fr";
  }

  twoCol.appendChild(
    createCsvSideBlock(
      {
        border: "#94a3b8",
        bg: "linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%)",
        labels: CSV1_STATUS_LABELS,
        defaultCheckedStatusLabels: CSV1_DEFAULT_CHECKED_STATUSES,
        fileAria: "CSV файл TOURNAMENT-SHEDULE",
        runTag: "TOURNAMENT-SHEDULE",
        filterBlockTitle: "Статусы как в TOURNAMENT-SHEDULE",
        filterBlockSubtitle:
          "Подписи чекбоксов должны совпадать со значениями в колонке статуса вашего CSV (часто АКТИВНЫЙ, ЗАВЕРШЕН…).",
        buttonLabel: "Выгрузить из TOURNAMENT-SHEDULE — выбрать CSV-файл"
      },
      csvCodeCtl,
      csvStatusCtl,
      runExport
    )
  );
  twoCol.appendChild(
    createCsvSideBlock(
      {
        border: "#3b82f6",
        bg: "linear-gradient(180deg,#eff6ff 0%,#dbeafe 100%)",
        labels: CSV2_STATUS_LABELS,
        defaultCheckedStatusLabels: CSV2_DEFAULT_CHECKED_STATUSES,
        fileAria: "CSV файл TOURNAMENT-LIST",
        runTag: "TOURNAMENT-LIST",
        filterBlockTitle: "Статусы как в TOURNAMENT-LIST",
        filterBlockSubtitle:
          "Подписи — как в колонке «Бизнес-статус турнира» (Активный, Завершен…).",
        buttonLabel: "Выгрузить из TOURNAMENT-LIST — выбрать CSV-файл"
      },
      csvCodeCtl,
      csvStatusCtl,
      runExport
    )
  );
  csvOuter.appendChild(twoCol);
  panelScroll.appendChild(csvOuter);

  root.appendChild(logWrap);

  const btnClose = document.createElement("button");
  btnClose.type = "button";
  btnClose.textContent = "Закрыть панель";
  // rgb() вместо #hex: при копировании в некоторых средах «#» мог пропасть и ломал color.
  btnClose.style.cssText =
    "margin-top:8px;width:100%;padding:8px;cursor:pointer;background:#f1f5f9;color:rgb(15,23,42);border:1px solid #94a3b8;border-radius:4px;font-size:12px;flex-shrink:0;";
  btnClose.addEventListener("click", function () {
    root.remove();
  });
  root.appendChild(btnClose);

  document.body.appendChild(root);
  devTrace.attachPanel(root);
  console.log(
    "[Турниры leadersForAdmin] Панель открыта. Подробный журнал — в окне «Журнал работы» на панели."
  );
}

startTournamentPanel();
})();

</script>
<script type="text/plain" class="embedded-script" data-script-file="UI_AutoTest.js">
// =============================================================================
// UI_AutoTest.js — последовательный проход по пунктам меню (запуск в DevTools)
// =============================================================================
// Назначение:
// 1) Последовательно найти и нажать ссылки меню по списку href.
// 2) Выдержать паузу между кликами.
// 3) Вывести в консоль статус по каждому пункту: OK / НЕ OK.
// =============================================================================

(function () {

        } else {

  function shortLink(href) {
    try {
      const u = new URL(href);
      const out = (u.pathname || "/") + (u.search || "") + (u.hash || "");
      return out || "/";
    } catch {
      return href;
    }
  }

  function shortLinkRelativeToParent(href, parentHref) {
    const childShort = shortLink(href);
    if (!parentHref) return childShort;
    try {
      const childUrl = new URL(href);
      const parentUrl = new URL(parentHref);
      if (childUrl.origin !== parentUrl.origin) return childShort;

      const childPath = childUrl.pathname || "/";
      const parentPath = parentUrl.pathname || "/";
      const normalizedParent = parentPath.endsWith("/") ? parentPath : parentPath + "/";
      if (!childPath.startsWith(normalizedParent)) return childShort;

      const relativePath = childPath.slice(normalizedParent.length);
      const relative = (relativePath ? relativePath : "/") + (childUrl.search || "") + (childUrl.hash || "");
      return relative || "/";
    } catch {
      return childShort;
    }
  }

      return parsed.filter(function (x) {
        return typeof x === "string";
      });
    } catch {
      return [];
    }
  }

  function persistLogLines() {
    try {

    }
  }

  function pushPersistentLogLine(line) {

    }
    persistLogLines();
  }

  function appendLogToFile(line) {
    if (logTransportMode !== "file" || !logFileHandle) return;
    fileLogWriteChain = fileLogWriteChain
      .then(async function () {
        const file = await logFileHandle.getFile();
        const writable = await logFileHandle.createWritable({ keepExistingData: true });
        await writable.seek(file.size);
        await writable.write(textEncoder.encode(line + "\n"));
        await writable.close();

      .catch(function (e) {
        logTransportMode = "session";
        logToFileCheckbox.checked = true;
        console.warn("[UI_LinksCrawler][LOG_FILE][ERROR]", e);

  function collectLinksOnCurrentPage() {
    const anchors = Array.from(document.querySelectorAll("a[href]"));
    const out = [];
    const seen = new Set();
    for (let i = 0; i < anchors.length; i++) {
      const raw = String(anchors[i].getAttribute("href") || "").trim();
      if (!raw) continue;
      const low = raw.toLowerCase();
      if (low === "#" || low.startsWith("javascript:") || low.startsWith("mailto:") || low.startsWith("tel:")) continue;
      const abs = toAbsoluteUrl(raw);
      if (!abs) continue;
      if (ONLY_SAME_ORIGIN) {
        try {
          if (new URL(abs).origin !== window.location.origin) continue;
        } catch {
          continue;
        }
      }
      if (seen.has(abs)) continue;
      seen.add(abs);
      out.push(abs);
    }
    return out;
  }

  function findAnchorByAbsoluteUrl(absUrl) {
    const anchors = Array.from(document.querySelectorAll("a[href]"));
    for (let i = 0; i < anchors.length; i++) {
      const raw = String(anchors[i].getAttribute("href") || "").trim();
      const abs = toAbsoluteUrl(raw);
      if (abs === absUrl) return anchors[i];
    }
    return null;
  }

  async function waitPageReadyWithMinDelay(minDelayMs) {
    const startedAt = Date.now();
    let timedOut = false;
    while (document.readyState !== "complete") {
      if (controller.stopped) {
        return { timedOut: false, elapsedMs: Date.now() - startedAt };
      }
      if (Date.now() - startedAt >= LOAD_TIMEOUT_MS) {
        timedOut = true;
        break;
      }
      await delay(POLL_INTERVAL_MS);
    }
    const elapsed = Date.now() - startedAt;
    if (elapsed < minDelayMs) await delay(minDelayMs - elapsed);
    return { timedOut, elapsedMs: Date.now() - startedAt };
  }

  async function ensureBackToUrl(targetUrl, minDelayMs) {
    if (window.location.href === targetUrl) return true;
    const startedAt = Date.now();
    while (window.location.href !== targetUrl) {
      if (controller.stopped) return false;
      if (Date.now() - startedAt > LOAD_TIMEOUT_MS) return false;
      history.back();
      await waitPageReadyWithMinDelay(minDelayMs);
    }
    return true;
  }

  async function openContextPath(path, minDelayMs) {
    // Для этапа 1 (пустой контекст) не делаем history.back():
    // иначе можно уйти на предыдущую страницу из истории браузера.
    if (!path || path.length === 0) {
      return { ok: true, reason: "" };
    }
    const atRoot = await ensureBackToUrl(rootUrl, minDelayMs);
    if (!atRoot) return { ok: false, reason: "Не удалось вернуться на root перед восстановлением контекста" };
    for (let i = 0; i < path.length; i++) {
      if (controller.stopped) return { ok: false, reason: "Остановлено пользователем" };
      const href = path[i];
      const a = findAnchorByAbsoluteUrl(href);
      if (!a) {
        return { ok: false, reason: "Не найден элемент пути контекста: " + href };
      }
      a.click();
      const wr = await waitPageReadyWithMinDelay(minDelayMs);
      if (wr.timedOut) return { ok: false, reason: "Таймаут загрузки при восстановлении контекста: " + href };
    }
    return { ok: true, reason: "" };
  }

        const headRow = document.createElement("label");
        headRow.style.cssText =
          "display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;align-items:start;margin-bottom:6px;font-weight:600;color:#93c5fd;word-break:break-all;";
        const parentCb = document.createElement("input");
        parentCb.type = "checkbox";
        parentCb.style.marginTop = "2px";
        const head = document.createElement("div");
        head.textContent = "Родитель: " + shortLink(parentNode ? parentNode.href : rootUrl);
        headRow.appendChild(parentCb);
        headRow.appendChild(head);
        group.appendChild(headRow);
        linksBox.appendChild(group);

        /** @type {HTMLInputElement[]} */
        const childCbs = [];
        function syncParentCheckbox() {
          if (childCbs.length === 0) {
            parentCb.checked = false;
            parentCb.indeterminate = false;
            return;
          }
          let selectedCount = 0;
          for (let i = 0; i < childKeys.length; i++) {
            const node = nodeByKey.get(childKeys[i]);
            if (node && node.selected) selectedCount++;
          }
          parentCb.checked = selectedCount === childCbs.length;
          parentCb.indeterminate = selectedCount > 0 && selectedCount < childCbs.length;
        }

        parentCb.addEventListener("change", function () {
          const checked = parentCb.checked;
          for (let i = 0; i < childKeys.length; i++) {
            const node = nodeByKey.get(childKeys[i]);
            if (node) node.selected = checked;
          }
          for (let i = 0; i < childCbs.length; i++) childCbs[i].checked = checked;
          parentCb.indeterminate = false;
        });
        const renderChildCount = Math.min(childKeys.length, maxRenderRowsPerParentGroup);
        for (let i = 0; i < renderChildCount; i++) {
          const childNode = nodeByKey.get(childKeys[i]);
          if (!childNode) continue;
          const row = document.createElement("label");
          row.style.cssText =
            "display:grid;grid-template-columns:18px 16px minmax(0,1fr);column-gap:8px;align-items:start;padding:4px 6px;border-radius:6px;background:#0f172a;margin-bottom:4px;";
          const dot = document.createElement("span");
          dot.textContent = statusDot(childNode.status);
          dot.style.cssText = "width:18px;display:inline-flex;justify-content:center;";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!childNode.selected;
          cb.style.marginTop = "2px";
          cb.addEventListener("change", function () {
            childNode.selected = cb.checked;
            syncParentCheckbox();
          });
          const txt = document.createElement("div");
          txt.style.cssText = "word-break:break-all;font-size:15px;";
          txt.textContent = shortLinkRelativeToParent(childNode.href, parentNode ? parentNode.href : rootUrl);
          row.appendChild(dot);
          row.appendChild(cb);
          row.appendChild(txt);
          group.appendChild(row);
          stageCheckboxByKey.set(childNode.key, cb);
          childCbs.push(cb);
        }
        if (childKeys.length > renderChildCount) {
          const note = document.createElement("div");
          note.textContent =
            "Показано " + renderChildCount + " из " + childKeys.length + " дочерних ссылок (ограничение UI).";
          note.style.cssText = "color:#fbbf24;padding:2px 4px;";
          group.appendChild(note);
        }
        syncParentCheckbox();
      });
    }
    updateInfo();
  }

  function renderRelations() {
    relBox.textContent = "";
    if (discoveredByParentKey.size === 0) {
      const empty = document.createElement("div");
      empty.textContent = "Пока нет данных о дочерних ссылках.";
      empty.style.color = "#9ca3af";
      relBox.appendChild(empty);
      return;
    }
    discoveredByParentKey.forEach(function (children, parentKey) {
      const parentNode = parentKey === "root" ? null : nodeByKey.get(parentKey);
      const group = document.createElement("div");
      group.style.cssText = "padding:6px;border:1px solid #1f2937;border-radius:6px;margin-bottom:6px;";
      const head = document.createElement("div");
      const headStatus = parentNode ? statusDot(parentNode.status) + " " : "⚪ ";
      head.textContent = headStatus + (parentNode ? shortLink(parentNode.href) : "ROOT: " + shortLink(rootUrl));
      head.style.cssText = "font-weight:600;color:#93c5fd;word-break:break-all;";
      group.appendChild(head);
      if (!children || children.length === 0) {
        const no = document.createElement("div");
        no.textContent = "  (дочерние ссылки не найдены)";
        no.style.color = "#9ca3af";
        group.appendChild(no);
      } else {
        for (let i = 0; i < children.length; i++) {
          const c = children[i];
          const childNodeKey = nodeKey((parentNode ? parentNode.depth : 0) + 1, parentKey === "root" ? null : parentKey, c.href);
          const childNode = nodeByKey.get(childNodeKey);
          const dot = childNode ? statusDot(childNode.status) : "⚪";
          const row = document.createElement("div");
          row.textContent =
            "  " +
            dot +
            " " +
            shortLinkRelativeToParent(c.href, parentNode ? parentNode.href : rootUrl) +
            (c.isNew ? "" : " (уже было раньше)");
          row.style.cssText = "word-break:break-all;color:#e5e7eb;";
          group.appendChild(row);
        }
      }
      relBox.appendChild(group);
    });
  }

  function rebuildFromDepthInput() {
    const n = Number(depthInput.value);
    maxDepth = Number.isFinite(n) ? Math.max(1, Math.min(MAX_DEPTH_LIMIT, Math.floor(n))) : 3;
    depthInput.value = String(maxDepth);
    renderPauseInputs();
    if (currentStage > maxDepth) currentStage = maxDepth;
    renderStageLinks();
  }

  function setUiBusy(v) {
    setPanelCompactMode(v);
    scanBtn.disabled = v;
    runBtn.disabled = v;
    checkAllBtn.disabled = v;
    uncheckAllBtn.disabled = v;
    depthInput.disabled = v;
    maxLinksPerStageInput.disabled = v;
    maxChildrenPerParentInput.disabled = v;
    maxRenderRowsStage1Input.disabled = v;
    maxRenderRowsPerParentGroupInput.disabled = v;
    resetLimitsBtn.disabled = v;
    pauseByDepthInput.forEach(function (inp) {
      inp.disabled = v;
    });
    stopBtn.disabled = false;
    for (const cb of stageCheckboxByKey.values()) cb.disabled = v;
    emergencyStopBtn.style.display = v ? "" : "none";
  }

  function addStageNode(depth, parentKey, parentUrl, contextPath, href, selected) {
    if (!stageKeys.has(depth)) stageKeys.set(depth, []);
    const stageList = stageKeys.get(depth);
    if (stageList.length >= maxLinksPerStage) {
      return null;
    }
    const key = nodeKey(depth, parentKey, href);
    if (nodeByKey.has(key)) return key;
    const node = {
      key,
      href,
      depth,
      parentKey,
      parentUrl,
      contextPath: contextPath.slice(),
      selected: !!selected,
      status: null,
      reason: "",
      fromUrl: "",
      toUrl: "",
      elapsedMs: 0,
    };
    nodeByKey.set(key, node);
    stageList.push(key);
    return key;
  }

  function stageScanCurrentPage() {
    if (currentStage !== 1) {
      appendLog("Скан вручную доступен для этапа 1. Для следующих этапов ссылки собираются на предыдущем запуске.");
      renderStageLinks();
      return;
    }
    const links = collectLinksOnCurrentPage();
    stageKeys.set(1, []);
    let skippedByStageLimit = 0;
    for (let i = 0; i < links.length; i++) {
      const href = links[i];
      const addedKey = addStageNode(1, null, rootUrl, [], href, true);
      if (!addedKey) {
        skippedByStageLimit++;
        continue;
      }
      discoveredHrefGlobal.add(href);
    }
    appendLog(
      "Этап 1: сканирование завершено. Найдено ссылок: " +
        links.length +
        ", добавлено в этап: " +
        (stageKeys.get(1) || []).length +
        (skippedByStageLimit > 0 ? ", пропущено по лимиту этапа: " + skippedByStageLimit : "") +
        ".",
    );
    renderStageLinks();
    renderRelations();
  }

  function resetCrawlerStateToStart() {
    controller.running = false;
    controller.stopped = false;
    currentStage = 1;
    nodeByKey.clear();
    stageKeys.clear();
    childrenByParentKey.clear();
    discoveredByParentKey.clear();
    discoveredHrefGlobal.clear();
    setUiBusy(false);
    renderStageLinks();
    renderRelations();
    updateInfo();
    appendLog("Состояние краулера сброшено. Готово к новому запуску с этапа 1.");
  }

  async function runStage() {
    if (controller.running) return;
    const keys = stageKeys.get(currentStage) || [];
    if (keys.length === 0) {
      appendLog("Этап " + currentStage + ": нет ссылок для запуска.");
      return;
    }
    const selectedKeys = keys.filter(function (k) {
      const n = nodeByKey.get(k);
      return n && n.selected;
    });
    if (selectedKeys.length === 0) {
      appendLog("Этап " + currentStage + ": нет отмеченных ссылок.");
      return;
    }
    controller.stopped = false;
    controller.running = true;
    setUiBusy(true);

    const pauseMs = getPauseMsForDepth(currentStage);
    appendLog("Этап " + currentStage + ": запуск. Отмечено " + selectedKeys.length + " ссылок. Пауза=" + pauseMs + " мс.");

    // Группируем выполнение по родителю:
    // внутри группы возвращаемся только на страницу родителя (-1),
    // а полный подъём по контексту делаем только при переходе к другому родителю.
    selectedKeys.sort(function (a, b) {
      const na = nodeByKey.get(a);
      const nb = nodeByKey.get(b);
      const pa = na ? String(na.parentKey || "root") : "root";
      const pb = nb ? String(nb.parentKey || "root") : "root";
      if (pa < pb) return -1;
      if (pa > pb) return 1;
      return 0;
    });

    let activeParentKey = null;

    for (let i = 0; i < selectedKeys.length; i++) {
      if (controller.stopped) break;
      const key = selectedKeys[i];
      const node = nodeByKey.get(key);
      if (!node) continue;
      const startedAt = Date.now();

      if (activeParentKey !== node.parentKey) {
        const ctx = await openContextPath(node.contextPath, pauseMs);
        if (!ctx.ok) {
          node.status = "FAIL";
          node.reason = ctx.reason;
          node.elapsedMs = Date.now() - startedAt;
          appendLog("НЕ OK: " + node.href + " | " + node.reason);
          console.warn("[UI_LinksCrawler][НЕ OK]", node.href, "|", node.reason);
          continue;
        }
        activeParentKey = node.parentKey;
      }
      const parentUrlNow = window.location.href;
      const a = findAnchorByAbsoluteUrl(node.href);
      if (!a) {
        node.status = "FAIL";
        node.reason = "Ссылка отсутствует на родительской странице";
        node.elapsedMs = Date.now() - startedAt;
        appendLog("НЕ OK: " + node.href + " | " + node.reason);
        console.warn("[UI_LinksCrawler][НЕ OK]", node.href, "|", node.reason);
        continue;
      }
      node.fromUrl = window.location.href;
      appendLog("Запуск: переход по " + node.href);
      try {
        a.click();
        const wr = await waitPageReadyWithMinDelay(pauseMs);
        node.toUrl = window.location.href;
        if (wr.timedOut) {
          node.status = "FAIL";
          node.reason = "Таймаут загрузки после клика";
          appendLog("НЕ OK: " + node.href + " | " + node.reason);
          console.warn("[UI_LinksCrawler][НЕ OK]", node.href, "|", node.reason);
        } else {
          node.status = "OK";
          node.reason = "";
          appendLog("OK: " + node.href + " -> " + node.toUrl);
        }
      } catch (e) {
        node.status = "FAIL";
        node.reason = "Исключение при клике: " + (e && e.message ? e.message : String(e));
        appendLog("НЕ OK: " + node.href + " | " + node.reason);
        console.warn("[UI_LinksCrawler][НЕ OK]", node.href, "|", node.reason);
      }
      node.elapsedMs = Date.now() - startedAt;

      // Рекурсивный сбор дочерних ссылок для следующего этапа.
      if (currentStage < maxDepth && node.status === "OK") {
        const childLinks = collectLinksOnCurrentPage();
        const parentNodeKey = node.key;
        const rel = [];
        const maxChildrenToCollect = Math.min(childLinks.length, maxChildrenPerParent);
        for (let c = 0; c < maxChildrenToCollect; c++) {
          const ch = childLinks[c];
          const isNew = !discoveredHrefGlobal.has(ch);
          rel.push({ href: ch, isNew: isNew });
          if (isNew) {
            const childPath = node.contextPath.concat([node.href]);
            const addedChildKey = addStageNode(currentStage + 1, parentNodeKey, node.toUrl || parentUrlNow, childPath, ch, true);
            if (addedChildKey) {
              discoveredHrefGlobal.add(ch);
            }
          }
        }
        if (childLinks.length > maxChildrenToCollect) {
          appendLog(
            "Ограничение дочерних ссылок: у родителя " +
              shortLink(node.href) +
              " обработано " +
              maxChildrenToCollect +
              " из " +
              childLinks.length +
              ".",
          );
        }
        discoveredByParentKey.set(parentNodeKey, rel);
      }

      // Возврат к родительской странице для следующей ссылки в том же контексте.
      const backOk = await ensureBackToUrl(parentUrlNow, pauseMs);
      if (!backOk) {
        appendLog("НЕ OK: не удалось вернуться на родительскую страницу после " + node.href + ".");
      }
    }

    // Все неотмеченные на этапе считаем SKIPPED для визуальной сводки.
    for (let i = 0; i < keys.length; i++) {
      const n = nodeByKey.get(keys[i]);
      if (!n) continue;
      if (!n.selected && n.status === null) n.status = "SKIPPED";
    }

    controller.running = false;
    setUiBusy(false);
    if (controller.stopped) {
      appendLog("Этап " + currentStage + " прерван пользователем. Текущий итог по проблемным ссылкам:");
      renderStageLinks();
      renderRelations();
      appendTreeSummaryToLog({ onlyProblematic: true });
      return;
    }

    // Переход к следующему этапу.
    if (currentStage < maxDepth) {
      const nextKeys = stageKeys.get(currentStage + 1) || [];
      appendLog(
        "Этап " +
          currentStage +
          " завершён. Для этапа " +
          (currentStage + 1) +
          " найдено новых ссылок: " +
          nextKeys.length +
          ".",
      );
      currentStage = currentStage + 1;
    } else {
      appendLog("Достигнута максимальная вложенность этапов: " + maxDepth + ".");
    }

    renderStageLinks();
    renderRelations();
    appendTreeSummaryToLog();
  }

  function appendTreeSummaryToLog(options) {
    const onlyProblematic = !!(options && options.onlyProblematic);
    appendLog(
      onlyProblematic
        ? "Итоговое дерево проблемных ссылок (состояние на текущий момент):"
        : "Итоговое дерево (состояние на текущий момент):",
    );

    function isProblematicNode(node) {
      if (!node) return false;
      return node.status === "FAIL" || node.status === "SKIPPED" || !!node.reason;
    }

    function branchHasProblem(parentKey) {
      const kids = childrenByParentKey.get(parentKey) || [];
      for (let i = 0; i < kids.length; i++) {
        const n = nodeByKey.get(kids[i]);
        if (!n) continue;
        if (isProblematicNode(n)) return true;
        if (branchHasProblem(n.key)) return true;
      }
      return false;
    }

    function walk(parentKey, indent) {
      const kids = childrenByParentKey.get(parentKey) || [];
      for (let i = 0; i < kids.length; i++) {
        const n = nodeByKey.get(kids[i]);
        if (!n) continue;

        if (onlyProblematic) {
          const selfProblem = isProblematicNode(n);
          const childProblem = branchHasProblem(n.key);
          if (!selfProblem && !childProblem) continue;
        }

        appendLog(indent + statusDot(n.status) + " " + n.href + (n.reason ? " | " + n.reason : ""));
        walk(n.key, indent + "  ");
      }
    }
    // rebuild children map
    childrenByParentKey.clear();
    nodeByKey.forEach(function (n) {
      const pk = n.parentKey || "root";
      if (!childrenByParentKey.has(pk)) childrenByParentKey.set(pk, []);
      childrenByParentKey.get(pk).push(n.key);
    });
    if (onlyProblematic && !branchHasProblem("root")) {
      appendLog("ROOT: " + rootUrl);
      appendLog("  ⚪ Проблемные ссылки не обнаружены среди пройденных этапов.");
      return;
    }

    appendLog("ROOT: " + rootUrl);
    walk("root", "  ");
  }

  scanBtn.addEventListener("click", function () {
    if (controller.running) return;
    stageScanCurrentPage();
  });

  runBtn.addEventListener("click", function () {
    runStage().catch(function (e) {
      appendLog("Критическая ошибка выполнения этапа: " + (e && e.message ? e.message : String(e)));
      controller.running = false;
      setUiBusy(false);
    });
  });

  stopBtn.addEventListener("click", function () {
    controller.stop();
  });
  emergencyStopBtn.addEventListener("click", function () {
    controller.stop();
  });

  checkAllBtn.addEventListener("click", function () {
    const keys = stageKeys.get(currentStage) || [];
    for (let i = 0; i < keys.length; i++) {
      const n = nodeByKey.get(keys[i]);
      if (n) n.selected = true;
    }
    renderStageLinks();
  });
  uncheckAllBtn.addEventListener("click", function () {
    const keys = stageKeys.get(currentStage) || [];
    for (let i = 0; i < keys.length; i++) {
      const n = nodeByKey.get(keys[i]);
      if (n) n.selected = false;
    }
    renderStageLinks();
  });
  closeBtn.addEventListener("click", function () {
    controller.stop();
    clearPersistentLogLines();
    emergencyStopBtn.remove();
    panel.remove();
    document.body.style.overflow = prevBodyOverflow;
  });
  chooseLogFileBtn.addEventListener("click", function () {
    pickLogFile().catch(function (e) {
      console.warn("[UI_LinksCrawler][LOG_FILE_PICK][ERROR]", e);
    });
  });
  logToFileCheckbox.addEventListener("change", function () {
    if (!logToFileCheckbox.checked) {
      logTransportMode = "off";
      return;
    }
    if (!canWriteLogFile()) {
      logTransportMode = "session";
      console.info("[UI_LinksCrawler][LOG_MODE] sessionStorage");
      return;
    }
    if (logFileHandle) {
      logTransportMode = "file";
      console.info("[UI_LinksCrawler][LOG_MODE] file");
      return;
    }
    pickLogFile()
      .then(function (ok) {
        if (ok) {
          logTransportMode = "file";
          console.info("[UI_LinksCrawler][LOG_MODE] file");
          return;
        }
        logTransportMode = "session";
        console.info("[UI_LinksCrawler][LOG_MODE] sessionStorage");
      })
      .catch(function () {
        logTransportMode = "session";
        console.info("[UI_LinksCrawler][LOG_MODE] sessionStorage");
      });
  });
  depthInput.addEventListener("change", rebuildFromDepthInput);
  maxLinksPerStageInput.addEventListener("change", rebuildLimitsFromInput);
  maxChildrenPerParentInput.addEventListener("change", rebuildLimitsFromInput);
  maxRenderRowsStage1Input.addEventListener("change", rebuildLimitsFromInput);
  maxRenderRowsPerParentGroupInput.addEventListener("change", rebuildLimitsFromInput);
  resetLimitsBtn.addEventListener("click", resetLimitsToDefault);

  document.body.appendChild(panel);
  document.body.appendChild(emergencyStopBtn);
  devTrace.attachPanel(panel);
  inMemoryLogLines = loadPersistedLogLines();
  if (inMemoryLogLines.length > 0) {
    console.groupCollapsed("[UI_LinksCrawler] Восстановленный лог предыдущего запуска (" + inMemoryLogLines.length + " строк)");
    for (let i = 0; i < inMemoryLogLines.length; i++) {
      console.log("[UI_LinksCrawler][RESTORE]", inMemoryLogLines[i]);
    }
    console.groupEnd();
  }
  setUiBusy(false);
  appendLog("Панель готова. Этап 1: нажмите «Скан этапа», отметьте ссылки, затем «Запуск этапа».");
  updateInfo();
})();

</script>
<script type="text/plain" class="embedded-script" data-script-file="SUP_Config_Update.js">
/**
 * SUP_Config_Update.js — обновление параметров СУП (UFS Config Manager).
 * Запуск: DevTools → Console на вкладке ufs-config-manager → вставить файл → Enter.
 */
(() => {
  "use strict";


/**
 * DevToolsTrace — трассировка UI, HTTP и журнала для DevTools-скриптов (один файл → вставка в консоль).
 * Использование: createDevToolsTrace({ scriptId: "MyScript" }) → mountToggleRow, attachPanel, wrapFetch, log.
 */
/* DevToolsTrace v1 */
function createDevToolsTrace(opts) {
  "use strict";
  var scriptId = (opts && opts.scriptId) || "devtools_script";
  var maxBodyLen = (opts && opts.maxBodyLen) || 16384;
  var maxLines = (opts && opts.maxLines) || 8000;
  var enabled = false;
  /** @type {string[]} */
  var buffer = [];

  /**
   * @returns {string}
   */
  function isoNow() {
    return new Date().toISOString();
  }

  /**
   * @param {string} ts
   * @returns {string}
   */
  function fileTsFromIso(ts) {
    return ts.replace(/[-:]/g, "").replace("T", "_").slice(0, 15);
  }

  /**
   * @param {unknown} v
   * @returns {string}
   */
  function truncBody(v) {
    if (v == null) return "";
    var s = typeof v === "string" ? v : String(v);
    if (s.length <= maxBodyLen) return s;
    return s.slice(0, maxBodyLen) + "\n… [truncated " + (s.length - maxBodyLen) + " chars]";
  }

  /**
   * @param {string} kind
   * @param {string} message
   * @param {Record<string, unknown>|null} [detail]
   */
  function push(kind, message, detail) {
    if (!enabled) return;
    var line = isoNow() + " [" + kind + "] " + message;
    if (detail && typeof detail === "object") {
      try {
        line += " " + JSON.stringify(detail);
      } catch (_e) {
        line += " [detail unserializable]";
      }
    }
    buffer.push(line);
    if (buffer.length > maxLines) buffer = buffer.slice(buffer.length - maxLines);
  }

  /**
   * @param {boolean} on
   */
  function setEnabled(on) {
    var next = !!on;
    if (next === enabled) return;
    if (next) {
      enabled = true;
      push("SYS", "Trace ON script=" + scriptId);
      return;
    }
    push("SYS", "Trace OFF script=" + scriptId);
    enabled = false;
    if (buffer.length > 0) downloadLog();
    buffer = [];
  }

  function isEnabled() {
    return enabled;
  }

  /**
   * @param {string} msg
   */
  function log(msg) {
    push("LOG", String(msg));
  }

  /**
   * @param {string} action
   * @param {Record<string, unknown>|null} [detail]
   */
  function ui(action, detail) {
    push("UI", action, detail);
  }

  /**
   * @param {typeof fetch} nativeFetch
   * @returns {typeof fetch}
   */
  function wrapFetch(nativeFetch) {
    return async function tracedFetch(input, init) {
      if (!enabled) return nativeFetch(input, init);
      var url =
        typeof input === "string"
          ? input
          : input && typeof input === "object" && "url" in input
            ? String(input.url)
            : String(input);
      var method = (init && init.method) || "GET";
      var reqBody = init && init.body != null ? truncBody(init.body) : "";

  /**
   * @param {ReturnType<typeof parseImportJson>["rows"][number]} row
   * @returns {string}
   */
  function rowIdentity(row) {
    return row.parameterName + "\0" + row.pathLabel;
  }

  /**
   * @param {unknown} json
   * @param {string} source
   */
  function syncJsonToImportState(json, source) {
    lastImportJson = json;
    const parsed = parseImportJson(json);
    lastImportFormat = parsed.format;
    importRows = parsed.rows;
    applyCachedIdsToRows(importRows);
    rollbackSnapshot = { entries: json, source };
    selectedImportKey = null;
    renderImportList();
  }

  /**
   * @param {unknown} json
   * @param {ReturnType<typeof parseImportJson>["rows"]} prevRows
   * @returns {Promise<{ parameterId: number; parameterName: string; tenant: string; bundle: object }[]>}
   */
  async function buildJobsFromExportJson(json, prevRows) {
    const env = getApiEnv(originInput, prefixInput, refererInput);
    const tenant = tenantSel.value;
    const parsed = parseImportJson(json);
    const checkById = new Map(prevRows.map((r) => [rowIdentity(r), r.checked]));
    /** @type {{ parameterId: number; parameterName: string; tenant: string; bundle: object }[]} */
    const jobs = [];
    for (const row of parsed.rows) {
      const id = rowIdentity(row);
      if (prevRows.length > 0 && checkById.has(id) && !checkById.get(id)) continue;
      const t = row.tenant || tenant;
      let pid = row.parameterId;
      if (!pid || pid <= 0) {
        pid = await resolveParameterId(row.parameterName, t, env);
      }
      jobs.push({
        parameterId: pid,
        parameterName: row.parameterName,
        tenant: t,
        bundle: row.bundle,
      });
    }
    return jobs;
  }

  /**
   * @param {ReturnType<typeof parseImportJson>["rows"][number]} row
   * @returns {string}
   */
  function formatImportRowMeta(row) {
    const lines = [
      "parameterId: " + (row.parameterId != null && row.parameterId > 0 ? row.parameterId : "— (подтянется при отправке)"),
      "name: " + (row.parameterName || "—"),
      "tenant: " + (row.tenant || "—"),
      "path: " + row.pathLabel,
      "values: " + row.bundle.values.length,
    ];
    if (row.metaScope) lines.push("scope: " + row.metaScope);
    if (row.metaLocation) lines.push("location: " + row.metaLocation);
    if (row.metaDataType) lines.push("dataType: " + row.metaDataType);
    if (row.metaDescription) lines.push("description: " + row.metaDescription);
    if (row.metaRoles && row.metaRoles.length) lines.push("roles: " + row.metaRoles.join(", "));
    if (row.valuesFileHint) lines.push("valuesFile: " + row.valuesFileHint);
    return lines.join("\n");
  }

  /**
   * @param {ReturnType<typeof parseImportJson>["rows"][number]} row
   */
  function showImportRowDetail(row) {
    selectedImportKey = row.key;
    importMetaTa.value = formatImportRowMeta(row);
    importValuesTa.value = row.bundle.values.join("\n");
    renderImportList();
  }

  /**
   * @param {ReturnType<typeof parseImportJson>["rows"][number]} row
   * @returns {Promise<number>}
   */
  async function ensureRowParameterId(row) {
    if (row.parameterId != null && row.parameterId > 0) return row.parameterId;
    const env = getApiEnv(originInput, prefixInput, refererInput);
    const t = row.tenant || tenantSel.value;
    const id = await resolveParameterId(row.parameterName, t, env);
    row.parameterId = id;
    return id;
  }

  function renderImportList() {
    importListEl.innerHTML = "";
    if (importRows.length === 0) {
      importListEl.textContent = "Нет строк — разберите JSON.";
      importMetaTa.value = "";
      importValuesTa.value = "";
      selectedImportKey = null;
      return;
    }
    if (selectedImportKey && !importRows.some((r) => r.key === selectedImportKey)) {
      selectedImportKey = null;
      importMetaTa.value = "";
      importValuesTa.value = "";
    }
    importRows.forEach((row) => {
      const line = document.createElement("div");
      const selected = row.key === selectedImportKey;
      line.style.cssText =
        "display:flex;gap:6px;align-items:flex-start;margin-bottom:2px;padding:3px 4px;border-radius:4px;cursor:pointer;" +
        (selected ? "background:#1e3a5f;border:1px solid #2563eb;" : "border:1px solid transparent;");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = row.checked;
      cb.style.marginTop = "2px";
      cb.addEventListener("click", (ev) => ev.stopPropagation());
      cb.addEventListener("change", () => {
        row.checked = cb.checked;
      });
      const idBadge = document.createElement("span");
      idBadge.textContent = row.parameterId != null && row.parameterId > 0 ? String(row.parameterId) : "—";
      idBadge.style.cssText =
        "flex:0 0 52px;font-family:ui-monospace,monospace;color:#93c5fd;text-align:right;";
      const txt = document.createElement("span");
      txt.style.cssText = "flex:1;min-width:0;word-break:break-all;";
      txt.textContent =
        row.parameterName + " | " + row.pathLabel + " | values=" + row.bundle.values.length;
      line.appendChild(cb);
      line.appendChild(idBadge);
      line.appendChild(txt);
      line.addEventListener("click", async () => {
        showImportRowDetail(row);
        if (!(row.parameterId != null && row.parameterId > 0)) {
          try {
            await ensureRowParameterId(row);
            showImportRowDetail(row);
          } catch (_e) {
            /* id останется «—» до ручного подтягивания или отправки */
          }
        }
      });
      importListEl.appendChild(line);
    });
    if (!selectedImportKey && importRows.length > 0) {
      showImportRowDetail(importRows[0]);
    }
  }

  function renderServerParamList() {
    paramListEl.innerHTML = "";
    if (serverParamCatalog.length === 0) {
      paramListEl.textContent = "Список пуст — нажмите «Загрузить список параметров».";
      return;
    }
    const q = paramFilterInput.value.trim().toLowerCase();
    const items = serverParamCatalog.filter((p) => {
      if (!q) return true;
      return (
        p.name.toLowerCase().includes(q) ||
        String(p.id).includes(q) ||
        (p.description && p.description.toLowerCase().includes(q))
      );
    });
    if (items.length === 0) {
      paramListEl.textContent = "Нет совпадений для «" + paramFilterInput.value.trim() + "».";
      return;
    }
    const curName = exportNameInput.value.trim();
    items.forEach((p) => {
      const row = document.createElement("div");
      const picked = curName === p.name;
      row.style.cssText =
        "display:flex;gap:6px;align-items:flex-start;padding:4px 6px;margin-bottom:2px;border-radius:4px;cursor:pointer;" +
        (picked ? "background:#1e3a5f;border:1px solid #2563eb;" : "border:1px solid transparent;");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = catalogCheckedNames.has(p.name);
      cb.style.marginTop = "3px";
      cb.addEventListener("click", (ev) => ev.stopPropagation());
      cb.addEventListener("change", () => {
        if (cb.checked) catalogCheckedNames.add(p.name);
        else catalogCheckedNames.delete(p.name);
      });
      const body = document.createElement("div");
      body.style.cssText = "flex:1;min-width:0;";
      const head = document.createElement("div");
      head.style.cssText = "word-break:break-all;line-height:1.35;";
      const idSpan = document.createElement("span");
      idSpan.style.cssText = "font-family:ui-monospace,monospace;color:#93c5fd;margin-right:4px;";
      idSpan.textContent = String(p.id);
      const nameSpan = document.createElement("span");
      nameSpan.textContent = p.name;
      head.appendChild(idSpan);
      head.appendChild(nameSpan);
      body.appendChild(head);
      const descText = (p.description || "").trim();
      if (descText) {
        const desc = document.createElement("div");
        desc.style.cssText = "color:#94a3b8;font-size:9px;margin-top:2px;line-height:1.35;word-break:break-word;";
        desc.textContent = descText;
        body.appendChild(desc);
      }
      row.appendChild(cb);
      row.appendChild(body);
      if (p.type) row.title = p.type;
      row.addEventListener("click", () => {
        exportNameInput.value = p.name;
        paramNameInput.value = p.name;
        paramIdInput.value = String(p.id);

      const active = await fetchActiveBundle(parameterId, tenant, env);

  /**
   * @returns {Promise<{ parameterId: number; parameterName: string; tenant: string; bundle: object }[]>}
   */
  async function collectJobsFromUi() {
    const tenant = tenantSel.value;
    const activeTab = tabPanels.findIndex((p) => p.style.display !== "none");

    if (activeTab === 1 && fileJsonTa.value.trim()) {
      const json = JSON.parse(fileJsonTa.value.trim());
      return buildJobsFromExportJson(json, importRows);
    }

    if (activeTab === 2 && exportPreview.value.trim()) {
      const json = JSON.parse(exportPreview.value.trim());
      return buildJobsFromExportJson(json, importRows);

    const env = getApiEnv(originInput, prefixInput, refererInput);
    /** @type {{ parameterId: number; parameterName: string; tenant: string; bundle: object }[]} */
    const jobs = [];

    const obj = JSON.parse(payloadTa.value.trim() || "{}");
    let bundle = obj.bundle;
    let parameterId = Number(obj.parameterId || paramIdInput.value);
    const parameterName = paramNameInput.value.trim();
    if (!bundle) throw new Error("Нет bundle в payload");
    if (!Number.isFinite(parameterId) || parameterId <= 0) {
      if (!parameterName) throw new Error("parameterId или имя параметра");
      parameterId = await resolveParameterId(parameterName, tenant, env);
      paramIdInput.value = String(parameterId);

    jobs.push({ parameterId, parameterName, tenant, bundle });
    return jobs;

      panelLog("Уже выполняется", "warn");

      const env = getApiEnv(originInput, prefixInput, refererInput);

<!-- ======= Встроенная конфигурация (fallback для работы без сервера) ======= -->
<script>
/* Совместимость с Linux/SberOS и старыми браузерами: полифиллы и защита от падения */
(function () {
    if (!String.prototype.padStart) {
        String.prototype.padStart = function (len, str) {
            var s = String(this);
            if (str === undefined) str = ' ';
            while (s.length < len) s = str + s;
            return s.slice(-len);
        };
    }
})();

// Встроенные данные конфигурации (используются при ошибке загрузки config.json)
// Эти данные автоматически обновляются при изменении config.json
let embeddedConfig = null;
// === Константы конфигурации ===
const CONFIG = {
    LINK_CHECK_INTERVAL: 120000, // 2 минуты в миллисекундах
    REQUEST_DELAY: 1000, // Задержка между запросами
    PROFILE_REQUEST_DELAY: 10, // Задержка для запросов профилей
    FETCH_TIMEOUT: 5000, // Таймаут для fetch-запросов
    MAX_PARALLEL_REQUESTS: 5, // Максимум параллельных запросов
    PROGRESS_BAR_ANIMATION_STEP: 24, // Шаг анимации прогресс-бара
    PROGRESS_BAR_ANIMATION_INTERVAL: 100, // Интервал анимации прогресс-бара
    LOGGING_ENABLED: false, // Включить/выключить логирование
    JS_SCRIPTS_DIR: 'JS/' // Каталог со скриптами рядом с index.html (имя файла задаётся в JSON карточки: scriptFile)
};

// Кэш: имя файла → { text, source: 'file'|'embedded', detail }
const scriptTextCache = new Map();
var embeddedScriptsStore = null;
var scriptCopyToastTimer = null;

/** Нормализация имени файла скрипта */
function normalizeScriptFile(scriptFile) {
    return String(scriptFile).replace(/^\.?\//, '').replace(/^JS\//i, '');
}

/** Базовый URL каталога index.html */
function getPageBaseUrl() {
    var href = window.location.href.split('#')[0].split('?')[0];
    var lastSlash = href.lastIndexOf('/');
    return lastSlash >= 0 ? href.substring(0, lastSlash + 1) : href;
}

/** Относительный путь для подсказки (JS/имя.js) */
function resolveScriptUrl(scriptFile) {
    var dir = CONFIG.JS_SCRIPTS_DIR || 'JS/';
    if (dir.charAt(dir.length - 1) !== '/') dir += '/';
    return dir + normalizeScriptFile(scriptFile);
}

/** URL-кандидаты для загрузки из папки JS/ */
function getScriptCandidateUrls(scriptFile) {
    var name = normalizeScriptFile(scriptFile);
    var dir = CONFIG.JS_SCRIPTS_DIR || 'JS/';
    if (dir.charAt(dir.length - 1) !== '/') dir += '/';
    var base = getPageBaseUrl();
    var baseUri = document.baseURI || base;
    var list = [
        dir + name,
        './' + dir + name,
        'JS/' + name,
        './JS/' + name,
        'js/' + name,
        './js/' + name
    ];
    try { list.push(new URL(dir + name, base).href); } catch (e) { /* ignore */ }
    try { list.push(new URL('./' + dir + name, base).href); } catch (e) { /* ignore */ }
    try { list.push(new URL(dir + name, baseUri).href); } catch (e) { /* ignore */ }
    var seen = {};
    return list.filter(function (u) {
        if (!u || seen[u]) return false;
        seen[u] = true;
        return true;
    });
}

function loadScriptTextFetch(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
    });
}

function loadScriptTextXhr(url) {
    return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'text';
        xhr.onload = function () {
            if (xhr.status === 200 || xhr.status === 0) {
                if (xhr.responseText) resolve(xhr.responseText);
                else reject(new Error('Пустой ответ'));
            } else {
                reject(new Error('XHR ' + xhr.status));
            }
        };
        xhr.onerror = function () { reject(new Error('Сеть недоступна')); };
        xhr.send();
    });
}

function tryLoadScriptFromUrl(url) {
    if (typeof fetch === 'function') {
        return loadScriptTextFetch(url).catch(function () {
            return loadScriptTextXhr(url);
        });
    }
    return loadScriptTextXhr(url);
}

function tryLoadScriptUrls(urls, index) {
    if (index >= urls.length) {
        return Promise.reject(new Error('Не удалось загрузить файл. Проверены: ' + urls.join(' | ')));
    }
    var url = urls[index];
    return tryLoadScriptFromUrl(url).then(function (text) {
        return { text: text, url: url };
    }).catch(function () {
        return tryLoadScriptUrls(urls, index + 1);
    });
}

/** Снятие HTML-экранирования закрывающего тега script после встраивания */
function unescapeEmbeddedScriptBody(text) {
    return String(text).replace(/<\\\/script>/gi, '<\/script>');
}

/**
 * Индекс встроенных скриптов из <script class="embedded-script">.
 * Работает при file:// без HTTP-сервера и без fetch к папке JS/.
 */
function initEmbeddedScriptsStore() {
    if (embeddedScriptsStore) return embeddedScriptsStore;
    embeddedScriptsStore = {};
    var nodes = document.querySelectorAll('script.embedded-script[data-script-file]');
    for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var fname = node.getAttribute('data-script-file');
        if (!fname) continue;
        embeddedScriptsStore[fname] = unescapeEmbeddedScriptBody(node.textContent || '');
    }
    return embeddedScriptsStore;
}

/** Текст встроенного скрипта по имени файла */
function getEmbeddedScriptText(scriptFile) {
    var name = normalizeScriptFile(scriptFile);
    var store = initEmbeddedScriptsStore();
    var text = store[name];
    return (text && text.length > 0) ? text : null;
}

/**
 * Загрузка скрипта: сначала JS/ (fetch), при ошибке — встроенная копия в index.html.
 * @returns {Promise<{text:string, source:'file'|'embedded', detail:string, fromCache?:boolean}>}
 */
function loadScriptText(scriptFile) {
    var name = normalizeScriptFile(scriptFile);
    var cached = scriptTextCache.get(name);
    if (cached) {
        return Promise.resolve({
            text: cached.text,
            source: cached.source,
            detail: cached.detail,
            fromCache: true
        });
    }

    // file:// — без async fetch (иначе теряется user activation при копировании)
    if (window.location.protocol === 'file:') {
        var syncPayload = loadScriptTextSyncForCopy(scriptFile);
        if (syncPayload) return Promise.resolve(syncPayload);
        return Promise.reject(new Error(
            'Скрипт не найден: ' + name + '. Обновите index.html: python3 tools/embed_scripts.py'
        ));
    }

    var urls = getScriptCandidateUrls(scriptFile);
    return tryLoadScriptUrls(urls, 0)
        .then(function (result) {
            var entry = {
                text: result.text,
                source: 'file',
                detail: result.url
            };
            scriptTextCache.set(name, entry);
            return entry;
        })
        .catch(function (remoteErr) {
            var embedded = getEmbeddedScriptText(scriptFile);
            if (embedded) {
                var fallback = {
                    text: embedded,
                    source: 'embedded',
                    detail: 'index.html (встроенная копия)'
                };
                scriptTextCache.set(name, fallback);
                return fallback;
            }
            return Promise.reject(remoteErr);
        });
}

/** Синхронное копирование (сохраняет user activation при клике; надёжно на file://) */
function copyToClipboardSync(text) {
    if (!text) return false;

    function copyViaCopyEvent() {
        var handler = function (e) {
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', text);
            }
        };
        document.addEventListener('copy', handler);
        var ok = false;
        try {
            ok = document.execCommand('copy');
        } catch (err) {
            console.error('copyToClipboardSync (copy event):', err);
        }
        document.removeEventListener('copy', handler);
        return ok;
    }

    if (copyViaCopyEvent()) return true;

    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.setAttribute('readonly', '');
    textArea.setAttribute('aria-hidden', 'true');
    textArea.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;padding:0;border:none;outline:none;opacity:0;';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    if (typeof textArea.setSelectionRange === 'function') {
        textArea.setSelectionRange(0, text.length);
    }
    var ok = false;
    try {
        ok = document.execCommand('copy');
    } catch (e) {
        console.error('copyToClipboardSync (textarea):', e);
    }
    document.body.removeChild(textArea);
    return ok;
}

/** Синхронная загрузка для file://: файл (sync XHR) → встроенная копия */
function tryLoadScriptSyncXhr(url) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, false);
        xhr.send(null);
        if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText) {
            return xhr.responseText;
        }
    } catch (e) { /* file:// часто блокирует */ }
    return null;
}

function loadScriptTextSyncForCopy(scriptFile) {
    var name = normalizeScriptFile(scriptFile);
    var cached = scriptTextCache.get(name);
    if (cached) {
        return { text: cached.text, source: cached.source, detail: cached.detail, fromCache: true };
    }

    var urls = getScriptCandidateUrls(scriptFile);
    for (var i = 0; i < urls.length; i++) {
        var fromFile = tryLoadScriptSyncXhr(urls[i]);
        if (fromFile && fromFile.length > 0) {
            var fileEntry = { text: fromFile, source: 'file', detail: urls[i] };
            scriptTextCache.set(name, fileEntry);
            return fileEntry;
        }
    }

    var embedded = getEmbeddedScriptText(scriptFile);
    if (embedded) {
        var embEntry = { text: embedded, source: 'embedded', detail: 'index.html (встроенная копия)' };
        scriptTextCache.set(name, embEntry);
        return embEntry;
    }
    return null;
}

/** Экранирование для toast (локально, без зависимости от IIFE подсказки) */
function escapeHtmlForToast(str) {

    div.textContent = String(str);
    return div.innerHTML;
}

/** Копирование в буфер с Promise; на file:// предпочитает sync execCommand */
function copyToClipboardPromise(text) {
    return new Promise(function (resolve, reject) {
        if (!text || text.length === 0) {
            reject(new Error('Пустой текст для копирования'));
            return;
        }
        if (window.location.protocol === 'file:' || !window.isSecureContext) {
            if (copyToClipboardSync(text)) {
                resolve();
                return;
            }
            reject(new Error('Не удалось скопировать в буфер (file://). Разрешите доступ или используйте Chrome/Firefox.'));
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(resolve).catch(function (err) {
                if (copyToClipboardSync(text)) resolve();
                else reject(err || new Error('Не удалось скопировать в буфер'));
            });
            return;
        }
        if (copyToClipboardSync(text)) resolve();
        else reject(new Error('Копирование не поддерживается браузером'));
    });
}

/** Скопировать payload в буфер; sync-first при клике */
function copyScriptPayloadToClipboard(payload) {
    if (copyToClipboardSync(payload.text)) {
        return Promise.resolve(payload);
    }
    return copyToClipboardPromise(payload.text).then(function () { return payload; });
}

/** Загрузить скрипт и скопировать в буфер; на file:// всё синхронно в обработчике клика */
function copyScriptFromFile(cardElement, scriptFile) {
    if (!cardElement || !scriptFile) return;
    if (cardElement.classList.contains('copy-loading')) return;
    cardElement.classList.add('copy-loading');

    function onSuccess(payload) {
        cardElement.classList.remove('copy-loading');
        var flashClass = payload.source === 'file' ? 'copied-from-file' : 'copied-from-embedded';
        cardElement.classList.add(flashClass);
        cardElement.setAttribute('data-copy-source', payload.source);
        setTimeout(function () {
            cardElement.classList.remove(flashClass);
        }, 600);
        showScriptCopySourceInfo(scriptFile, payload);
    }

    function onError(err) {
        cardElement.classList.remove('copy-loading');
        cardElement.classList.add('copy-failed');
        setTimeout(function () { cardElement.classList.remove('copy-failed'); }, 600);
        var msg = (err && err.message) ? err.message : String(err);
        alert('Не удалось скопировать скрипт:\n' + scriptFile +
            '\n\n' + msg +
            '\n\nПроверьте папку JS/ или обновите встроенные копии: python3 tools/embed_scripts.py');
        console.error('copyScriptFromFile:', scriptFile, err);
    }

    // file:// — sync load + sync copy в одном клике (иначе буфер пустой)
    if (window.location.protocol === 'file:') {
        try {
            var syncPayload = loadScriptTextSyncForCopy(scriptFile);
            if (!syncPayload || !syncPayload.text) {
                throw new Error('Встроенная копия не найдена');
            }
            if (!copyToClipboardSync(syncPayload.text)) {
                throw new Error('Буфер обмена недоступен. Попробуйте другой браузер или разрешите доступ к буферу.');
            }
            onSuccess(syncPayload);
        } catch (e) {
            onError(e);
        }
        return;
    }

    loadScriptText(scriptFile)
        .then(copyScriptPayloadToClipboard)
        .then(onSuccess)
        .catch(onError);
}

// Универсальная функция копирования в буфер обмена с fallback для SberBrowser
function copyToClipboard(text, buttonElement) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            if (buttonElement) {
                const originalText = buttonElement.textContent;
                buttonElement.textContent = 'Скопировано!';
                setTimeout(() => {
                    buttonElement.textContent = originalText;
                }, 1200);
            }
        }).catch(err => {
            console.error('Ошибка копирования через Clipboard API:', err);
            fallbackCopyToClipboard(text, buttonElement);
        });
    } else {
        fallbackCopyToClipboard(text, buttonElement);
    }
}

// Fallback для старых браузеров и SberBrowser
function fallbackCopyToClipboard(text, buttonElement) {
    var successful = copyToClipboardSync(text);
    if (successful && buttonElement) {
        var originalText = buttonElement.textContent;
        buttonElement.textContent = 'Скопировано!';
        setTimeout(function () {
            buttonElement.textContent = originalText;
        }, 1200);
    }
    return successful;
}

// Безопасный поиск элемента (context опционален для совместимости со старыми браузерами)
function safeQuerySelector(selector, context) {
    var ctx = context !== undefined ? context : document;
    var element = ctx.querySelector(selector);
    if (!element && CONFIG.LOGGING_ENABLED) {
        console.warn(`Элемент не найден: ${selector}`);

    return element;
}

const Logger = {

        const timestamp = new Date().toISOString();
        const logMessage = `[${timestamp}] [${level}] ${message}`;
        if (data) {
            console[level.toLowerCase()](logMessage, data);
        } else {

        }
    },
    debug(message, data) { this.log('DEBUG', message, data); },
    info(message, data) { this.log('INFO', message, data); },

// Универсальный менеджер модальных окон
const ModalManager = {
    modals: new Map(),
    
    register(id, options = {}) {
        const modal = safeQuerySelector(`#${id}`);
        if (!modal) return;
        
        // Конфигурация модального окна с значениями по умолчанию
        const config = {
            closeOnBackdrop: options.closeOnBackdrop !== false,
            closeOnEscape: options.closeOnEscape !== false,
            trapFocus: options.trapFocus !== false
        };
        
        this.modals.set(id, { modal, config });
        this.setupEventListeners(id);
    },
    
    setupEventListeners(id) {
        const { modal, config } = this.modals.get(id);
        if (!modal) return;
        
        // Закрытие по клику вне окна
        if (config.closeOnBackdrop) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    this.close(id);
                }
            });
        }
    },
    
    open(id) {
        const { modal, config } = this.modals.get(id);
        if (!modal) return;
        modal.classList.add('show');
        if (config.trapFocus) {
            this.trapFocus(modal);
        }
        Logger.debug(`Модальное окно открыто: ${id}`);
    },
    
    close(id) {
        const { modal } = this.modals.get(id);
        if (!modal) return;
        modal.classList.remove('show');
        Logger.debug(`Модальное окно закрыто: ${id}`);
    },
    
    trapFocus(modal) {
        const focusableElements = modal.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (focusableElements.length === 0) return;
        
        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];
        
        const handleTab = (e) => {
            if (e.key !== 'Tab') return;
            
            if (e.shiftKey) {
                if (document.activeElement === firstElement) {
                    lastElement.focus();
                    e.preventDefault();
                }
            } else {
                if (document.activeElement === lastElement) {
                    firstElement.focus();
                    e.preventDefault();
                }
            }
        };
        
        modal.addEventListener('keydown', handleTab);
        firstElement.focus();
    }
};

// Глобальная обработка Escape для закрытия модальных окон
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const openModal = document.querySelector('.modal.show');
        if (openModal) {
            const modalId = openModal.id;
            if (modalId) {
                ModalManager.close(modalId);
            } else {
                openModal.classList.remove('show');
            }
        }
    }
});
