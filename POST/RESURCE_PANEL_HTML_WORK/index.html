// Создание элемента карточки
function createCardElement(card) {
    const link = document.createElement('a');
    link.href = card.url || '#';
    
    // Определяем тип кнопки (по умолчанию OTHER)
    const cardType = (card.type || 'OTHER').toLowerCase();
    
    // Определяем сегмент сети (по умолчанию UNIVERSAL)
    const cardSegment = (card.segment || 'UNIVERSAL').toLowerCase();
    
    link.className = `ios-card type-${cardType} segment-${cardSegment}`;
    
    // Изначально считаем кнопку доступной (статус обновится после проверки)
    link.classList.add('available');
    
    // Если это модальное окно или специальная ссылка, не открываем в новой вкладке
    if (!card.isModal && card.url && card.url !== '#' && !card.url.startsWith('#')) {
        link.target = '_blank';
        // Убираем focus state после клика на ссылку
        link.addEventListener('click', function(e) {
            // Даем время на открытие ссылки, затем убираем focus
            setTimeout(() => {
                this.blur();
            }, 100);
        });
    }
    
    if (card.id) {
        link.id = card.id;
    }
    if (card.isModal) {
        link.setAttribute('data-is-modal', 'true');
    }
    if (card.scriptFile) {
        link.setAttribute('data-script-file', card.scriptFile);
    }

    const title = document.createElement('span');
    title.className = 'ios-card-title';
    title.textContent = card.title;
    link.appendChild(title);
    
    return link;
}

        Logger.error('Ошибка загрузки конфигурации', { error: error.message });
    }
}

// === Адаптация размеров групп - кнопки заполняют весь блок ===
function adaptGroupsToFit() {
    const groups = document.querySelectorAll('.ios-group');
    // Константы для адаптации
    const OPTIMAL_FONT_SIZE = 18; // Оптимальный максимальный размер шрифта
    const MIN_FONT_SIZE = 17; // Минимальный размер шрифта
    const MIN_PADDING = 4; // Минимальный padding (верх/низ)
    const MIN_HEIGHT = 36; // Минимальная высота карточки
    const MIN_GAP = 4; // Минимальный gap между карточками
    const CARDS_PER_COLUMN_THRESHOLD = 6; // Порог для переключения на 2 колонки
    // Заголовок группы не уменьшаем - он должен оставаться одинаковым на всех группах
    
    groups.forEach(group => {
        const cardsContainer = group.querySelector('.ios-group-cards');
        if (!cardsContainer) return;
        
        const cards = cardsContainer.querySelectorAll('.ios-card');
        if (cards.length === 0) return;
        
        const cardsCount = cards.length;
        
        // Вычисляем доступную высоту контейнера
        const containerPadding = parseFloat(window.getComputedStyle(cardsContainer).paddingTop) + 
                                parseFloat(window.getComputedStyle(cardsContainer).paddingBottom);
        const availableHeight = cardsContainer.clientHeight - containerPadding;
        
        // Определяем количество колонок
        const useTwoColumns = cardsCount > CARDS_PER_COLUMN_THRESHOLD;
        const rowsCount = useTwoColumns ? Math.ceil(cardsCount / 2) : cardsCount;
        
        // Вычисляем оптимальную высоту кнопки для заполнения всего блока
        const currentGap = parseFloat(window.getComputedStyle(cardsContainer).gap) || 8;
        const totalGapHeight = (rowsCount - 1) * currentGap;
        const optimalCardHeight = (availableHeight - totalGapHeight) / rowsCount;
        
        // Применяем layout (одна или две колонки)
        if (useTwoColumns) {
            cardsContainer.style.display = 'grid';
            cardsContainer.style.gridTemplateColumns = '1fr 1fr';
            cardsContainer.style.flexDirection = 'unset';
        } else {
            cardsContainer.style.display = 'flex';
            cardsContainer.style.flexDirection = 'column';
            cardsContainer.style.gridTemplateColumns = 'unset';
        }
        
        // Адаптируем размеры кнопок и шрифта
        let cardHeight = Math.max(MIN_HEIGHT, optimalCardHeight);
        let fontSize = OPTIMAL_FONT_SIZE;
        let padding = 10;
        
        // Вычисляем оптимальный размер шрифта на основе высоты кнопки
        // Формула: fontSize примерно = (cardHeight - padding*2) / 5 (для 3 строк)
        const calculatedFontSize = Math.min(
            OPTIMAL_FONT_SIZE,
            Math.max(MIN_FONT_SIZE, (cardHeight - padding * 2) / 5)
        );
        fontSize = calculatedFontSize;
        
        // Проверяем, помещаются ли кнопки
        let needsReduction = false;
        if (useTwoColumns) {
            // Для двух колонок проверяем, помещаются ли все кнопки
            const testHeight = rowsCount * cardHeight + totalGapHeight;
            if (testHeight > availableHeight) {
                needsReduction = true;
            }
        } else {
            const testHeight = cardsCount * cardHeight + totalGapHeight;
            if (testHeight > availableHeight) {
                needsReduction = true;
            }
        }
        
        // Если не помещается, уменьшаем размеры
        if (needsReduction) {
            // Уменьшаем до тех пор, пока не поместится или не достигнем минимума
            let iterations = 0;
            while (iterations < 30) {
                const testHeight = rowsCount * cardHeight + totalGapHeight;
                if (testHeight <= availableHeight || cardHeight <= MIN_HEIGHT) {
                    break;
                }
                
                // Уменьшаем размеры
                cardHeight = Math.max(MIN_HEIGHT, cardHeight - 2);
                fontSize = Math.max(MIN_FONT_SIZE, fontSize - 0.3);
                padding = Math.max(MIN_PADDING, padding - 0.2);
                
                iterations++;
            }
        }
        
        // Применяем вычисленные размеры ко всем кнопкам
        cards.forEach(card => {
            card.style.minHeight = cardHeight + 'px';
            card.style.maxHeight = cardHeight + 'px';
            card.style.height = cardHeight + 'px';
            card.style.fontSize = fontSize + 'px';
            card.style.paddingTop = padding + 'px';
            card.style.paddingBottom = padding + 'px';
        });
        
        // Применяем размер шрифта к заголовкам
        const cardTitles = cardsContainer.querySelectorAll('.ios-card-title');
        cardTitles.forEach(title => {
            title.style.fontSize = fontSize + 'px';
        });
        
        // Проверяем, нужна ли прокрутка после всех изменений
        const finalHeight = rowsCount * cardHeight + totalGapHeight;
        if (finalHeight > availableHeight && cardHeight <= MIN_HEIGHT) {
            cardsContainer.style.overflowY = 'auto';
        } else {
            cardsContainer.style.overflowY = 'hidden';
        }
    });
}

// === 1. Адаптация расположения кнопок сверху в зависимости от количества панелей ===
function adjustTopActions() {
    // Если групп меньше 3 — ставим кнопки одну под одной (column), иначе в ряд
    const groupsCount = document.querySelectorAll('.groups-container .ios-group').length;
    const actions = document.getElementById('top-actions');
    if (actions && groupsCount < 3) {
        actions.classList.add('stacked');
    } else if (actions) {
        actions.classList.remove('stacked');
    }
}

window.addEventListener('resize', adjustTopActions);

// === Единый обработчик инициализации ===
document.addEventListener('DOMContentLoaded', function () {
    var container = document.getElementById('groups-container');
    function showInitError(msg) {
        if (container) {
            container.innerHTML = '<div style="padding:24px;text-align:center;color:#1d1d1f;font-size:16px;">' +
                '<p style="margin-bottom:12px;">Не удалось загрузить приложение.</p>' +
                '<p style="color:#6e6e73;font-size:14px;">' + (msg || 'Попробуйте обновить страницу или другой браузер (Chrome, Firefox, SberBrowser).') + '</p></div>';
        }
        console.error('Ошибка инициализации:', msg);
    }
    try {
        if (!container) {
            showInitError('Контейнер #groups-container не найден.');
            return;
        }
        initEmbeddedScriptsStore();
        // === 1. Регистрация модальных окон в ModalManager ===
        ModalManager.register('permission-modal');
        ModalManager.register('role-modal');
        
        // === 2. Загрузка конфигурации и рендеринг групп ===
        loadAndRenderConfig();
    } catch (e) {
        showInitError(e && e.message ? e.message : String(e));
        throw e;
    }

    // === Подсказка по ссылке при наведении (полный URL + домен, путь, параметры) ===
    (function initLinkInfoTooltip() {
        const tooltip = document.getElementById('link-info-tooltip');
        const container = document.getElementById('groups-container');
        if (!tooltip || !container) return;

        const OFFSET_X = 14;
        const OFFSET_Y = 14;
        const PADDING = 8;

        function parseUrlForTooltip(href) {
            if (!href || href === '#') return null;
            try {
                const url = new URL(href, window.location.origin);
                const params = [];
                url.searchParams.forEach((value, key) => params.push({ key, value }));
                return {
                    full: url.href,
                    domain: url.origin || url.hostname,
                    path: url.pathname || '/',
                    params
                };
            } catch (e) {
                return { full: href, domain: '', path: '', params: [] };
            }
        }

        function setTooltipContent(data) {
            if (!data) {
                tooltip.innerHTML = '<span class="link-info-tooltip__full">Модальное окно или ссылка не задана</span>';
                return;
            }
            let html = '<div class="link-info-tooltip__full">' + escapeHtml(data.full) + '</div>';
            html += '<div class="link-info-tooltip__label">Домен</div><div>' + escapeHtml(data.domain || '—') + '</div>';
            if (data.path && data.path !== '/' && data.path !== '') {
                html += '<div class="link-info-tooltip__label">Путь</div><div>' + escapeHtml(data.path) + '</div>';
            }
            if (data.params && data.params.length > 0) {
                html += '<div class="link-info-tooltip__label">Параметры</div><ul class="link-info-tooltip__params">';
                data.params.forEach(function (p) {
                    html += '<li>' + escapeHtml(p.key) + ' = ' + escapeHtml(p.value) + '</li>';
                });
                html += '</ul>';
            }
            tooltip.innerHTML = html;
        }

        function escapeHtml(str) {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showAt(x, y) {
            tooltip.classList.add('show');
            tooltip.setAttribute('aria-hidden', 'false');
            const rect = tooltip.getBoundingClientRect();
            let left = x + OFFSET_X;
            let top = y + OFFSET_Y;
            if (left + rect.width + PADDING > window.innerWidth) left = window.innerWidth - rect.width - PADDING;
            if (left < PADDING) left = PADDING;
            if (top + rect.height + PADDING > window.innerHeight) top = window.innerHeight - rect.height - PADDING;
            if (top < PADDING) top = PADDING;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hide() {
            tooltip.classList.remove('show');
            tooltip.setAttribute('aria-hidden', 'true');
        }

        container.addEventListener('mouseenter', function (e) {
            const card = e.target.closest('a.ios-card');
            if (!card) return;
            const scriptFile = card.getAttribute('data-script-file');
            if (scriptFile) {
                tooltip.innerHTML = '<div class="link-info-tooltip__full">Скрипт: ' + escapeHtml(resolveScriptUrl(scriptFile)) +
                    '</div><div>Клик — копировать в буфер</div>' +
                    '<div class="link-info-tooltip__label">Источник</div>' +
                    '<div>Сначала файл JS/, при ошибке — встроенная копия в index.html</div>';
                showAt(e.clientX, e.clientY);
                return;
            }
            const isModal = card.getAttribute('data-is-modal') === 'true';
            const hrefAttr = card.getAttribute('href');
            const isOnlyHash = hrefAttr === '#' || !hrefAttr;
            let data;
            if (isModal || isOnlyHash) {
                data = null;
            } else {
                data = parseUrlForTooltip(card.href);
            }
            setTooltipContent(data);
            showAt(e.clientX, e.clientY);
        }, true);

        container.addEventListener('mousemove', function (e) {
            const card = e.target.closest('a.ios-card');
            if (!card) return;
            if (tooltip.classList.contains('show')) showAt(e.clientX, e.clientY);
        }, true);

        container.addEventListener('mouseleave', function (e) {
            if (!e.relatedTarget || !container.contains(e.relatedTarget)) hide();
        }, true);

        // Ctrl+клик / Cmd+клик — копировать ссылку в буфер (не для карточек со scriptFile)
        container.addEventListener('click', function (e) {
            const card = e.target.closest('a.ios-card');
            if (!card) return;
            if (card.getAttribute('data-script-file')) return;
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                e.stopPropagation();
                copyToClipboard(card.href, null);
                card.classList.add('copied-blink');
                setTimeout(function () { card.classList.remove('copied-blink'); }, 500);
            }
        }, true);
    })();

    // Адаптация кнопок после загрузки конфигурации
    setTimeout(() => {
        adjustTopActions();
        // Адаптация размеров групп выполняется внутри loadAndRenderConfig
    }, 100);
    
    // Адаптация при изменении размера окна
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            adaptGroupsToFit();
            adjustTopActions();
        }, 150);
    });
    
    // === 3. Проверка доступности ссылок и статусы ===
    // Проставляет статус (зеленый или красный) для каждой кнопки-ссылки
    function setStatus(card, isAvailable) {
    const title = card.querySelector('.ios-card-title');
    if (!title) return;
    if (isAvailable) {
        title.classList.remove('unavailable');
        card.classList.remove('unavailable');
        card.classList.add('available');
    } else {
        title.classList.add('unavailable');
        card.classList.remove('available');
        card.classList.add('unavailable');
    }
}

    // Асинхронно проверяет доступность по HEAD-запросу
    function checkCard(card) {
        const url = card.getAttribute('href');
        if (!url || url.startsWith('#') || url.startsWith('javascript')) return;
        if (!/^https?:\/\//i.test(url)) return;
        fetch(url, { method: 'HEAD', mode: 'no-cors' })
            .then(() => setStatus(card, true))
            .catch(() => setStatus(card, false));
    }
    // Проверить все карточки, одновременно анимируем прогресс-бар
    function checkAllCards() {
        const allCards = document.querySelectorAll('a.ios-card');
        allCards.forEach(checkCard);
        // Анимация прогресс-бара (для UX)
        const progressBar = safeQuerySelector('#progress-bar');
        if (progressBar) {
            progressBar.style.width = "0%";
            progressBar.style.display = "block";
            let width = 0;
            const interval = setInterval(() => {
                width += CONFIG.PROGRESS_BAR_ANIMATION_STEP;
                progressBar.style.width = width + "%";
                if (width >= 100) {
                    progressBar.style.display = "none";
                    clearInterval(interval);
                }
            }, CONFIG.PROGRESS_BAR_ANIMATION_INTERVAL);
        }
    }
    
    // Запускаем проверку после загрузки конфигурации
    setTimeout(() => {
    checkAllCards();
        // Периодическая проверка раз в 2 минуты
        setInterval(checkAllCards, CONFIG.LINK_CHECK_INTERVAL);
    }, 500);

    // === 4. Переключатель темы (пока только добавляет класс к body, для расширения функционала) ===
    const themeSwitcher = document.getElementById('theme-switcher');
    if (themeSwitcher) {
        themeSwitcher.addEventListener('change', function () {
            document.body.classList.toggle('dark-theme', this.checked);
            document.body.classList.toggle('light-theme', !this.checked);
        });
    }

    // === 5. Модалка Permission ===
    const permissionModal = safeQuerySelector('#permission-modal');
    const closePermissionBtn = safeQuerySelector('#close-btn');
    const clearPermissionBtn = safeQuerySelector('#clear-btn');
    const decodeBtn = safeQuerySelector('#decode-btn');
    const permissionInput = safeQuerySelector('#permission-input');
    const permissionResult = safeQuerySelector('#permission-result');
    if (closePermissionBtn && permissionModal) {
        closePermissionBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            permissionModal.classList.remove('show');
        });
    }
    if (clearPermissionBtn) {
        clearPermissionBtn.onclick = function () {
            permissionInput.value = '';
            permissionInput.focus();
            permissionResult.textContent = '';
        };
    }
    if (decodeBtn) {
        decodeBtn.onclick = function () {
            // Алгоритм декодирования HEX-права в биты
            const input = permissionInput.value.trim();
            if (!input) {
                permissionResult.textContent = '';
                return;
            }
            try {
                let hex = input.split(",")
                    .reverse()
                    .map(s => s.replace(/[""]/g, ' '))
                    .map(s => s.trim())
                    .map(s => Number.parseInt(s, 16))
                    .map(n => n.toString(2))
                    .map(s => s.padStart(32, "0"));
                const zeroOnes = hex
                    .join("").split("").reverse().join("");
                const res = [];
                for (let i = 0; i < zeroOnes.length; i++) {
                    if (zeroOnes[i] == "1") {
                        res.push(i);
                    }
                }
                permissionResult.textContent = 'Бинарное представление:\n' +
                    zeroOnes.split('').map((b, idx) => ((idx % 8 === 0 && idx > 0) ? ' ' : '') + b).join('') +
                    '\n\nВключённые биты:\n' + res.join(', ');
            } catch (err) {
                permissionResult.textContent = 'Ошибка! Некорректный ввод.';
            }
        };
    }
    // Закрытие модалки кликом вне окна обрабатывается в ModalManager

    // === 6. Модалка роли ===
    const roleModal = safeQuerySelector('#role-modal');
    const closeRoleModalBtn = safeQuerySelector('#close-role-modal');
    const openRoleLinkBtn = safeQuerySelector('#open-role-link');
    const empInput = safeQuerySelector('#employee-number');
    const roleInput = safeQuerySelector('#role-name');
    const clearEmpBtn = safeQuerySelector('#clear-emp-btn');
    const clearRoleBtn = safeQuerySelector('#clear-role-btn');
    const defaultBtn = safeQuerySelector('#default-btn');

    // Разблокировка кнопки "Открыть" если оба поля не пустые
    function checkRoleInputs() {
        if (openRoleLinkBtn && empInput && roleInput) {
        openRoleLinkBtn.disabled = !(empInput.value.trim() && roleInput.value.trim());
    }
    }
    if (closeRoleModalBtn && roleModal) {
        closeRoleModalBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            roleModal.classList.remove('show');
        });
    }
    // Закрытие модалки кликом вне окна (обрабатывается в ModalManager)
    if(empInput) empInput.addEventListener('input', checkRoleInputs);
    if(roleInput) roleInput.addEventListener('input', checkRoleInputs);
    if(clearEmpBtn) clearEmpBtn.onclick = function() {
        empInput.value = '';
        empInput.focus();
        checkRoleInputs();
    };
    if(clearRoleBtn) clearRoleBtn.onclick = function() {
        roleInput.value = '';
        roleInput.focus();
        checkRoleInputs();
    };
    if(openRoleLinkBtn) openRoleLinkBtn.onclick = function() {
        // Формируем url по шаблону и открываем его в новом окне
        const emp = encodeURIComponent(empInput.value.trim());
        const role = encodeURIComponent(roleInput.value.trim());
        const url = `https://iam-enigma-psi.omega.sbrf.ru/rmkib.support/api/v1/service/auth/explain/html?employee-number=${emp}&role=${role}`;
        window.open(url, '_blank');
    };
    if(defaultBtn) {
        defaultBtn.onclick = function() {
            empInput.value = '673892';
            roleInput.value = 'EFS_NB_SUP_BUSINESS_ADMIN_GAMIFICATION';
            empInput.focus();
            checkRoleInputs();
        };
    }

    // === 7. Экспорт ссылок в JSON ===
    // Функция exportConfigToJSON() объявлена глобально выше

});
