<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ресурсная панель для быстрого доступа к рабочим инструментам и сервисам">
    <meta name="keywords" content="ресурсы, панель, инструменты, сервисы">
    <meta name="author" content="Sberbank">
    
    <!-- Open Graph для социальных сетей -->
    <meta property="og:title" content="Ресурсная панель">
    <meta property="og:description" content="Ресурсная панель для быстрого доступа к рабочим инструментам">
    <meta property="og:type" content="website">
    
    <title>Ресурсная панель</title>
    
<style>
:root {
    /* Liquid Glass iOS 26 - Светлая тема */
    --glass-bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 50%, #d4e0ed 100%);
    --glass-white: rgba(255, 255, 255, 0.7);
    --glass-white-light: rgba(255, 255, 255, 0.6);
    --glass-white-border: rgba(255, 255, 255, 0.5);
    --glass-white-border-light: rgba(255, 255, 255, 0.4);
    --glass-text: #1d1d1f;
    --glass-text-secondary: #6e6e73;
    --glass-blue: #007AFF;
    --glass-blue-light: rgba(0, 122, 255, 0.15);
    --glass-blue-border: rgba(0, 122, 255, 0.3);
    --glass-purple: #5856D6;
    --glass-header-bg: linear-gradient(135deg, rgba(0, 122, 255, 0.15) 0%, rgba(88, 86, 214, 0.15) 100%);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --glass-card-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    --glass-card-shadow-hover: 0 4px 16px rgba(0, 122, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --glass-red: #FF3B30;
    --glass-red-hover: #FF2D20;
    --glass-green: #34C759;
    --glass-green-hover: #30D158;
}

body {
    background: var(--glass-bg-gradient);
    color: var(--glass-text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
}
.container {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}
.ios-title {
    font-weight: 700;
    color: var(--glass-text);
    margin-bottom: 20px;
    font-size: 32px;
    background: linear-gradient(135deg, var(--glass-blue) 0%, var(--glass-purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    user-select: none;
    text-align: center;
    letter-spacing: -0.5px;
    flex-shrink: 0;
}
.top-actions {
    width: 100%;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
    flex-shrink: 0;
}
.top-actions.stacked {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 16px;
}
.groups-viewport {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.groups-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 20px;
    width: 100%;
    min-height: 0;
    height: 100%;
    align-items: stretch;
    box-sizing: border-box;
}
.ios-group {
    display: flex;
    flex-direction: column;
    background: var(--glass-white);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 24px;
    border: 1px solid var(--glass-white-border);
    box-shadow: var(--glass-shadow);
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    height: 100%;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.ios-group:hover {
    transform: translateY(-2px);
    box-shadow: var(--glass-shadow-hover);
}
.ios-group-header {
    font-weight: 600;
    font-size: 20px;
    padding: 16px 20px;
    background: var(--glass-header-bg), linear-gradient(135deg, rgba(0, 122, 255, 0.7) 0%, rgba(88, 86, 214, 0.7) 100%);
    background-clip: padding-box, text;
    -webkit-background-clip: padding-box, text;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    user-select: none;
    color: transparent;
    -webkit-text-fill-color: transparent;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    letter-spacing: -0.3px;
}
.ios-group-cards {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    background: transparent;
    min-height: 0;
    gap: 8px;
    padding: 12px;
    padding-bottom: 12px; /* Минимальный отступ снизу */
    overflow-y: auto;
    overflow-x: hidden;
    align-items: stretch; /* Равномерное выравнивание кнопок */
    justify-content: flex-start; /* Прибиваем кнопки к верху */
}
/* Скроллбар в стиле iOS */
.ios-group-cards::-webkit-scrollbar {
    width: 6px;
}
.ios-group-cards::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.05);
    border-radius: 10px;
}
.ios-group-cards::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
}
.ios-group-cards::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.3);
}
.ios-card {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative; /* Для позиционирования псевдоэлементов */
    width: 100%; /* Заполняет всю ширину контейнера */
    box-sizing: border-box; /* Учитывает padding в ширине */
    background: var(--glass-white-light);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    border: 1px solid var(--glass-white-border-light);
    border-radius: 16px;
    margin: 0;
    font-size: 15px; /* Оптимальный размер шрифта */
    min-height: 48px; /* Минимальная высота для кнопки */
    max-height: 96px; /* Максимальная высота для 3 строк текста */
    padding: 10px 14px; /* Padding для комфортного отображения */
    overflow: hidden; /* Чтобы полоски не выходили за границы */
    font-weight: 500;
    box-shadow: var(--glass-card-shadow);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    color: var(--glass-text);
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
    text-align: center;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
    line-height: 1.5; /* Увеличен line-height для лучшей читаемости */
}
.ios-card:hover, .ios-card:focus {
    background: var(--glass-blue-light);
    border-color: var(--glass-blue-border);
    transform: scale(1.02);
    box-shadow: var(--glass-card-shadow-hover);
    color: var(--glass-text);
}
.ios-card:active {
    transform: scale(0.98);
}
.ios-card-title {
    color: inherit;
    font-weight: 500;
    font-size: inherit;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 auto;
    line-height: 1.5; /* Увеличен line-height для лучшего заполнения */
    word-wrap: break-word;
    overflow-wrap: break-word;
    width: 100%; /* Заполняет всю ширину кнопки */
}
.ios-card-status {
    margin-left: 13px;
    width: 8.5px;
    height: 8.5px;
    border-radius: 50%;
    font-size: 13px !important;
    background: var(--sber-light-green);
    border: 1px solid var(--sber-white);
    box-shadow: 0 0.5px 2px rgba(33,160,56,0.13);
}

.ios-card-status {
    display: none !important;
}
.ios-card-status.unavailable {
    background: var(--sber-red);
}

.ios-card-title.unavailable {
    color: var(--glass-text-secondary) !important;
    opacity: 0.6;
    transition: color .18s, opacity .18s;
}

/* Градиентная полоска слева для типов кнопок */
.ios-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 20px;
    border-radius: 16px 0 0 16px;
    z-index: 1;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    clip-path: ellipse(20px 100% at 10px 50%);
}

/* Текст на полоске слева (типы) */
.ios-card.type-prom::before,
.ios-card.type-psi::before,
.ios-card.type-ift::before {
    display: flex;
    align-items: center;
    justify-content: center;
}

.ios-card.type-prom::before {
    content: 'PROM';
}

.ios-card.type-psi::before {
    content: 'PSI';
}

.ios-card.type-ift::before {
    content: 'IFT';
}

/* PROM - Зелено-салатовые оттенки */
.ios-card.type-prom.available::before {
    background: linear-gradient(90deg, rgba(52, 199, 89, 0.05) 0%, rgba(52, 199, 89, 0.2) 25%, rgba(52, 199, 89, 0.5) 50%, #34C759 75%, #34C759 100%);
    box-shadow: 0 0 8px rgba(52, 199, 89, 0.4);
    color: rgba(15, 130, 35, 0.9);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

.ios-card.type-prom.unavailable::before {
    background: linear-gradient(90deg, rgba(142, 217, 159, 0.03) 0%, rgba(142, 217, 159, 0.15) 25%, rgba(142, 217, 159, 0.4) 50%, #8FD99F 75%, #8FD99F 100%);
    opacity: 0.6;
    color: rgba(50, 160, 70, 0.65);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

/* PSI - Желто-сиреневые */
.ios-card.type-psi.available::before {
    background: linear-gradient(90deg, rgba(255, 214, 10, 0.05) 0%, rgba(255, 214, 10, 0.2) 25%, rgba(255, 214, 10, 0.5) 50%, #FFD60A 75%, #FFD60A 100%);
    box-shadow: 0 0 8px rgba(255, 214, 10, 0.4);
    color: rgba(200, 150, 0, 0.9);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

.ios-card.type-psi.unavailable::before {
    background: linear-gradient(90deg, rgba(255, 230, 128, 0.03) 0%, rgba(255, 230, 128, 0.15) 25%, rgba(255, 230, 128, 0.4) 50%, #FFE680 75%, #FFE680 100%);
    opacity: 0.6;
    color: rgba(220, 180, 40, 0.65);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

/* IFT - Бледно-голубые */
.ios-card.type-ift.available::before {
    background: linear-gradient(90deg, rgba(90, 200, 250, 0.05) 0%, rgba(90, 200, 250, 0.2) 25%, rgba(90, 200, 250, 0.5) 50%, #5AC8FA 75%, #5AC8FA 100%);
    box-shadow: 0 0 8px rgba(90, 200, 250, 0.4);
    color: rgba(0, 120, 200, 0.9);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

.ios-card.type-ift.unavailable::before {
    background: linear-gradient(90deg, rgba(168, 224, 255, 0.03) 0%, rgba(168, 224, 255, 0.15) 25%, rgba(168, 224, 255, 0.4) 50%, #A8E0FF 75%, #A8E0FF 100%);
    opacity: 0.6;
    color: rgba(60, 140, 210, 0.65);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
    transform: rotate(180deg);
}

/* OTHER - без раскраски (текущее отражение) */
.ios-card.type-other::before {
    display: none;
}

/* Градиентная полоска справа для сегментов сети */
.ios-card::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 20px;
    border-radius: 0 16px 16px 0;
    z-index: 1;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    clip-path: ellipse(20px 100% at 100% 50%);
}

/* Текст на полоске справа (сегменты) */
.ios-card.segment-alpha::after,
.ios-card.segment-sigma::after {
    display: flex;
    align-items: center;
    justify-content: center;
}

.ios-card.segment-alpha::after {
    content: 'ALPHA';
}

.ios-card.segment-sigma::after {
    content: 'SIGMA';
}

/* SIGMA - Пурпурно-розовый градиент (справа, от яркого к тусклому) */
.ios-card.segment-sigma.available::after {
    background: linear-gradient(90deg, rgba(255, 45, 85, 0.05) 0%, rgba(255, 45, 85, 0.2) 25%, rgba(255, 45, 85, 0.5) 50%, #FF2D55 75%, #FF2D55 100%);
    box-shadow: 0 0 8px rgba(255, 45, 85, 0.4);
    color: rgba(255, 255, 255, 0.7);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
}

.ios-card.segment-sigma.unavailable::after {
    background: linear-gradient(90deg, rgba(255, 182, 193, 0.03) 0%, rgba(255, 182, 193, 0.15) 25%, rgba(255, 182, 193, 0.4) 50%, rgba(255, 182, 193, 0.6) 75%, rgba(255, 182, 193, 0.6) 100%);
    opacity: 0.6;
    color: rgba(200, 80, 100, 0.8);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
}

/* ALPHA - Фиолетово-индиго градиент (справа, от яркого к тусклому) */
.ios-card.segment-alpha.available::after {
    background: linear-gradient(90deg, rgba(88, 86, 214, 0.05) 0%, rgba(88, 86, 214, 0.2) 25%, rgba(88, 86, 214, 0.5) 50%, #5856D6 75%, #5856D6 100%);
    box-shadow: 0 0 8px rgba(88, 86, 214, 0.4);
    color: rgba(255, 255, 255, 0.7);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
}

.ios-card.segment-alpha.unavailable::after {
    background: linear-gradient(90deg, rgba(175, 170, 255, 0.03) 0%, rgba(175, 170, 255, 0.15) 25%, rgba(175, 170, 255, 0.4) 50%, rgba(175, 170, 255, 0.6) 75%, rgba(175, 170, 255, 0.6) 100%);
    opacity: 0.6;
    color: rgba(120, 110, 200, 0.8);
    font-size: 8px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1.5px;
}

/* UNIVERSAL - без раскраски */
.ios-card.segment-universal::after {
    display: none;
}

/* Краткая анимация «ссылка скопирована» (Ctrl/Cmd + клик) */
.ios-card.copied-blink {
    animation: linkCopiedFlash 0.5s ease-out;
}
@keyframes linkCopiedFlash {
    0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(0, 122, 255, 0); }
    100% { box-shadow: none; }
}
/* Ошибка копирования скрипта */
.ios-card.copy-failed {
    animation: linkCopyFailedFlash 0.5s ease-out;
}
@keyframes linkCopyFailedFlash {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.45); }
    50% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
    100% { box-shadow: none; }
}
.ios-card.copy-loading {
    opacity: 0.65;
    pointer-events: none;
}
/* Успех: скопировано из файла JS/ */
.ios-card.copied-from-file {
    animation: linkCopiedFlash 0.5s ease-out;
}
/* Успех: скопировано из встроенной копии в index.html */
.ios-card.copied-from-embedded {
    animation: scriptCopiedEmbeddedFlash 0.5s ease-out;
}
@keyframes scriptCopiedEmbeddedFlash {
    0% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.45); }
    50% { box-shadow: 0 0 0 8px rgba(255, 149, 0, 0); }
    100% { box-shadow: none; }
}

/* Toast: откуда скопирован скрипт */
.script-copy-toast {
    position: fixed;
    z-index: 10001;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0;
    pointer-events: none;
    max-width: min(520px, 92vw);
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
    font-size: 13px;
    line-height: 1.45;
    color: #1d1d1f;
    transition: opacity 0.22s ease, transform 0.22s ease;
}
.script-copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
.script-copy-toast--file {
    border-left: 4px solid #007aff;
}
.script-copy-toast--embedded {
    border-left: 4px solid #ff9500;
}
.script-copy-toast__title {
    font-weight: 600;
    margin-bottom: 4px;
}
.script-copy-toast__path {
    color: #6e6e73;
    font-size: 12px;
    word-break: break-all;
}

/* ==== Модалки (универсальные) - Liquid Glass стиль ==== */
.modal {
    display: none;
    position: fixed;
    z-index: 1050;
    left: 0; top: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
    transition: background .22s;
}
.modal.show { display: flex; }
/* Унифицированный размер для всех модальных окон */
.modal-content {
    background: var(--glass-white);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-radius: 28px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.15),
        0 8px 24px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border: 1px solid var(--glass-white-border);
    padding: 36px 36px 28px 36px;
    max-width: 800px;
    min-width: 500px;
    width: 94vw;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn .23s cubic-bezier(.68,-0.55,.27,1.55);
    color: var(--glass-text);
    box-sizing: border-box;
}
/* Скроллбар для модальных окон */
.modal-content::-webkit-scrollbar {
    width: 8px;
}
.modal-content::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.05);
    border-radius: 10px;
}
.modal-content::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
}
.modal-content::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.3);
}
/* Унифицированный размер для всех модальных окон */
.modal-content.modal-large,
.modal-content.modal-small,
.modal-content {
    max-width: 700px; /* Единый размер для всех модалок */
    min-width: 500px;
    width: 92vw;
    padding: 32px 32px 24px 32px; /* Единый padding */
}
@keyframes modalIn {
    from { opacity: 0; transform: scale(.98) translateY(40px);}
    to   { opacity: 1; transform: scale(1)   translateY(0);}
}
.modal-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--glass-text);
    margin-bottom: 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--glass-blue) 0%, var(--glass-purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.modal-buttons {
    display: flex;
    gap: 10px; /* Уменьшен gap для более аккуратного вида */
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
}
/* Унифицированный порядок кнопок: основные действия слева, служебные справа */
.modal-buttons-primary {
    display: flex;
    gap: 10px; /* Уменьшен gap */
    flex-wrap: wrap;
    flex: 1;
    align-items: center;
}
.modal-buttons-secondary {
    display: flex;
    gap: 10px; /* Уменьшен gap */
    flex-wrap: wrap;
    margin-left: auto;
    align-items: center;
}
/* Унифицированные стили для всех кнопок в модальных окнах */
.modal-button {
    min-width: 100px;
    white-space: nowrap;
}
.modal-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.modal-button:disabled:hover {
    background: var(--sber-blue);
}

/**
 * Нормализация табельного: цифры, при необходимости ведущие нули до 8 знаков.
 * @param {string} s
 * @returns {string|null}
 */
function normalizeEmpId(s) {
  if (!s || typeof s !== "string") return null;
  const digits = s.replace(/\D/g, "");
  if (digits.length === 0) return null;
  let t = digits;
  if (t.length < 8) t = t.padStart(8, "0");
  if (t.length > 20) t = t.slice(-20);
  return t;
}

/**
 * Разбор списка ТН из текста или содержимого .txt: группы цифр, любые нецифры — разделители (как в Profile_GP / _from_file).
 * @param {string} text
 * @returns {string[]}
 */
function parseEmpIdsFromText(text) {
  if (!text || typeof text !== "string") return [];
  const seq = text.match(/\d+/g) || [];
  const out = [];
  const seen = {};
  for (let i = 0; i < seq.length; i++) {
    const n = normalizeEmpId(seq[i]);
    if (n && !seen[n]) {
      seen[n] = true;
      out.push(n);
    }
  }
  return out;
}

/**
 * Разбор поисковых значений без нормализации:
 * разделители только перенос строки, ";" и ",".
 * Пробел внутри значения (например ФИО) сохраняется.
 * @param {string} text
 * @returns {string[]}
 */

  if (!text || typeof text !== "string") return [];
  var parts = text
    .split(/[\r\n;,]+/)
    .map(function (s) {
      return s.trim();
    })
    .filter(Boolean);
  var out = [];
  var seen = {};
  for (var i = 0; i < parts.length; i++) {
    var v = parts[i];
    if (seen[v]) continue;
    seen[v] = true;
    out.push(v);
  }
  return out;
}

const AB_OE_FILE_ENV_PREFIX = "PROM_ALPHA_";

/**
 * @param {number} n
 * @returns {string}
 */
function pad2Export(n) {
  return n < 10 ? "0" + n : String(n);
}

/**
 * Колонки с суффиксами (01)(02): сначала все поля (01), затем (02)…
 * @param {string[]} allKeys
 * @param {string} prefix
 * @param {string[]} fields
 * @returns {string[]}
 */
function orderIndexedColumns(allKeys, prefix, fields) {
  var prefixNeedle = prefix + " - ";
  var matched = allKeys.filter(function (k) {
    return k.indexOf(prefixNeedle) === 0;
  });
  if (matched.length === 0) return [];
  var maxIdx = 0;
  for (var mi = 0; mi < matched.length; mi++) {
    var m = matched[mi].match(/\((\d+)\)\s*$/);
    if (m) maxIdx = Math.max(maxIdx, parseInt(m[1], 10));
  }
  var ordered = [];
  for (var idx = 1; idx <= maxIdx; idx++) {
    var idxStr = pad2Export(idx);
    for (var fi = 0; fi < fields.length; fi++) {
      var col = prefixNeedle + fields[fi] + " (" + idxStr + ")";
      if (matched.indexOf(col) >= 0) ordered.push(col);
    }
  }
  return ordered;
}

/**
 * Локальный timestamp для имён файлов: YYYYMMDD_HHMM.
 * @param {Date} [date]
 * @returns {string}
 */
function formatExportTimestampLocal(date) {
  var d = date || new Date();
  return (
    d.getFullYear() +
    pad2Export(d.getMonth() + 1) +
    pad2Export(d.getDate()) +
    "_" +
    pad2Export(d.getHours()) +
    pad2Export(d.getMinutes())
  );
}

function collectSearchHitsFromPages(pages) {
  if (!Array.isArray(pages)) return [];
  var out = [];
  for (var pi = 0; pi < pages.length; pi++) {
    var pg = pages[pi];
    var data = pg && pg.data;
    if (!data || typeof data !== "object") continue;
    var hits = Array.isArray(data.hits)
      ? data.hits
      : data.body && Array.isArray(data.body.hits)
        ? data.body.hits
        : [];
    for (var hi = 0; hi < hits.length; hi++) {
      if (hits[hi] && typeof hits[hi] === "object") out.push(hits[hi]);
    }
  }
  return out;
}

/**
 * Основной email из empInfoFull: contactEmail или isMain / первый address.
 * @param {*} body
 * @returns {string|null}
 */
function pickContactEmailFromEmpBody(body) {
  if (!body || typeof body !== "object") return null;
  if (body.contactEmail != null && String(body.contactEmail).trim()) return String(body.contactEmail).trim();
  if (!Array.isArray(body.emails)) return null;
  for (var i = 0; i < body.emails.length; i++) {
    var em = body.emails[i];
    if (em && em.isMain && em.address) return String(em.address);
  }
  for (var j = 0; j < body.emails.length; j++) {
    var em2 = body.emails[j];
    if (em2 && em2.address) return String(em2.address);
  }
  return null;
}

/**
 * @param {*} body
 * @returns {object}
 */
function pickEmpInfoFormatted(body) {
  if (!body || typeof body !== "object") return {};
  var deptTree = [];
  if (Array.isArray(body.deptTree)) {
    for (var i = 0; i < body.deptTree.length; i++) {
      var n = body.deptTree[i];
      if (!n) continue;
      deptTree.push({
        id: n.id != null ? String(n.id) : "",
        name: n.name != null ? n.name : null
      });
    }
  }
  var emails = [];
  if (Array.isArray(body.emails)) {
    for (var e = 0; e < body.emails.length; e++) {
      var em = body.emails[e];
      if (!em) continue;
      emails.push({
        address: em.address != null ? em.address : null,
        domain: em.domain != null ? em.domain : null,
        isMain: em.isMain != null ? em.isMain : null
      });
    }
  }
  var phones = [];
  if (Array.isArray(body.phones)) {
    for (var p = 0; p < body.phones.length; p++) {
      var ph = body.phones[p];
      if (!ph) continue;
      phones.push({
        type: ph.type != null ? ph.type : null,
        phoneNumber: ph.phoneNumber != null ? ph.phoneNumber : null,
        main: ph.main != null ? ph.main : null
      });
    }
  }
  var logins = [];
  if (Array.isArray(body.logins)) {
    for (var l = 0; l < body.logins.length; l++) {
      var lg = body.logins[l];
      if (!lg) continue;
      logins.push({
        domain: lg.domain != null ? lg.domain : null,
        accountName: lg.accountName != null ? lg.accountName : null
      });
    }
  }
  var abs = body.absences;
  var absences = null;
  if (abs && typeof abs === "object") {
    absences = {
      isLong: abs.isLong != null ? abs.isLong : null,
      isAbsent: abs.isAbsent != null ? abs.isAbsent : null,
      info: null
    };
    var inf = abs.info;
    if (inf && typeof inf === "object") {
      absences.info = {
        isAbsent: inf.isAbsent != null ? inf.isAbsent : null,
        isLong: inf.isLong != null ? inf.isLong : null,
        startDate: inf.startDate != null ? inf.startDate : null,
        endDate: inf.endDate != null ? inf.endDate : null,
        typeId: inf.typeId != null ? inf.typeId : null,
        typeName: inf.typeName != null ? inf.typeName : null,
        daysRemains: inf.daysRemains != null ? inf.daysRemains : null
      };
    } else if (abs.commonAbsence && typeof abs.commonAbsence === "object") {
      var ca = abs.commonAbsence;
      absences.info = {
        isAbsent: abs.isAbsent != null ? abs.isAbsent : null,
        isLong: abs.isLong != null ? abs.isLong : null,
        startDate: ca.startDate != null ? ca.startDate : null,
        endDate: ca.endDate != null ? ca.endDate : null,
        typeId: ca.outStatusType != null ? ca.outStatusType : null,
        typeName: ca.text != null ? ca.text : null,
        daysRemains: null
      };
    }
  }
  return {
    birthday: body.birthday != null ? body.birthday : null,
    deptTree: deptTree,
    dir: body.dir != null ? body.dir : null,
    contactEmail: pickContactEmailFromEmpBody(body),
    empAddress: body.empAddress != null ? body.empAddress : null,
    empPlace: body.empPlace != null ? body.empPlace : null,

    oldFamilyName: body.oldFamilyName != null ? body.oldFamilyName : null,
    phones: phones,
    jobTitle: body.jobTitle != null ? body.jobTitle : null,
    logins: logins,

    empTBname: body.empTBname != null ? body.empTBname : null,
    isAgile: body.isAgile != null ? body.isAgile : null,

    isRemote: body.isRemote != null ? body.isRemote : null,

/**
 * Разворачивает массивы в плоские колонки CSV с суффиксами (01), (02).
 * @param {string} prefix
 * @param {object[]} items
 * @param {string[]} fields
 * @returns {Record<string, string>}
 */
function flattenArrayColumnsForCsv(prefix, items, fields) {
  var out = {};
  if (!Array.isArray(items)) items = [];
  for (var i = 0; i < items.length; i++) {
    var idx = pad2Export(i + 1);
    var row = items[i] || {};
    for (var fi = 0; fi < fields.length; fi++) {
      var f = fields[fi];
      var key = prefix + " - " + f + " (" + idx + ")";
      var val = row[f];
      out[key] = val == null ? "" : String(val);
    }
  }
  return out;
}

/**
 * @param {Record<string, string>} row
 * @param {string[]} orderedKeys
 * @returns {string}
 */
function csvRowFromOrderedKeys(row, orderedKeys) {
  var cells = [];
  for (var i = 0; i < orderedKeys.length; i++) {
    cells.push(escapeCsvField(row[orderedKeys[i]] != null ? row[orderedKeys[i]] : ""));
  }
  return cells.join(AB_OE_CSV_DELIMITER);
}

  /**
   * Извлекает nextPageToken из ответа search (поддержка нескольких форматов ответа).
   * @param {*} data
   * @returns {string}
   */
  function getSearchNextPageToken(data) {
    if (!data || typeof data !== "object") return "";
    var raw = "";
    if (data.nextPageToken != null) raw = data.nextPageToken;
    else if (data.body && data.body.nextPageToken != null) raw = data.body.nextPageToken;
    return String(raw == null ? "" : raw).trim();
  }

  /**
   * Количество hits в одном ответе search.
   * @param {*} data
   * @returns {number}
   */
  function getSearchHitsCount(data) {
    if (!data || typeof data !== "object") return 0;
    if (Array.isArray(data.hits)) return data.hits.length;
    if (data.body && Array.isArray(data.body.hits)) return data.body.hits.length;
    return 0;
  }

  /**
   * Считывает все страницы search до пустого nextPageToken.
   * @param {{input: string, searchText: string|number, asNumber: boolean}} item
   * @returns {Promise<{pages: Array, totalPages: number, totalHits: number, employeeIds: string[], stopReason: string}>}
   */
  async function fetchAllSearchPages(item) {
    var pages = [];
    var totalHits = 0;
    var pageToken = null;
    var pageNo = 1;
    var seenTokens = {};
    var stopReason = "completed";
    while (true) {
      var r = await fetchEmployeesSearch(item.searchText, item.asNumber, pageToken);
      pages.push(r);
      var hitsCount = getSearchHitsCount(r.data);
      totalHits += hitsCount;
      var nextToken = getSearchNextPageToken(r.data);
      appendLog(
        "    → Search стр. " +
          pageNo +
          ": HTTP " +
          r.status +
          (r.ok ? " OK" : " ошибка") +
          ", hits: " +
          hitsCount +
          ", nextPageToken: " +
          (nextToken ? "есть" : "пусто")
      );
      if (!r.ok) {
        stopReason = "http_error";
        break;
      }
      if (!nextToken) {
        stopReason = "no_next_token";
        break;
      }
      if (seenTokens[nextToken]) {
        stopReason = "repeated_next_token";
        appendLog("    → предупреждение: повтор nextPageToken, остановка пагинации.");
        break;
      }
      seenTokens[nextToken] = true;
      pageToken = nextToken;
      pageNo++;
      if (pageNo > 200) {
        stopReason = "page_limit_reached";
        appendLog("    → предупреждение: достигнут лимит 200 страниц, остановка пагинации.");
        break;
      }
    }

    var employeeIds = [];
    var seenEmployeeIds = {};
    for (var i = 0; i < pages.length; i++) {
      var ids = pickEmployeeIdsFromSearchData(pages[i].data);
      for (var j = 0; j < ids.length; j++) {
        var id = ids[j];
        if (seenEmployeeIds[id]) continue;
        seenEmployeeIds[id] = true;
        employeeIds.push(id);
      }
    }

    return {
      pages: pages,
      totalPages: pages.length,
      totalHits: totalHits,
      employeeIds: employeeIds,
      stopReason: stopReason
    };
  }

  /**
   * Search → empInfoFull → departments (OE): полный пайплайн и выгрузки PROM_ALPHA_AB_*.
   * @param {{input: string, searchText: string|number, asNumber: boolean}[]} items
   * @param {number} pauseBetweenMs
   * @param {number} pauseAfterSearchMs
   * @param {number} pauseAfterEmpMs
   * @param {{AB_Search: boolean, AB_empInfoFull: boolean, AB_deptTree_id: boolean, AB_full: boolean, AB_profile_json: boolean, AB_profile_csv: boolean}} saveFiles
   * @param {string} [sourceTag]
   */
  async function runSearchEmpInfoFullOeExport(
    items,
    pauseBetweenMs,
    pauseAfterSearchMs,
    pauseAfterEmpMs,
    saveFiles,
    sourceTag
  ) {
    var prefix = sourceTag ? sourceTag + " — " : "";
    var envKey = getAddressBookEnvKey();
    var tsStamp = formatExportTimestampLocal(new Date());
    var standOrigin = getAddressBookStandAndOrigin();
    var saveList = [];
    if (saveFiles.AB_Search) saveList.push("AB_Search");
    if (saveFiles.AB_empInfoFull) saveList.push("AB_empInfoFull");
    if (saveFiles.AB_deptTree_id) saveList.push("AB_deptTree_id");
    if (saveFiles.AB_full) saveList.push("AB_full");
    if (saveFiles.AB_profile_json) saveList.push("AB_profile.json");
    if (saveFiles.AB_profile_csv) saveList.push("AB_profile.csv");

    console.log(
      "[Адресная книга OE] Search → empInfoFull → OE. Значений: " +
        items.length +
        ". Файлы: " +
        (saveList.length ? saveList.join(", ") : "—")
    );
    appendLog(
      prefix +
        "Search → empInfoFull → OE, значений: " +
        items.length +
        ", стенд: " +
        envKey +
        ", ts: " +
        tsStamp +
        ", сохранение: " +
        (saveList.length ? saveList.join(", ") : "ничего не выбрано")
    );

    var searchPhaseItems = [];
    var flatHitEmpOrder = [];
    var firstHitByEmpId = new Map();

    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      appendLog(
        "[Search " +
          (i + 1) +
          "/" +
          items.length +
          "] «" +
          String(item.input).slice(0, 60) +
          "» …"
      );
      try {
        const searchBundle = await fetchAllSearchPages(item);
        const hits = collectSearchHitsFromPages(searchBundle.pages);
        for (var hi = 0; hi < hits.length; hi++) {
          var h = hits[hi];
          if (!h || typeof h.employeeId !== "string") continue;
          var eid = h.employeeId.trim();
          if (!eid) continue;
          flatHitEmpOrder.push(eid);
          if (!firstHitByEmpId.has(eid)) firstHitByEmpId.set(eid, h);
        }
        var notFound = hits.length === 0;
        searchPhaseItems.push({
          input: item.input,
          searchText: item.searchText,
          asNumber: item.asNumber,
          searchPages: searchBundle.pages,
          hits: hits,
          notFound: notFound,
          searchStats: {
            totalPages: searchBundle.totalPages,
            totalHits: searchBundle.totalHits,
            uniqueEmployeeIds: searchBundle.employeeIds.length,
            stopReason: searchBundle.stopReason
          }
        });
        appendLog(
          (notFound ? "    → Search: не найдено" : "    → Search: hits=" +
            searchBundle.totalHits +
            ", уникальных employeeId=" +
            searchBundle.employeeIds.length)
        );
      } catch (e) {
        searchPhaseItems.push({
          input: item.input,
          searchText: item.searchText,
          asNumber: item.asNumber,
          error: String(e)
        });
        appendLog("    → исключение Search: " + e);
      }
      if (i < items.length - 1 && pauseBetweenMs > 0) await delay(pauseBetweenMs);
    }

    var allUniqueEmpIds = uniqueEmployeeIdsFirstOccurrence(flatHitEmpOrder);

    var fnameSearch = buildOeExportFileName("AB_Search", tsStamp);
    if (saveFiles.AB_Search) {
      downloadJson(fnameSearch, {
        exportedAt: new Date().toISOString(),
        scenario: "search_empInfoFull_oe_search",
        sourceTag: sourceTag || null,
        stand: envKey,
        origin: standOrigin.origin,
        timestamp: tsStamp,
        items: searchPhaseItems
      });
      appendLog("Файл: " + fnameSearch);
    }

    if (pauseAfterSearchMs > 0 && allUniqueEmpIds.length > 0) await delay(pauseAfterSearchMs);

    var empInfoById = new Map();
    appendLog("Фаза empInfoFull: " + allUniqueEmpIds.length);
    for (let k = 0; k < allUniqueEmpIds.length; k++) {
      var empUuid = allUniqueEmpIds[k];
      appendLog("[" + (k + 1) + "/" + allUniqueEmpIds.length + "] empInfoFull " + empUuid + " …");
      if (k > 0 && pauseBetweenMs > 0) await delay(pauseBetweenMs);
      try {
        var full = await fetchEmpInfoFull(empUuid);
        empInfoById.set(empUuid, full);
        var empDescOe = describeEmpInfoFullResponse(empUuid, full);
        appendLog(empDescOe.logLine.replace("    → ", "    → empInfoFull "));
      } catch (e) {
        empInfoById.set(empUuid, { empId: empUuid, ok: false, status: 0, data: null, error: String(e) });
        appendLog("    → исключение: " + e);
      }
    }

    var fnameEmp = buildOeExportFileName("AB_empInfoFull", tsStamp);
    if (saveFiles.AB_empInfoFull) {
      var empList = [];
      empInfoById.forEach(function (val, key) {
        empList.push({ employeeId: key, empInfoFull: val });
      });
      downloadJson(fnameEmp, {
        exportedAt: new Date().toISOString(),
        scenario: "search_empInfoFull_oe_empInfoFull",
        timestamp: tsStamp,
        stand: envKey,
        results: empList
      });
      appendLog("Файл: " + fnameEmp);
    }

    if (pauseAfterEmpMs > 0 && allUniqueEmpIds.length > 0) await delay(pauseAfterEmpMs);

    var deptCache = new Map();
    var deptLinks = [];
    var uniqueDeptIdsOrdered = [];
    var deptIdSeenCollect = {};
    for (let k2a = 0; k2a < allUniqueEmpIds.length; k2a++) {
      var empWrapA = empInfoById.get(allUniqueEmpIds[k2a]);
      var empBodyA = empWrapA && empWrapA.data ? empWrapA.data : null;
      var nodesA = extractDeptTreeNodes(empBodyA);
      for (var dna = 0; dna < nodesA.length; dna++) {
        var deptIdA = nodesA[dna].id;
        if (!deptIdSeenCollect[deptIdA]) {
          deptIdSeenCollect[deptIdA] = true;
          uniqueDeptIdsOrdered.push(deptIdA);
        }
      }
    }
    appendLog(
      "Фаза departments (OE): уникальных dept id=" +
        uniqueDeptIdsOrdered.length +
        " (1 GET на id)"
    );
    for (let di = 0; di < uniqueDeptIdsOrdered.length; di++) {
      var deptIdFetch = uniqueDeptIdsOrdered[di];
      appendLog("  GET departments/" + deptIdFetch + " …");
      try {
        var deptRes = await fetchDepartmentById(deptIdFetch);
        deptCache.set(deptIdFetch, deptRes);
        appendLog("    → HTTP " + deptRes.status + (deptRes.ok ? " OK" : " ошибка"));
      } catch (e2) {
        deptCache.set(deptIdFetch, {
          deptId: deptIdFetch,
          ok: false,
          status: 0,
          data: null,
          error: String(e2)
        });
        appendLog("    → исключение: " + e2);
      }
      if (di < uniqueDeptIdsOrdered.length - 1 && pauseBetweenMs > 0) await delay(pauseBetweenMs);
    }
    for (let k2 = 0; k2 < allUniqueEmpIds.length; k2++) {
      var empId2 = allUniqueEmpIds[k2];
      var empWrap = empInfoById.get(empId2);
      var empBody = empWrap && empWrap.data ? empWrap.data : null;
      var nodes = extractDeptTreeNodes(empBody);
      for (var dn = 0; dn < nodes.length; dn++) {
        var deptId = nodes[dn].id;
        deptLinks.push({
          deptId: deptId,
          employeeId: empId2,
          department: deptCache.get(deptId) || null
        });
      }
    }

    var deptByIdObj = {};
    deptCache.forEach(function (val, key) {
      deptByIdObj[key] = val;
    });
    var fnameDept = buildOeExportFileName("AB_deptTree_id", tsStamp);
    if (saveFiles.AB_deptTree_id) {
      downloadJson(fnameDept, {
        exportedAt: new Date().toISOString(),
        scenario: "search_empInfoFull_oe_departments",
        timestamp: tsStamp,
        byId: deptByIdObj,
        byEmployeeLinks: deptLinks
      });
      appendLog("Файл: " + fnameDept);
    }

    var fullTreeSearches = [];
    for (var si = 0; si < searchPhaseItems.length; si++) {
      var sp = searchPhaseItems[si];
      if (sp.error) {
        fullTreeSearches.push(sp);
        continue;
      }
      var empNodes = [];
      var hitsArr = sp.hits || [];
      if (sp.notFound) {
        empNodes.push({
          notFound: true,
          searchedInput: sp.input,
          employeeId: AB_OE_NOT_FOUND,
          searchHit: buildNotFoundSearchHitFormatted(sp.input),
          empInfoFull: null,
          departments: []
        });
        fullTreeSearches.push({
          input: sp.input,
          searchText: sp.searchText,
          asNumber: sp.asNumber,
          searchPages: sp.searchPages,
          searchStats: sp.searchStats,
          notFound: true,
          employees: empNodes
        });
        continue;
      }
      for (var hj = 0; hj < hitsArr.length; hj++) {
        var hit = hitsArr[hj];
        var eidHit = hit && hit.employeeId ? String(hit.employeeId).trim() : "";
        if (!eidHit) continue;
        var empFull = empInfoById.get(eidHit) || null;
        var deptNodesOut = [];
        var bodyHit = empFull && empFull.data ? empFull.data : null;
        var dtNodes = extractDeptTreeNodes(bodyHit);
        for (var dt = 0; dt < dtNodes.length; dt++) {
          var did = dtNodes[dt].id;
          deptNodesOut.push({
            deptTreeNode: dtNodes[dt],
            department: deptCache.get(did) || null
          });
        }
        empNodes.push({
          employeeId: eidHit,
          searchHit: hit,
          empInfoFull: empFull,
          departments: deptNodesOut
        });
      }
      fullTreeSearches.push({
        input: sp.input,
        searchText: sp.searchText,
        asNumber: sp.asNumber,
        searchPages: sp.searchPages,
        searchStats: sp.searchStats,
        employees: empNodes
      });
    }

    var fnameFull = buildOeExportFileName("AB_full", tsStamp);
    if (saveFiles.AB_full) {
      downloadJson(fnameFull, {
        exportedAt: new Date().toISOString(),
        scenario: "search_empInfoFull_oe_full_tree",
        timestamp: tsStamp,
        stand: envKey,
        searches: fullTreeSearches
      });
      appendLog("Файл: " + fnameFull);
    }

    if (saveFiles.AB_profile_json || saveFiles.AB_profile_csv) {
      var profileEmployees = [];
      for (var ui = 0; ui < allUniqueEmpIds.length; ui++) {
        var uid = allUniqueEmpIds[ui];
        var hit0 = firstHitByEmpId.get(uid) || {};
        var empW = empInfoById.get(uid);
        var empB = empW && empW.data ? empW.data : null;
        var fmtSearch = pickSearchHitFormatted(hit0);
        var fmtEmp = pickEmpInfoFormatted(empB);
        var deptProfile = [];
        var dtList = fmtEmp.deptTree || [];
        for (var dp = 0; dp < dtList.length; dp++) {
          var dnode = dtList[dp];
          var dfetch = deptCache.get(dnode.id);
          deptProfile.push({
            id: dnode.id,
            name: dnode.name,
            orgUnit: pickDeptOrgUnit(dfetch)
          });
        }
        profileEmployees.push({
          employeeId: uid,
          search: fmtSearch,
          empInfoFull: fmtEmp,
          deptTreeWithOrgUnit: deptProfile
        });
      }
      for (var nfi = 0; nfi < searchPhaseItems.length; nfi++) {
        var spNf = searchPhaseItems[nfi];
        if (!spNf || !spNf.notFound) continue;
        profileEmployees.push({
          employeeId: AB_OE_NOT_FOUND,
          notFound: true,
          searchedInput: spNf.input,
          search: buildNotFoundSearchHitFormatted(spNf.input),
          empInfoFull: buildNotFoundEmpInfoFormatted(),
          deptTreeWithOrgUnit: []
        });
      }

      var fnameProfile = buildOeExportFileName("AB_profile", tsStamp);
      if (saveFiles.AB_profile_json) {
        downloadJson(fnameProfile, {
          exportedAt: new Date().toISOString(),
          scenario: "search_empInfoFull_oe_profile",
          timestamp: tsStamp,
          employees: profileEmployees
        });
        appendLog("Файл: " + fnameProfile);
      }

      var csvRows = [];
      var allColKeys = [];
      var colSeen = {};

      function addCols(obj) {
        var keys = Object.keys(obj);
        for (var ck = 0; ck < keys.length; ck++) {
          if (!colSeen[keys[ck]]) {
            colSeen[keys[ck]] = true;
            allColKeys.push(keys[ck]);
          }
        }
      }

      var fixedFirst = [
        "employeeId",
        "tabNum",
        "fullName",
        "TN_8",
        "empFamilyName",
        "empName",
        "empPatronymic",

  /**
   * Search → empInfoFull: фаза 1 — все POST search; сохранение ответов Search и CSV
   * («что искали», employeeId по каждой строке hit); фаза 2 — GET empInfoFull по каждому
   * уникальному employeeId (порядок первого появления по всем поискам подряд).
   * @param {{input: string, searchText: string|number, asNumber: boolean}[]} items
   * @param {number} pauseBetweenMs — между запросами в фазе Search и между GET в фазе empInfoFull
   * @param {number} pauseAfterSearchMs — после завершения всех Search, перед первым empInfoFull
   * @param {string} [sourceTag]
   */
  async function runSearchThenEmpInfoFullExport(items, pauseBetweenMs, pauseAfterSearchMs, sourceTag) {
    var prefix = sourceTag ? sourceTag + " — " : "";
    var envKey = getAddressBookEnvKey();
    var ts = Date.now();
    console.log(
      "[Адресная книга] Запущен сценарий search → empInfoFull. Значений: " +
        items.length +
        ". Сначала все Search, затем empInfoFull. Подробности — в «Журнал работы»."
    );
    appendLog(
      prefix +
        "Search → empInfoFull, значений: " +
        items.length +
        ", стенд: " +
        envKey +
        " (фаза 1: все Search; фаза 2: empInfoFull)"
    );

    /** @type {string[][]} */
    var perItemHitOrderedIds = [];
    const searchPhasePayload = [];

    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      appendLog(
        "[Search " +
          (i + 1) +
          "/" +
          items.length +
          "] «" +
          String(item.input).slice(0, 60) +
          (String(item.input).length > 60 ? "…" : "") +
          "» → search(" +
          String(item.searchText) +
          ") …"
      );
      try {
        const searchBundle = await fetchAllSearchPages(item);
        const idsPerHit = collectEmployeeIdsFromSearchPagesInHitOrder(searchBundle.pages);
        const hitsBasic = collectSearchHitsFromPages(searchBundle.pages);
        perItemHitOrderedIds.push(idsPerHit);
        searchPhasePayload.push({
          input: item.input,
          searchText: item.searchText,
          asNumber: item.asNumber,
          searchPages: searchBundle.pages,
          hits: hitsBasic,
          notFound: hitsBasic.length === 0,
          searchStats: {
            totalPages: searchBundle.totalPages,
            totalHits: searchBundle.totalHits,
            uniqueEmployeeIds: searchBundle.employeeIds.length,
            rowsInCsv: idsPerHit.length,
            stopReason: searchBundle.stopReason
          }
        });
        appendLog(
          "    → итог Search: страниц=" +
            searchBundle.totalPages +
            ", hits=" +
            searchBundle.totalHits +
            ", уникальных employeeId=" +
            searchBundle.employeeIds.length +
            ", строк для CSV (по hits)=" +
            idsPerHit.length
        );
      } catch (e) {
        perItemHitOrderedIds.push([]);
        searchPhasePayload.push({
          input: item.input,
          searchText: item.searchText,
          asNumber: item.asNumber,
          error: String(e)
        });
        appendLog("    → исключение: " + e);
      }
      if (i < items.length - 1 && pauseBetweenMs > 0) await delay(pauseBetweenMs);
    }

    var flatHitOrder = [];
    for (var fi = 0; fi < perItemHitOrderedIds.length; fi++) {
      flatHitOrder = flatHitOrder.concat(perItemHitOrderedIds[fi]);
    }
    const allUniqueEmpIds = uniqueEmployeeIdsFirstOccurrence(flatHitOrder);

    const fnameSearch = "addressbook_search_" + envKey + "_" + ts + ".json";
    const fnameCsv = "addressbook_search_employeeId_map_" + envKey + "_" + ts + ".csv";
    const fnameEmp = "addressbook_empInfoFull_" + envKey + "_" + ts + ".json";

    appendLog(
      "Сохранение ответов Search и CSV (до empInfoFull). Уникальных employeeId для GET: " +
        allUniqueEmpIds.length
    );
    downloadJson(fnameSearch, {
      exportedAt: new Date().toISOString(),
      scenario: "search_then_empInfoFull_search_phase",
      sourceTag: sourceTag || null,
      stand: envKey,
      items: searchPhasePayload
    });

    var csvLines = ["\uFEFFчто искали,employeeId"];
    for (let ci = 0; ci < items.length; ci++) {
      var searched = items[ci].input;
      var rowIds = perItemHitOrderedIds[ci] || [];
      for (var cj = 0; cj < rowIds.length; cj++) {
        csvLines.push(escapeCsvField(searched) + "," + escapeCsvField(rowIds[cj]));
      }
    }
    downloadText(fnameCsv, csvLines.join("\r\n"), "text/csv;charset=utf-8");

    appendLog("Файлы фазы Search: " + fnameSearch + ", " + fnameCsv);

    if (pauseAfterSearchMs > 0 && allUniqueEmpIds.length > 0) {
      await delay(pauseAfterSearchMs);
    }

    appendLog("Фаза empInfoFull: запросов: " + allUniqueEmpIds.length);
    const empResults = [];
    var totalEmpInfoFullCalls = 0;
    for (let k = 0; k < allUniqueEmpIds.length; k++) {
      var empUuid = allUniqueEmpIds[k];
      appendLog(
        "[" +
          (k + 1) +
          "/" +
          allUniqueEmpIds.length +
          "] employeeId " +
          empUuid +
          " → GET empInfoFull …"
      );
      if (k > 0 && pauseBetweenMs > 0) await delay(pauseBetweenMs);
      try {
        const full = await fetchEmpInfoFull(empUuid);
        totalEmpInfoFullCalls++;
        var empDescBasic = describeEmpInfoFullResponse(empUuid, full);
        var rowBasic = { employeeId: empDescBasic.resolvedId, empInfoFull: full };
        if (empDescBasic.resolvedId !== String(empUuid).trim()) {
          rowBasic.requestedEmpId = empUuid;
        }
        empResults.push(rowBasic);
        appendLog(empDescBasic.logLine.replace("    → ", "    → empInfoFull "));
      } catch (e) {
        empResults.push({ employeeId: empUuid, error: String(e) });
        appendLog("    → исключение: " + e);
      }
    }

    downloadJson(fnameEmp, {
      exportedAt: new Date().toISOString(),
      scenario: "search_then_empInfoFull_empInfoFull_phase",
      sourceTag: sourceTag || null,
      stand: envKey,
      searchFiles: { searchJson: fnameSearch, searchEmployeeIdCsv: fnameCsv },
      totalUniqueEmployeeIds: allUniqueEmpIds.length,
      results: empResults
    });

    appendLog(
      "Готово. Файлы: " +
        fnameSearch +
        ", " +
        fnameCsv +
        ", " +
        fnameEmp +
        " (GET empInfoFull: " +
        totalEmpInfoFullCalls +
        ")"
    );
    console.log(
      "[Адресная книга] Готово. Search: " +
        fnameSearch +
        " | CSV: " +
        fnameCsv +
        " | empInfoFull: " +
        fnameEmp +
        " | запросов empInfoFull: " +
        totalEmpInfoFullCalls
    );
  }

  // Файл .txt: статистика в журнал, без записи в поле — запуск выбранного сценария по текущему режиму.
  inputFileTn.addEventListener("change", function () {
    var file = inputFileTn.files && inputFileTn.files[0];
    inputFileTn.value = "";
    if (!file) return;
    if (requestBusy) {
      appendLog("Уже выполняется запрос — дождитесь окончания.");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var text = typeof reader.result === "string" ? reader.result : "";
      var mode = getCurrentInputMode();
      var items = parseSearchInputs(text, mode);
      var empIds = parseEmpInfoOnlyInputs(text, mode);
      if (pendingFileAction === "emp_only" ? empIds.length === 0 : items.length === 0) {
        appendLog(
          "Файл «" +
            file.name +
            "»: нет корректных значений для режима «" +
            (mode === "tabnum" ? "Табельный номер" : "Значения для поиска") +
            "»."
        );
        return;
      }
      appendLog(
        "Файл «" +
          file.name +
          "»: извлечено значений: " +
          (pendingFileAction === "emp_only" ? empIds.length : items.length) +
          "."
      );
      var pb = readPauseMsFromInput(inpPauseBetween, REQUEST_PAUSE_MS);
      var pa = readPauseMsFromInput(inpPauseAfterSearch, REQUEST_PAUSE_MS);
      setBusy(true);
      void (async function () {
        try {
          if (pendingFileAction === "search_only") {
            appendLog("Запуск сценария из файла: только Search.");
            await runSearchOnlyExport(items, pb);
          } else if (pendingFileAction === "emp_only") {
            appendLog("Запуск сценария из файла: только empInfoFull.");
            await runEmpInfoFullOnlyExport(empIds, pb);
          } else if (pendingFileAction === "search_then_emp_oe") {
            appendLog("Запуск сценария из файла: Search → empInfoFull → OE.");
            var pe = readPauseMsFromInput(inpPauseAfterEmp, REQUEST_PAUSE_MS);
            await runSearchEmpInfoFullOeExport(
              items,
              pb,
              pa,
              pe,
              getOeSaveFilesFromPanel(),
              "Из файла"
            );
          } else {
            appendLog("Запуск сценария из файла: Search → empInfoFull.");
            await runSearchThenEmpInfoFullExport(items, pb, pa, "Из файла");
          }
        } catch (err) {
          appendLog("Сбой сценария: " + err);
        } finally {
          setBusy(false);
        }
      })();
    };
    reader.onerror = function () {
      appendLog("Ошибка чтения файла «" + file.name + "».");
    };
    reader.readAsText(file, "UTF-8");
  });

      var parsed = parseFileDlConfigItem(periods[j], true);
      if (!parsed.value) continue;
      var period = parsed.value;
      var id = "rating_" + block + "_" + period;
      jobs.push({
        id: id,
        label: "Рейтинг · " + block + " · " + period,
        apiPath: RATINGLIST_FILE_DOWNLOAD_PATH,
        body: { businessBlock: block, timePeriod: period },
        refererPath: "/rating",
        fileName: "gamification-ratingList_" + block + "_" + period + ".csv",
        _defaultChecked: parsed.defaultChecked,
      });
    }
  }
  return jobs;
}

/**
 * @param {string[]} blockNames
 * @returns {number}
 */
function getMaxRatingSeasonCountInBlocks(blockNames) {
  var max = 0;
  for (var bi = 0; bi < blockNames.length; bi++) {
    var name = blockNames[bi];
    for (var ci = 0; ci < FILE_DL_RATING_BLOCKS_CONFIG.length; ci++) {
      var cfg = FILE_DL_RATING_BLOCKS_CONFIG[ci];
      if (cfg.block === name) {
        var n = (cfg.timePeriods || []).length;
        if (n > max) max = n;
        break;
      }
    }
  }
  return max;
}

/**
 * Минимальная высота строки рейтинга под столбик сезонов самого высокого блока в ряду.
 * @param {string[]} blockNames
 * @returns {number}
 */
function calcRatingRowMinHeightPx(blockNames) {
  var maxSeasons = getMaxRatingSeasonCountInBlocks(blockNames);
  if (maxSeasons < 1) maxSeasons = 1;
  var headerPx = 20;
  var seasonRowPx = 17;
  var padPx = 12;
  return headerPx + maxSeasons * seasonRowPx + padPx;
}

function delay(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

/**
 * Читает неотрицательное целое из поля числа с потолком.
 * @param {HTMLInputElement|null} inp
 * @param {number} fallback
 * @param {number} maxMs
 * @returns {number}
 */
function fileDlReadDelayMs(inp, fallback, maxMs) {
  if (!inp) return fallback;
  var n = parseInt(String(inp.value).trim(), 10);
  if (isNaN(n) || n < 0) return fallback;
  if (n > maxMs) return maxMs;
  return n;
}

/** Обновляет рабочие задержки из полей панели (если панель открыта). */

/** Цвета индикатора статуса задачи на панели. */
var FILE_DL_JOB_STATUS_COLOR = {
  idle: "#cbd5e1",
  pending: "#94a3b8",
  sent: "#2563eb",
  ok: "#eab308",
  error: "#dc2626",
  saved: "#16a34a",
};

/** Подсказки индикатора статуса. */
var FILE_DL_JOB_STATUS_TITLE = {
  idle: "Не в текущем пакете",
  pending: "Ожидает отправки",
  sent: "Запрос отправлен",
  ok: "Положительный ответ",
  error: "Ошибка или отрицательный ответ",
  saved: "Файл сохранён",
};

/**
 * UI задач на панели: индикатор и таймер по job.id.
 * @type {Map<string, { dot: HTMLElement, timerEl: HTMLElement, timerHandle: number|null, startMs: number|null }>}
 */
var fileDlJobUiById = new Map();

/**
 * Формат длительности для таймера: мин:сек:мс.
 * @param {number} ms
 * @returns {string}
 */
function formatFileDlElapsedMs(ms) {
  var total = Math.max(0, Math.floor(ms));
  var m = Math.floor(total / 60000);
  var s = Math.floor((total % 60000) / 1000);
  var msPart = total % 1000;
  return m + ":" + String(s).padStart(2, "0") + ":" + String(msPart).padStart(3, "0");
}

/**
 * @param {string} jobId
 * @param {HTMLElement} dot
 * @param {HTMLElement} timerEl
 */
function fileDlRegisterJobUi(jobId, dot, timerEl) {
  if (!jobId) return;
  fileDlJobUiById.set(jobId, {
    dot: dot,
    timerEl: timerEl,
    timerHandle: null,
    startMs: null,
  });
}

/**
 * @param {string} jobId
 * @param {"idle"|"pending"|"sent"|"ok"|"error"|"saved"} status
 */
function fileDlSetJobStatus(jobId, status) {
  var ui = fileDlJobUiById.get(jobId);
  if (!ui || !ui.dot) return;
  ui.dot.style.backgroundColor = FILE_DL_JOB_STATUS_COLOR[status] || FILE_DL_JOB_STATUS_COLOR.idle;
  ui.dot.title = FILE_DL_JOB_STATUS_TITLE[status] || status;
}

/**
 * @param {string} jobId
 */
function fileDlStartJobTimer(jobId) {
  var ui = fileDlJobUiById.get(jobId);
  if (!ui || !ui.timerEl) return;
  fileDlStopJobTimer(jobId, false);
  ui.startMs = Date.now();
  ui.timerEl.textContent = formatFileDlElapsedMs(0);
  ui.timerHandle = window.setInterval(function () {
    if (ui.startMs == null) return;
    ui.timerEl.textContent = formatFileDlElapsedMs(Date.now() - ui.startMs);
  }, 50);
}

/**
 * @param {string} jobId
 * @param {boolean} [showFinal]
 */
function fileDlStopJobTimer(jobId, showFinal) {
  var ui = fileDlJobUiById.get(jobId);
  if (!ui) return;
  if (ui.timerHandle != null) {
    clearInterval(ui.timerHandle);
    ui.timerHandle = null;
  }
  if (showFinal !== false && ui.startMs != null && ui.timerEl) {
    ui.timerEl.textContent = formatFileDlElapsedMs(Date.now() - ui.startMs);
  }
  ui.startMs = null;
}

/**
 * Перед пакетом: отмеченные задачи — «ожидает», остальные — idle.
 * @param {string[]} batchJobIds
 */
function fileDlPrepareBatchJobStatuses(batchJobIds) {
  var batchSet = {};
  for (var i = 0; i < batchJobIds.length; i++) batchSet[batchJobIds[i]] = true;
  fileDlJobUiById.forEach(function (ui, jobId) {
    if (batchSet[jobId]) {
      fileDlSetJobStatus(jobId, "pending");
      if (ui.timerEl) ui.timerEl.textContent = "—";
      fileDlStopJobTimer(jobId, false);
    } else {
      fileDlSetJobStatus(jobId, "idle");
      if (ui.timerEl) ui.timerEl.textContent = "—";
      fileDlStopJobTimer(jobId, false);
    }
  });
}

/**
 * Извлекает имя файла из заголовка Content-Disposition (RFC 5987 / простой вариант).
 * @param {string|null} header
 * @returns {string|null}
 */
function parseFilenameFromContentDisposition(header) {
  if (!header || typeof header !== "string") return null;
  const utf8Match = header.match(/filename\*=UTF-8''([^;\s]+)/i);
  if (utf8Match && utf8Match[1]) {
    try {
      return decodeURIComponent(utf8Match[1].replace(/\+/g, " "));
    } catch (e) {
      return utf8Match[1];
    }
  }
  const quoted = header.match(/filename="([^"]+)"/i);
  if (quoted && quoted[1]) return quoted[1];
  const unquoted = header.match(/filename=([^;\s]+)/i);
  if (unquoted && unquoted[1]) return unquoted[1].replace(/^["']|["']$/g, "");
  return null;
}

/**
 * Проверяет, что Content-Type указывает на JSON.
 * @param {string|null} ct
 * @returns {boolean}
 */
function isJsonContentType(ct) {
  if (!ct || typeof ct !== "string") return false;
  return ct.split(";")[0].trim().toLowerCase() === "application/json";
}

/**
 * Компактная строка тела POST для журнала (параметры выгрузки).
 * @param {object} bodyObj
 * @returns {string}
 */
function formatPostBodyForLog(bodyObj) {
  try {
    return JSON.stringify(bodyObj !== undefined && bodyObj !== null ? bodyObj : {});
  } catch (e) {
    return String(bodyObj);
  }
}

/**
 * Выполняет один POST и инициирует скачивание полученного файла.
 * @param {object} job — элемент из списка задач.
 * @param {object} [ctx] — контекст для логов: groupName, batchName, index (0-based), total.
 * @returns {Promise<{ ok: boolean, status?: number, fileName?: string, error?: string }>}
 */
async function downloadOneJob(job, ctx) {
  ctx = ctx || {};
  var _dlExit = null;
  var jobIdStr = job && job.id ? String(job.id) : "";
  try {
  fileDlSetJobStatus(jobIdStr, "sent");
  fileDlStartJobTimer(jobIdStr);

  const env = getFileDlOriginByEnv();
  const standKey = env.stand;
  const contourKey = env.contour;
  const origin = env.origin;
  const path = job.apiPath || DEFAULT_FILE_DOWNLOAD_PATH;
  const url = origin + path;
  // Origin и Referer в fetch из JS задавать нельзя (запрещённые заголовки) — браузер подставит сам с текущей вкладки.
  // Для совпадения с типичным запросом откройте вкладку на странице вида … + job.refererPath.

  const headers = {
    Accept: "*/*",
    "Content-Type": "application/json"
  };

  // Клонируем тело, чтобы для наград подставить актуальный dateFrom с панели, не мутируя константу DOWNLOAD_JOBS.
  var bodyObj;
  try {
    bodyObj =
      job.body !== undefined && job.body !== null
        ? JSON.parse(JSON.stringify(job.body))
        : {};
  } catch (cloneErr) {
    bodyObj = {};
  }
  if (job.id === "employeeRewardsSummary") {
    syncFileDlRewardsDateFromPanel();
    bodyObj.dateFrom = fileDlEmployeeRewardsDateFrom;
  }

  const groupName = ctx.groupName != null ? ctx.groupName : getGroupNameForJob(job);
  const batchName = ctx.batchName != null ? ctx.batchName : "одиночный запрос (кнопка)";
  const idx = ctx.index;
  const total = ctx.total;
  const posStr =
    idx != null && total != null ? "Файл в пакете: " + (idx + 1) + " из " + total : null;

  fileDlPanelEcho(
    "log",
    "СТАРТ загрузки\n" +
      "Группа: " +
      groupName +
      "\nПакет / режим: " +
      batchName +
      (posStr ? "\n" + posStr : "") +
      "\nЗадача id: " +
      (job.id || "—")
  );

  let res;
  try {
    res = await httpFetch(url, {
      method: "POST",
      credentials: "include",
      headers: headers,
      body: JSON.stringify(bodyObj)
    });
  } catch (e) {
    fileDlSetJobStatus(jobIdStr, "error");
    fileDlStopJobTimer(jobIdStr, true);
    fileDlPanelEcho("error", "ОШИБКА (сеть / исключение)\n" + String(e));
    _dlExit = { ok: false, error: String(e) };
    return _dlExit;
  }

  if (!res.ok) {
    fileDlSetJobStatus(jobIdStr, "error");
    fileDlStopJobTimer(jobIdStr, true);
    fileDlPanelEcho(
      "warn",
      "ОШИБКА HTTP\nСтатус: " + res.status + " " + (res.statusText || "")
    );
    _dlExit = { ok: false, status: res.status };
    return _dlExit;
  }

  // Сервер может вернуть HTTP 200 и JSON с success:false (таймаут и т.д.) — не сохранять как файл.
  const contentType = res.headers.get("Content-Type") || "";
  if (isJsonContentType(contentType)) {
    const textBody = await res.text();
    let data;
    try {
      data = JSON.parse(textBody);
    } catch (parseErr) {
      fileDlSetJobStatus(jobIdStr, "error");
      fileDlStopJobTimer(jobIdStr, true);
      fileDlPanelEcho(
        "warn",
        "ОШИБКА: ответ помечен как JSON, разбор не удался\n" + String(parseErr)
      );
      _dlExit = { ok: false, error: "invalid_json_body" };
      return _dlExit;
    }
    if (data && data.success === false && data.error) {
      const err = data.error;
      fileDlSetJobStatus(jobIdStr, "error");
      fileDlStopJobTimer(jobIdStr, true);
      fileDlPanelEcho(
        "warn",
        "ОШИБКА API (HTTP 200, JSON)\nСтенд: " +
          standKey +
          "\nЗадача id: " +
          (job.id || "—") +
          "\nPOST body: " +
          formatPostBodyForLog(bodyObj) +
          "\ncode: " +
          (err.code || "—") +
          "\nsystem: " +
          (err.system || "—") +
          "\ntext: " +
          (err.text || "—") +
          (err.uuid ? "\nuuid: " + err.uuid : "")
      );
      _dlExit = { ok: false, apiError: err };
      return _dlExit;
    }
    if (data && data.success === true) {
      fileDlSetJobStatus(jobIdStr, "error");
      fileDlStopJobTimer(jobIdStr, true);
      fileDlPanelEcho(
        "warn",
        "Ответ JSON с success:true — не файл выгрузки, скачивание отменено"
      );
      _dlExit = { ok: false, error: "unexpected_json_success" };
      return _dlExit;
    }
    fileDlSetJobStatus(jobIdStr, "error");
    fileDlStopJobTimer(jobIdStr, true);
    fileDlPanelEcho(
      "warn",
      "Ответ application/json непохож на файл выгрузки — скачивание отменено"
    );
    _dlExit = { ok: false, error: "unexpected_json_shape" };
    return _dlExit;
  }

  fileDlSetJobStatus(jobIdStr, "ok");

  const blob = await res.blob();
  const sizeBytes = blob.size;
  const cd = res.headers.get("Content-Disposition");
  const fromHeader = parseFilenameFromContentDisposition(cd);
  const safeLabel = (job.label || job.id || "download").replace(/[/\\?%*:|"<>]/g, "_");
  const fileNameRaw =
    (job.fileName && String(job.fileName).trim()) ||
    fromHeader ||
    safeLabel + ".bin";
  const fileName = standKey + "_" + contourKey + "_" + fileNameRaw;

  const objectUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = objectUrl;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () {
    URL.revokeObjectURL(objectUrl);
  }, 0);

  fileDlSetJobStatus(jobIdStr, "saved");
  fileDlStopJobTimer(jobIdStr, true);

  fileDlPanelEcho(
    "log",
    "ЗАВЕРШЕНО: файл скачан\n" +
      "Стенд/контур: " +
      standKey +
      "/" +
      contourKey +
      "\nЗадача id: " +
      (job.id || "—") +
      "\nPOST body: " +
      formatPostBodyForLog(bodyObj) +
      "\nПуть API: " +
      path +
      "\nИмя файла: " +
      fileName +
      "\nРазмер ответа: " +
      sizeBytes +
      " байт"
  );

  _dlExit = { ok: true, fileName: fileName };
  return _dlExit;
  } finally {
    if (_dlExit != null) fileDlConsoleSingleJobSummary(ctx, _dlExit);
  }
}

/**
 * Последовательно скачивает задачи из массива с паузой из панели (`fileDlDelayBetweenMs`).
 * @param {object[]} jobs
 * @param {string} logLabel — подпись для консоли (название пакета).
 */
async function downloadJobsSequentially(jobs, logLabel) {
  syncFileDlDelaysFromPanel();
  const pauseMs = fileDlDelayBetweenMs;
  const total = jobs.length;
  console.log(
    "[File_DB_Load_GP_v2] Пакет «" +
      logLabel +
      "» (последовательно), задач: " +
      total +
      ". Подробности — в «Журнал работы»."
  );
  fileDlPanelEcho(
    "log",
    "ПАКЕТ: " +
      logLabel +
      "\nСТАРТ последовательной загрузки\nВсего файлов в пакете: " +
      total +
      "\nПауза между запросами: " +
      pauseMs +
      " мс"
  );

  let okCount = 0;
  let errCount = 0;

  for (let i = 0; i < jobs.length; i++) {
    const job = jobs[i];
    const groupName = getGroupNameForJob(job);
    const result = await downloadOneJob(job, {
      groupName: groupName,
      batchName: logLabel,
      index: i,
      total: total
    });
    if (result.ok) okCount++;
    else errCount++;

    if (i < jobs.length - 1 && pauseMs > 0) {
      fileDlPanelEcho(
        "log",
        "Пауза " + pauseMs + " мс перед файлом " + (i + 2) + "/" + total
      );
      await delay(pauseMs);
    }
  }

  fileDlPanelEcho(
    "log",
    "ПАКЕТ: " +
      logLabel +
      "\nФИНИШ: обработано задач: " +
      total +
      "\nУспешно (файл инициирован): " +
      okCount +
      "\nС ошибкой: " +
      errCount
  );
  console.log(
    "[File_DB_Load_GP_v2] Пакет «" +
      logLabel +
      "» завершён (последовательно). Задач: " +
      total +
      ", успешно: " +
      okCount +
      ", ошибок: " +
      errCount
  );
}

/**
 * Пакет с перекрывающимися запросами: интервалы из панели (`fileDlStaggerMinMs`, `fileDlDelayBetweenMs`).
 * @param {object[]} jobs
 * @param {string} logLabel
 */
async function downloadJobsStaggered(jobs, logLabel) {
  syncFileDlDelaysFromPanel();
  const staggerMs = fileDlStaggerMinMs;
  const pauseAfterOkMs = fileDlDelayBetweenMs;
  const total = jobs.length;
  console.log(
    "[File_DB_Load_GP_v2] Пакет «" +
      logLabel +
      "» (скользящий старт), задач: " +
      total +
      ". Подробности — в «Журнал работы»."
  );
  fileDlPanelEcho(
    "log",
    "ПАКЕТ: " +
      logLabel +
      "\nСТАРТ (скользящий старт запросов)\nВсего задач: " +
      total +
      "\nМежду стартами min: " +
      staggerMs +
      " мс | после успеха предыдущего: " +
      pauseAfterOkMs +
      " мс"
  );

  const promises = [];
  for (let i = 0; i < total; i++) {
    const job = jobs[i];
    const groupName = getGroupNameForJob(job);
    const p = downloadOneJob(job, {
      groupName: groupName,
      batchName: logLabel,
      index: i,
      total: total
    });
    promises.push(p);
    if (i < total - 1) {
      await Promise.race([
        delay(staggerMs),
        p.then(function (result) {
          if (result && result.ok) return delay(pauseAfterOkMs);
          return new Promise(function () {});
        })
      ]);
    }
  }

  const results = await Promise.all(promises);
  let okCount = 0;
  let errCount = 0;
  results.forEach(function (r) {
    if (r.ok) okCount++;
    else errCount++;
  });

  fileDlPanelEcho(
    "log",
    "ПАКЕТ: " +
      logLabel +
      "\nФИНИШ: обработано задач: " +
      total +
      "\nУспешно (файл инициирован): " +
      okCount +
      "\nС ошибкой: " +
      errCount
  );
  console.log(
    "[File_DB_Load_GP_v2] Пакет «" +
      logLabel +
      "» завершён (скользящий старт). Задач: " +
      total +
      ", успешно: " +
      okCount +
      ", ошибок: " +
      errCount
  );
}

/**
 * Запуск пакета: последовательно или скользящий старт.
 * @param {object[]} jobs
 * @param {string} logLabel
 * @param {boolean} useStagger
 */
async function downloadJobsBatch(jobs, logLabel, useStagger) {
  if (useStagger) await downloadJobsStaggered(jobs, logLabel);
  else await downloadJobsSequentially(jobs, logLabel);
}

/** Скачивание только отмеченных на панели задач. */
async function downloadCheckedPanelJobs(entries) {
  const jobs = entries
    .filter(function (x) {
      return x.cb.checked;
    })
    .map(function (x) {
      return x.job;
    });
  if (jobs.length === 0) {
    fileDlPanelEcho(
      "warn",
      "Скачать выделенное: нет отмеченных задач. Отметьте чекбоксы или нажмите «Отметить всё»."
    );
    return;
  }
  fileDlPrepareBatchJobStatuses(
    jobs
      .map(function (j) {
        return j.id ? String(j.id) : "";
      })
      .filter(Boolean)
  );
  await downloadJobsBatch(jobs, "«Скачать выделенное»", FILE_DL_USE_STAGGER);
}

  function detectNewsEnvFromLocation() {
    var origin = "";
    try {
      origin = String(window.location.origin || "").toLowerCase();
    } catch (e) {}
    for (var si = 0; si < NEWS_STAND_KEYS.length; si++) {
      var stand = NEWS_STAND_KEYS[si];
      var byStand = NEWS_ORIGINS[stand];
      if (!byStand) continue;
      for (var ci = 0; ci < NEWS_CONTOUR_KEYS.length; ci++) {
        var contour = NEWS_CONTOUR_KEYS[ci];
        var host = String((byStand && byStand[contour]) || "").toLowerCase();
        if (host && host === origin) {
          return { stand: stand, contour: contour };
        }
      }
    }
    return null;
  }

  function getNewsEnv() {
    var stand =
      NEWS_STAND_KEYS.indexOf(NEWS_UI_STAND) >= 0 ? NEWS_UI_STAND : DEFAULT_NEWS_STAND;
    var contour =
      NEWS_CONTOUR_KEYS.indexOf(NEWS_UI_CONTOUR) >= 0
        ? NEWS_UI_CONTOUR
        : DEFAULT_NEWS_CONTOUR;
    var byStand = NEWS_ORIGINS[stand] || NEWS_ORIGINS[DEFAULT_NEWS_STAND];
    var origin =
      (byStand && byStand[contour]) || NEWS_ORIGINS[DEFAULT_NEWS_STAND][DEFAULT_NEWS_CONTOUR];
    return { stand: stand, contour: contour, origin: origin };
  }

  function delay(ms) {
    return new Promise(function (resolve) {
