<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресурсная панель — Лаунчер</title>
<link rel="icon" href="data:,">
<script>
  /* Тема до первой отрисовки — без вспышки */
  try { if (localStorage.getItem("rp_theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<link rel="stylesheet" href="_shared/tokens.css">
<style>
  /* ——— База ——— */
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: var(--fw-r) var(--fs-m)/1.4 var(--font); -webkit-font-smoothing: antialiased;
    --pad: clamp(16px, 2.6vw, 44px); --rh: 30px; --fs-row: 15px; --cols: 4; --pw: 0px;
    --hero-pt: clamp(14px, 2.6vh, 30px); --fav-gap: clamp(14px, 2.6vh, 26px); --idx-pt: clamp(14px, 2.8vh, 30px);
  }
  /* Режим «один экран»: страница = окно, индекс занимает остаток высоты */
  body.fit { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  body.fit.compact { --hero-pt: 4px; --fav-gap: 8px; --idx-pt: 10px; }
  /* Под шапкой: слева панель групп, справа — поиск, избранное, встречи и индекс */
  .shell { display: flex; align-items: stretch; min-width: 0; }
  body.fit .shell { flex: 1; min-height: 0; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  body.fit .main { min-height: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .ui-i { width: 18px; height: 18px; flex: none; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px) scale(.985); } }

  /* ——— Шапка ——— */
  .top { height: var(--top-h); flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--pad); }
  .lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--g); display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; flex: none; }
  .mark i { width: 3px; border-radius: 2px; background: #fff; }
  .mark i:nth-child(1) { height: 6px; } .mark i:nth-child(2) { height: 11px; } .mark i:nth-child(3) { height: 16px; }
  .brand b { display: block; font: var(--fw-b) var(--fs-l)/1.2 var(--font-d); letter-spacing: -.01em; }
  .brand small { display: block; font-size: 11.5px; color: var(--mut); }
  .acts { display: flex; align-items: center; gap: 8px; }
  .sum { display: flex; align-items: center; gap: 14px; margin-right: 6px; font-size: var(--fs-s); color: var(--ink2); font-variant-numeric: tabular-nums; }
  .sum span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn {
    height: var(--h-m); border-radius: var(--r-m); border: 0; background: var(--sf); box-shadow: var(--sh1);
    display: inline-flex; align-items: center; gap: 8px; padding: 0 13px; cursor: pointer; font-size: var(--fs-m); font-weight: var(--fw-sb);
    position: relative; overflow: hidden; transition: background .15s var(--ease);
  }
  .btn:hover { background: var(--sf2); }
  .btn.ic { width: var(--h-m); padding: 0; justify-content: center; }
  .btn.pri { background: var(--g-btn); color: var(--on-g); box-shadow: none; }
  #gpBtn[data-m="open"], #gpBtn[aria-expanded="true"] { color: var(--g-ink); }
  .btn[disabled] { cursor: default; }
  /* Прогресс проверки — заливка внутри кнопки */
  .btn .prog { position: absolute; inset: auto 0 0 0; height: 2px; background: var(--g); transform-origin: left; transform: scaleX(var(--p, 0)); opacity: 0; transition: transform .12s linear, opacity .2s; }
  .btn.busy .prog { opacity: 1; }
  .btn.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ——— Омнибокс ——— */
  .hero { flex: none; display: flex; flex-direction: column; align-items: center; padding: var(--hero-pt) var(--pad) 0; position: relative; }
  .omni {
    width: min(680px, 100%); height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 18px;
    background: var(--inp); border-radius: var(--r-l); box-shadow: var(--sh2); transition: box-shadow .15s var(--ease);
  }
  .omni:focus-within { box-shadow: 0 0 0 1px var(--g), 0 0 0 5px var(--g-t), var(--sh2); }
  .omni > svg { width: 20px; height: 20px; color: var(--mut); }
  .omni input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: var(--fs-l); font-weight: 500; }
  .omni input::placeholder { color: var(--mut); font-weight: 400; }
  .omni input::-webkit-search-cancel-button { display: none; }
  .cnt { font: 500 var(--fs-xs) var(--mono); color: var(--mut); white-space: nowrap; font-variant-numeric: tabular-nums; }
  kbd { font: 600 10.5px/1 var(--mono); color: var(--ink2); background: var(--sf3); border-radius: 5px; padding: 4px 6px; white-space: nowrap; }
  .clr { width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--mut); cursor: pointer; display: none; place-items: center; }
  .clr:hover { background: var(--sf2); color: var(--ink); }
  .omni.has .clr { display: grid; } .omni.has kbd { display: none; }
  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin-top: 12px; }
  .fg { display: flex; align-items: center; gap: 6px; }
  .fg > span { font-size: 11.5px; color: var(--mut); margin-right: 2px; }
  .chip {
    height: var(--h-s); border-radius: 14px; padding: 0 12px; border: 1px solid var(--line); background: transparent; cursor: pointer;
    font-size: var(--fs-s); font-weight: var(--fw-sb); color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
  }
  .chip:hover { background: var(--sf2); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--g-t); color: var(--g-ink); border-color: transparent; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

  /* ——— Избранное: ряд «иконок приложений» ——— */
  .favs { flex: none; margin-top: var(--fav-gap); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 var(--pad); }
  .cap { font: var(--fw-sb) 13px/1 var(--font); font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--mut); margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); padding: 0 0 0 2px; border-right: 1px solid var(--line); }
  .dock { display: flex; gap: 6px; justify-content: center; max-width: 100%; }
  .app {
    width: 92px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px 5px; border-radius: 14px;
    text-decoration: none; cursor: pointer; transition: background .15s var(--ease), opacity .15s;
  }
  .app:hover { background: var(--sf); }
  .app .sq { width: 56px; height: 56px; border-radius: 16px; background: var(--sf2); box-shadow: var(--sh1); display: grid; place-items: center; position: relative; color: var(--ink2); }
  .app .sq .ui-i { width: 24px; height: 24px; }
  .app .sq .dot { position: absolute; top: 6px; right: 6px; }
  .app .sq .cp { position: absolute; bottom: -3px; right: -3px; width: 20px; height: 20px; border-radius: 7px; background: var(--sf3); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; color: var(--ink2); }
  .app .sq .cp .ui-i { width: 12px; height: 12px; }
  .app .lb { max-width: 100%; font-size: var(--fs-xs); font-weight: var(--fw-sb); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app .tags { min-height: 19px; }
  .app.over { display: none; }
  .app.down .lb { color: var(--mut); }
  .app.mute { opacity: .3; }
  body.compact .app .sq { width: 44px; height: 44px; border-radius: 13px; }
  body.compact .app { gap: 3px; padding: 3px 2px 2px; }
  body.compact .app .tags { min-height: 17px; }
  body.compact .app .tag { height: 17px; line-height: 17px; }
  body.fit.compact .idx { padding-top: 8px; padding-bottom: 6px; }

  /* ——— Индекс: колонки разделов ——— */
  .idx {
    flex: 1; min-height: 0; width: 100%; max-width: 1900px; margin: 0 auto; padding: var(--idx-pt) var(--pad) 18px;
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: clamp(22px, 2vw, 44px); align-content: start;
  }
  body.fit .idx { overflow: hidden; padding-bottom: 10px; }
  /* Плотная ступень: омнибокс поднимается в строку шапки, сводка — только цифры */
  body.compact .hero { margin-top: calc(-1 * var(--top-h) + 2px); pointer-events: none; }
  body.compact .hero > * { pointer-events: auto; }
  /* в шапке омнибокс центрируется по окну, а не по колонке справа от панели групп */
  body.compact .omni { width: min(520px, 100vw - 800px); translate: calc(var(--pw) / -2) 0; }
  body.compact .filters { margin-top: 8px; translate: calc(var(--pw) / -2) 0; }
  body.compact .sum .lbl { display: none; }
  .col { display: flex; flex-direction: column; gap: calc(var(--rh) * .45); min-width: 0; }
  .sec { min-width: 0; }
  .sh {
    display: flex; align-items: center; gap: 8px; height: calc(var(--rh) + 2px); margin: 0 0 2px; border-bottom: 1px solid var(--line);
    font: var(--fw-sb) var(--fs-l)/1 var(--font); font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--ink2);
  }
  .sh .ui-i { width: 15px; height: 15px; color: var(--mut); }
  .sh em { margin-left: auto; font: 500 var(--fs-xs) var(--mono); font-style: normal; color: var(--mut); letter-spacing: 0; font-variant-caps: normal; }
  .ln {
    display: flex; align-items: center; gap: 8px; height: var(--rh); padding: 0 8px; margin: 0 -8px; border-radius: 8px; width: calc(100% + 16px);
    text-decoration: none; font-size: var(--fs-row); color: var(--ink); cursor: pointer; border: 0; background: none; text-align: left;
  }
  .ln:hover, .ln.kb { background: var(--sf2); }
  .ln.kb { box-shadow: inset 2px 0 0 var(--g); }
  .ln[hidden], .sec[hidden] { display: none !important; }
  .ln > .ui-i { width: 17px; height: 17px; color: var(--mut); }
  .ln .tt { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .cp { width: 14px; height: 14px; color: var(--mut); }
  /* Отточие, как в оглавлении книги: ведёт взгляд от названия к меткам */
  .ln .ld { flex: 1 1 10px; min-width: 0; height: 0; border-bottom: 1px dotted var(--line2); transform: translateY(3px); }
  /* Недоступная ссылка: гаснет только название; иконка, метки и красная точка остаются в цвете */
  .ln.down .tt { color: var(--mut); }
  .sec { border-radius: 10px; transition: background .6s var(--ease), box-shadow .6s var(--ease); }
  .sec.off { display: none; }
  .sec.flash { background: var(--g-t); box-shadow: 0 0 0 8px var(--g-t); transition: none; }
  mark { background: var(--g-t); color: var(--g-ink); border-radius: 3px; padding: 0 1px; }

  /* ——— Встречи Jazz: полоса чипов под избранным ——— */
  .meets { flex: none; margin-top: calc(var(--fav-gap) * .55); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 var(--pad); min-width: 0; }
  .mcap { margin: 0; font: var(--fw-sb) 13px/1 var(--font); font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--mut); white-space: nowrap; }
  .mlist { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-width: 0; max-width: 100%; }
  .mt {
    height: 32px; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; border-radius: 16px;
    background: var(--sf); box-shadow: var(--sh1); text-decoration: none; color: var(--ink); font-size: 13.5px; font-weight: 500; white-space: nowrap;
    transition: background .15s var(--ease), opacity .15s;
  }
  .mt:hover { background: var(--sf2); }
  .mt > .ui-i { width: 16px; height: 16px; color: var(--g-ink); }
  .mt .tt { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .mt.down .tt { color: var(--mut); }
  .mt.mute { opacity: .3; }
  body.compact .mt { height: 27px; }

  /* ——— Панель групп: скрыта / узкая (иконки) / развёрнута ——— */
  .gp { flex: none; width: var(--pw); position: relative; z-index: 36; }
  body:not(.fit) .gp { position: sticky; top: 0; height: 100vh; height: 100dvh; align-self: flex-start; }
  .gp.m-hidden { display: none; }
  .gp-in {
    position: absolute; top: 0; left: 0; bottom: 0; width: 100%; display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid var(--line); transition: width .18s var(--ease), box-shadow .18s var(--ease), background .18s;
  }
  .gp.m-compact.peek .gp-in {
    width: 248px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
    box-shadow: var(--sh3), inset 0 1px 0 var(--glass-edge); border-right-color: transparent; border-radius: 0 var(--r-l) var(--r-l) 0;
  }
  .gp-ttl { display: none; }
  .gp-top { flex: none; padding: 10px 8px 4px; }
  .gs {
    display: flex; align-items: center; gap: 9px; width: 232px; height: 34px; padding: 0 10px; border-radius: var(--r-m);
    background: var(--inp); box-shadow: var(--sh1); transition: width .18s var(--ease), box-shadow .15s;
  }
  .gs:focus-within { box-shadow: 0 0 0 1px var(--g), 0 0 0 4px var(--g-t); }
  .gs .ui-i { width: 16px; height: 16px; color: var(--mut); }
  .gs input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 13.5px; }
  .gs input::placeholder { color: var(--mut); }
  .gs input::-webkit-search-cancel-button { display: none; }
  .gp-all {
    display: flex; align-items: center; gap: 10px; width: 232px; height: 30px; margin: 4px 0 0; padding: 0 10px 0 14px; border: 0; border-radius: 8px;
    background: none; cursor: pointer; color: var(--g-ink); font-size: 12.5px; font-weight: var(--fw-sb); text-align: left; white-space: nowrap;
  }
  .gp-all:hover { background: var(--g-t); }
  .gp-all .ui-i { width: 16px; height: 16px; flex: none; }
  .gp-all em { margin-left: auto; font: 500 11px var(--mono); font-style: normal; color: var(--mut); }
  .gp-all[hidden] { display: none; }
  .gp-list { list-style: none; margin: 0; padding: 4px 8px 8px; flex: 1; min-height: 0; overflow: hidden auto; scrollbar-width: thin; }
  .gr { position: relative; display: flex; align-items: center; width: 232px; border-radius: var(--r-m); }
  .gr:hover { background: var(--sf2); }
  .gr[hidden] { display: none; }
  .gr-go {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 4px 0 6px; border: 0; border-radius: var(--r-m);
    background: none; color: var(--ink2); cursor: pointer; text-align: left;
  }
  .gr:hover .gr-go { color: var(--ink); }
  .gr .ic { width: 28px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gr .ic .ui-i { width: 18px; height: 18px; }
  .gr .ic b { display: none; font: 600 10.5px/1 var(--mono); color: var(--mut); }
  .gr .nm { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gr .nm mark { padding: 0; }
  .gr .c { width: 30px; flex: none; text-align: center; font: 500 11px var(--mono); color: var(--mut); font-variant-numeric: tabular-nums; }
  /* число ссылок и «глаз» делят одно место: при наведении вместо числа — переключатель видимости */
  .gr-eye {
    position: absolute; right: 4px; top: 50%; translate: 0 -50%; width: 30px; height: 30px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: none; color: var(--mut); cursor: pointer; opacity: 0;
  }
  .gr:hover .gr-eye, .gr:focus-within .gr-eye, .gr.off .gr-eye { opacity: 1; }
  .gr:hover .c, .gr:focus-within .c, .gr.off .c { visibility: hidden; }
  .gr-eye:hover { background: var(--sf3); color: var(--ink); }
  .gr-eye .ui-i { width: 16px; height: 16px; }
  .gr.zero .nm, .gr.zero .ic { opacity: .5; }
  .gr.off .ic, .gr.off .nm { opacity: .38; }
  .gr.off .nm { text-decoration: line-through; text-decoration-color: var(--line2); }
  .gr.off .gr-eye { opacity: 1; color: var(--ink2); }
  .gr.pin { background: var(--g-t); }
  .gr.pin .gr-go { color: var(--g-ink); }
  .gp-none { margin: 10px 8px; width: 216px; font-size: 12.5px; color: var(--mut); }
  .gp-hint { flex: none; width: 248px; margin: 0; padding: 8px 14px 12px; font-size: 11.5px; line-height: 1.45; color: var(--mut); border-top: 1px solid var(--line); }
  .gp-hint kbd { font-size: 10px; padding: 2px 4px; }
  /* Узкая панель: иконка + число; название — во всплывающей подсказке, при задержке курсора панель раскрывается поверх */
  .gp.m-compact .gr-go { height: 46px; padding-left: 8px; }
  .gp.m-compact .gr-eye { right: 6px; }
  .gp.m-compact .gr .ic b { display: block; }
  .gp.m-compact .gr .c { display: none; }
  .gp.m-compact:not(.peek) .gs { width: 44px; padding: 0 13px; cursor: text; }
  .gp.m-compact:not(.peek) .gp-hint, .gp.m-compact:not(.peek) .gp-all em { visibility: hidden; }
  .gp.m-compact:not(.peek) .gr-eye, .gp.m-compact:not(.peek) .nm { visibility: hidden; }
  .gp.m-compact:not(.peek) .gr.off { opacity: .8; }
  .gtip {
    position: fixed; z-index: var(--z-tip); left: 0; top: 0; padding: 6px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none;
    font-size: 12.5px; font-weight: var(--fw-sb); opacity: 0; transition: opacity .1s;
  }
  .gtip.on { opacity: 1; }
  .gtip small { margin-left: 8px; font: 500 11px var(--mono); color: var(--mut); }

  /* ——— Метки и статус ——— */
  .tags { display: flex; gap: 4px; flex: none; }
  .tag { height: 19px; padding: 0 5px; border-radius: 5px; font: var(--fw-sb) 10.5px/19px var(--mono); background: var(--t); color: var(--c); white-space: nowrap; }
  .e-PROM { --c: var(--env-prom); --t: var(--env-prom-t); } .e-PSI { --c: var(--env-psi); --t: var(--env-psi-t); }
  .e-IFT { --c: var(--env-ift); --t: var(--env-ift-t); } .s-ALPHA { --c: var(--seg-alpha); --t: var(--seg-alpha-t); }
  .s-SIGMA { --c: var(--seg-sigma); --t: var(--seg-sigma-t); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--mut); }
  .ok .dot, .dot.ok { background: var(--g); }
  .down .dot, .dot.down { background: var(--red); }
  .wait .dot, .dot.wait { background: transparent; box-shadow: inset 0 0 0 1.6px var(--mut); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--ink2); animation: enter .18s var(--ease); }
  .empty b { display: block; font: var(--fw-sb) var(--fs-l) var(--font-d); color: var(--ink); margin-bottom: 6px; }
  .empty .btn { margin-top: 14px; }

  /* ——— Стекло: подсказка, модалка, панель, тосты ——— */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: var(--sh3), inset 0 1px 0 var(--glass-edge); }
  .tip {
    position: fixed; z-index: var(--z-tip); left: 0; top: 0; width: max-content; max-width: 380px; padding: 12px 14px; border-radius: 12px;
    pointer-events: none; font-size: var(--fs-s); opacity: 0; transition: opacity .12s var(--ease);
  }
  .tip.on { opacity: 1; }
  .tip h3 { margin: 0 0 3px; font: var(--fw-b) var(--fs-m) var(--font); }
  .tip .u { font: 11px/1.45 var(--mono); color: var(--ink2); word-break: break-all; margin-bottom: 8px; }
  .tip dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  .tip dt { color: var(--mut); } .tip dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .tip dd code { font: 11px var(--mono); }
  .tip .st { display: inline-flex; align-items: center; gap: 6px; }
  .tip .hint { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--mut); font-size: var(--fs-xs); }
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: var(--z-modal); display: none; }

<script>
(function () {
  "use strict";
  var D = window.LINKS, I = window.SpodIcons.svg;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var ENV = { PROM: "PROM", PSI: "ПСИ", IFT: "ИФТ" }, SEG = { ALPHA: "Alpha", SIGMA: "Sigma" };
  var secById = {}; D.sections.forEach(function (s) { secById[s.id] = s; });
  var byId = {}; D.links.forEach(function (l) { byId[l.id] = l; });
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform);

  /* ——— Хранилище (может быть недоступно) ——— */
  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ——— Утилиты ——— */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function host(u) { try { return new URL(u).host; } catch (e) { return ""; } }
  function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function iconOf(l) { return l.icon || secById[l.s].icon; }
  function tagsHtml(l) {
    return '<span class="tags">' + (l.env ? '<span class="tag e-' + l.env + '">' + ENV[l.env] + "</span>" : "") +
      (l.seg ? '<span class="tag s-' + l.seg + '">' + l.seg + "</span>" : "") + "</span>";
  }
  function ariaOf(l) {
    return l.t + (l.env ? ", стенд " + ENV[l.env] : "") + (l.seg ? ", сегмент " + SEG[l.seg] : "") +
      (l.copy ? ", при открытии копируется код" : "") + (l.tool ? ", инструмент" : "");
  }

  /* ——— Доступность ссылок (реальная проверка через RPProbe) ——— */
  var st = {}, checking = false;
  function setStatus(id, s) {
    st[id] = s;
    $$('[data-id="' + id + '"]').forEach(function (el) { el.classList.remove("ok", "down", "wait"); el.classList.add(s.s); });
  }
  function initStatus() {
    D.links.forEach(function (l) { st[l.id] = l.tool ? { s: "ok", local: true } : { s: "wait" }; });
  }
  function renderSum() {
    var c = { ok: 0, down: 0, wait: 0 };
    D.links.forEach(function (l) { if (!l.tool) c[st[l.id].s]++; });
    $("#sum").innerHTML =
      '<span title="Доступны"><i class="dot ok"></i>' + c.ok + '<span class="lbl">&nbsp;доступны</span></span>' +
      '<span title="Недоступны"><i class="dot down"></i>' + c.down + '<span class="lbl">&nbsp;недоступны</span></span>' +
      (c.wait ? '<span title="Проверяются"><i class="dot wait"></i>' + c.wait + "</span>" : "");
  }
  // Проверка: все ссылки уходят в «проверяется» и возвращаются по мере ответа хостов.
  // manual — запуск кнопкой «Проверить» (с тостом по итогу); автоповтор идёт молча.
  function refresh(manual) {
    if (checking) return;
    var b = $("#refresh");
    checking = true; b.disabled = true; b.classList.add("busy"); b.style.setProperty("--p", 0);
    window.RPProbe.run(D.links, {
      onStart: function (id) { setStatus(id, { s: "wait" }); },
      onResult: function (id, r) {
        setStatus(id, r.st === "up" ? { s: "ok", ms: r.ms, at: r.at } : { s: "down", err: r.err, ms: r.ms, at: r.at });
      },
      onProgress: function (done, total) {
        b.style.setProperty("--p", total ? done / total : 1);
        if (done === 0 || done % 6 === 0 || done === total) renderSum();
      },
      onDone: function (sum) {
        renderSum();
        setTimeout(function () { checking = false; b.disabled = false; b.classList.remove("busy"); }, 250);
        if (manual === true) toast("check", "Проверка завершена: " + sum.up + " из " + sum.total + " доступны");
      }
    });
  }

  /* ——— Фильтры и поиск ——— */
  var F = { env: "", seg: "", q: "" };
  function hay(l) {
    var s = secById[l.s];
    return [l.t, host(l.u || ""), s.name, l.env ? l.env + " " + ENV[l.env] : "", l.seg ? l.seg + " " + SEG[l.seg] : "", l.copy || ""].join(" ").toLowerCase();
  }
  var HAY = {}; D.links.forEach(function (l) { HAY[l.id] = hay(l); });
  function tokens() { return F.q.toLowerCase().split(/\s+/).filter(Boolean); }
  function matches(l, tk) {
    if (F.env && l.env !== F.env) return false;
    if (F.seg && l.seg !== F.seg) return false;
    return tk.every(function (t) { return HAY[l.id].indexOf(t) >= 0; });
  }
  // Подсветка найденных фрагментов в названии
  function hl(text, tk) {
    if (!tk.length) return esc(text);
    var low = text.toLowerCase(), marks = [];
    tk.forEach(function (t) { var i = low.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = low.indexOf(t, i + t.length); } });
    if (!marks.length) return esc(text);
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", pos = 0;
    marks.forEach(function (m) { if (m[0] < pos) return; out += esc(text.slice(pos, m[0])) + "<mark>" + esc(text.slice(m[0], m[1])) + "</mark>"; pos = m[1]; });
    return out + esc(text.slice(pos));
  }
  function chips(box, key, opts) {
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", o[0] === F[key] ? "true" : "false");
      b.innerHTML = (o[2] ? '<i style="--c:var(' + o[2] + ')"></i>' : "") + o[1];
      b.onclick = function () {
        F[key] = o[0];
        $$(".chip", box).forEach(function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
        apply();
      };
      box.appendChild(b);
    });
  }
  var visibleCount = 0;
  function apply() {
    var tk = tokens(), n = 0;
    D.links.forEach(function (l) {
      var on = matches(l, tk), el = lineEl[l.id] || meetEl[l.id];
      if (on) n++;
      if (lineEl[l.id]) el.hidden = !on; else el.classList.toggle("mute", !on);
      el.querySelector(".tt").innerHTML = hl(l.t, tk);
    });
    D.sections.forEach(function (s) {
      var sec = secEl[s.id], v = $$(".ln:not([hidden])", sec).length;
      sec.hidden = !v; $("em", sec).textContent = v; secN[s.id] = v;
    });
    paintGroups();
    $$(".app", $("#dock")).forEach(function (a) { a.classList.toggle("mute", !matches(byId[a.dataset.id], tk)); });
    visibleCount = n;
    $("#cnt").textContent = (tk.length || F.env || F.seg) ? n + " из " + D.links.length : D.links.length + " ссылок";
    $("#omni").classList.toggle("has", !!F.q);
    setActive(-1);
    if (laidOut) placeColumns(curCols); else layout();
  }

  /* ——— Отрисовка индекса ——— */
  var lineEl = {}, secEl = {}, meetEl = {}, secN = {};
  function buildIndex() {
    D.sections.forEach(function (s) {
      var sec = document.createElement("section");
      sec.className = "sec"; sec.setAttribute("aria-labelledby", "h-" + s.id);
      sec.innerHTML = '<h2 class="sh" id="h-' + s.id + '">' + I(s.icon) + "<span>" + esc(s.name) + "</span><em></em></h2>";
      D.links.filter(function (l) { return l.s === s.id && !l.meet; }).forEach(function (l) {
        var el = document.createElement(l.tool ? "button" : "a");
        if (l.tool) el.type = "button"; else { el.href = l.u; el.target = "_blank"; el.rel = "noopener"; }
        el.className = "ln " + st[l.id].s; el.id = "ln-" + l.id; el.dataset.id = l.id;
        el.setAttribute("aria-label", ariaOf(l));
        el.innerHTML = I(iconOf(l)) + '<span class="tt"></span>' + (l.copy ? I("copy", "ui-i cp") : "") +
          '<span class="ld"></span>' + tagsHtml(l) + '<span class="dot"></span>';
        lineEl[l.id] = el; sec.appendChild(el);
      });
      secEl[s.id] = sec; sec.id = "sec-" + s.id;
    });
  }
  // Встречи Jazz (meet:true) — отдельной полосой под избранным, в индексе их нет
  function buildMeets() {
    var box = $("#meets");
    D.links.filter(function (l) { return l.meet; }).forEach(function (l) {
      var a = document.createElement("a");
      a.className = "mt " + st[l.id].s; a.href = l.u; a.target = "_blank"; a.rel = "noopener"; a.dataset.id = l.id;
      a.setAttribute("aria-label", "Встреча: " + ariaOf(l));
      a.innerHTML = I("video") + '<span class="tt"></span><span class="dot"></span>';
      meetEl[l.id] = a; box.appendChild(a);
    });
    if (!box.children.length) box.parentNode.hidden = true;
  }

  /* ——— Избранное по частоте кликов ——— */
  var clicks = load("rp_clicks", {});
  function favIds() {
    var ids = Object.keys(clicks).filter(function (id) { return byId[id] && !byId[id].meet && clicks[id] > 0; })
      .sort(function (a, b) { return clicks[b] - clicks[a]; });
    D.favoriteSeed.forEach(function (id) { if (ids.indexOf(id) < 0 && byId[id] && !byId[id].meet) ids.push(id); });
    return ids.slice(0, 10);
  }
  function renderDock() {
    var dock = $("#dock"); dock.innerHTML = "";
    favIds().forEach(function (id) {
      var l = byId[id], a = document.createElement("a");
      a.className = "app " + st[id].s; a.href = l.u; a.target = "_blank"; a.rel = "noopener"; a.dataset.id = id;
      a.setAttribute("aria-label", ariaOf(l));
      a.innerHTML = '<span class="sq">' + I(iconOf(l)) + '<span class="dot"></span>' + (l.copy ? '<span class="cp">' + I("copy") + "</span>" : "") +
        '</span><span class="lb">' + esc(l.t) + "</span>" + tagsHtml(l);
      dock.appendChild(a);
    });
    if (laidOut) fitDock();
  }

  /* ——— Раскладка «в один экран»: колонки по числу строк, плотность ступенями ——— */
  // Разбиение разделов по колонкам подряд (сохраняя порядок) с минимальной высотой самой длинной
  function partition(w, k) {
    var n = w.length; k = Math.min(k, n);
    var pre = [0]; w.forEach(function (x, i) { pre[i + 1] = pre[i] + x; });
    var best = [], cut = [];

  $("#clr").onclick = function () { $("#q").value = ""; F.q = ""; apply(); $("#q").focus(); };
  document.addEventListener("keydown", function (e) {
    var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" || (e.key === "/" && !typing)) {
      if (layer) return; e.preventDefault(); $("#q").focus(); $("#q").select();
    }
    if (e.key === "Escape" && layer) closeLayer();
    if (e.key === "Tab" && layer) trap(e);
  });

  /* ——— Модалка инструмента и панель администрирования ——— */
  var layer = null, back = null;
  function openLayer(el, focusEl) {
    back = document.activeElement; layer = el; hideTip();
    $("#scrim").classList.add("on"); el.classList.add("on");
    var f = focusEl || el.querySelector("input, textarea, select, button:not(.x)") || el.querySelector("button"); if (f) f.focus();
  }
  function closeLayer() {
    if (!layer) return; layer.classList.remove("on"); $("#scrim").classList.remove("on");
    if (layer.id === "drawer") $("#lock").innerHTML = I("lock");
    if (layer.id === "gp") $("#gpBtn").setAttribute("aria-expanded", "false");
    layer = null; if (back) back.focus();
  }
  function trap(e) {
    var f = $$("button:not([disabled]), input, textarea, select", layer).filter(function (x) { return x.offsetParent !== null; }); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  $("#scrim").onclick = closeLayer;
  var closeBtn = '<button class="btn ic x" type="button" aria-label="Закрыть">' + I("close") + "</button>";
  function openTool(l) {
    var m = $("#modal"), dec = l.tool === "decoder";
    m.innerHTML = closeBtn + '<h2 id="mTitle">' + esc(l.t) + "</h2><p>" +
      (dec ? "Разбирает строку permission на роли и права. Макет — расчёта нет." : "Проверяет, какие роли выданы сотруднику на стенде ПСИ. Макет — запроса нет.") + "</p>" +
      (dec ? '<label class="f">Строка permission<textarea id="tIn" placeholder="Вставьте значение из заголовка или лога"></textarea></label>'
           : '<label class="f">Табельный номер<input id="tIn" inputmode="numeric" placeholder="например, 01803187"></label><label class="f">Стенд<select><option>ПСИ · Alpha</option><option>ПСИ · Sigma</option></select></label>') +
      '<div class="out" id="tOut" hidden></div><div class="row"><button class="btn" type="button" id="tCancel">Отмена</button><button class="btn pri" type="button" id="tGo">' + (dec ? "Декодировать" : "Проверить роль") + "</button></div>";
    $(".x", m).onclick = closeLayer; $("#tCancel").onclick = closeLayer;
    $("#tGo").onclick = function () {
      var o = $("#tOut"); o.hidden = false;
      o.textContent = $("#tIn").value.trim() ? (dec ? "Результат появится в рабочей версии инструмента." : "Роль будет проверена в рабочей версии инструмента.") : "Сначала заполните поле выше.";
    };
    openLayer(m);
  }
  function openAdmin() {
    var d = $("#drawer");
    d.innerHTML = closeBtn + '<h2 id="dTitle">Администрирование</h2><p>Служебные скрипты панели. Видны только вам.</p>' +
      '<div class="es">' + I("bundle") + "Скрипты администрирования будут подключаться отдельными файлами по кнопке" +
      '<br><button class="btn pri" type="button" id="addScr">' + I("plus") + "Подключить скрипт</button></div>" +
      '<h3 class="sub">Ожидают подключения</h3>' +
      [["Проверка ссылок по расписанию", "Опрос всех адресов раз в 15 минут"], ["Выгрузка списка ссылок", "CSV для Confluence"], ["Сверка кодов доступа", "Поиск устаревших кодов копирования"]]
        .map(function (s) { return '<div class="scr" aria-disabled="true">' + I("file") + "<div><b>" + s[0] + "</b><small>" + s[1] + '</small></div><span class="tag">не подключён</span></div>'; }).join("");
    $(".x", d).onclick = closeLayer;
    $("#addScr").onclick = function () { toast("check", "Подключение файлов появится в рабочей версии"); };
    $("#lock").innerHTML = I("unlock");
    openLayer(d);
  }

  /* ——— Тема ——— */
  function paintTheme() {
    var light = document.documentElement.getAttribute("data-theme") === "light", b = $("#theme");
    b.innerHTML = I(light ? "moon" : "sun"); b.setAttribute("aria-label", light ? "Включить тёмную тему" : "Включить светлую тему");
  }
  $("#theme").onclick = function () {
    var light = document.documentElement.getAttribute("data-theme") !== "light";
    document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
    try { localStorage.setItem("rp_theme", light ? "light" : "dark"); } catch (e) {}
    paintTheme();
  };

  /* ——— Старт ——— */
  $("#refIc").innerHTML = I("refresh"); $("#sIc").outerHTML = I("search"); $("#clr").innerHTML = I("close"); $("#lock").innerHTML = I("lock");
  $("#kbdK").textContent = isMac ? "⌘ K" : "Ctrl K";
  $("#refresh").onclick = function () { refresh(true); }; $("#lock").onclick = openAdmin;
  $("#subt").textContent = D.links.length + " рабочих ссылок · " + D.sections.length + " разделов";
  chips($("#fEnv"), "env", [["", "Все"], ["PROM", "PROM", "--env-prom"], ["PSI", "ПСИ", "--env-psi"], ["IFT", "ИФТ", "--env-ift"]]);
  chips($("#fSeg"), "seg", [["", "Все"], ["ALPHA", "Alpha", "--seg-alpha"], ["SIGMA", "Sigma", "--seg-sigma"]]);
  $("#gpBtn").innerHTML = I("xpanel"); $("#gpX").innerHTML = I("close"); $("#gsIc").outerHTML = I("search"); $("#gaIc").outerHTML = I("xeye");
  paintTheme(); initStatus(); buildIndex(); buildMeets(); buildGroups();
  D.sections.forEach(function (s) { secEl[s.id].classList.toggle("off", OFF.indexOf(s.id) >= 0); });
  renderDock(); renderSum(); apply();
  refresh(); window.RPProbe.every(120000, function () { refresh(); });
  var rT = 0; window.addEventListener("resize", function () { clearTimeout(rT); rT = setTimeout(layout, 80); });
  if (window.innerWidth >= 767) $("#q").focus(); else $("#q").placeholder = "Поиск ссылок";
})();
</script>
</body>
